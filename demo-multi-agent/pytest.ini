[pytest]
# Layered roots:
#   tests/                  — framework + integration suite
#   packs/*/tests/          — pack-specific suites (layer B)
testpaths = tests packs
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# JUnit XML is consumed by Sonar (sonar.python.xunit.reportPath) and
# TestHub via walmart-devtools-pytest-reporter-testburst.
# Coverage XML is consumed by Sonar (sonar.python.coverage.reportPaths).
addopts = -v --tb=short --strict-markers --junitxml=test-results.xml --cov-report=xml --cov=.
markers =
    unit: in-process tests with stubbed external dependencies (default suite)
    integration: in-process FastAPI TestClient tests with mocked service layer
    functional: service-layer flow tests below the HTTP boundary (no app, no DB, no LLM)
    contract: pin Pydantic schemas, closed-enum tool types, and documented HTTP route surface
    e2e: over-the-wire tests against a running server at E2E_BASE_URL
    resiliency: live-server degradation tests against TARGET_HOST (KITT resiliency gate)
    performance: timing regression guards for hot code paths
    slow: opt-in tag for tests that take noticeably longer than the rest of the bucket
    asyncio: mark test as using asyncio
