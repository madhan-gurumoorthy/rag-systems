<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="matbot A2A test console — JSON-RPC 2.0 over POST /a2a (message/send + message/stream)"
    />
    <title>matbot · local console</title>
    <script>
      // Pre-React theme bootstrap. Light is the default; this script
      // adds the `.dark` class only when the operator explicitly
      // picked dark. Inlined here so it runs before any paint —
      // without it, dark-mode operators see a light-to-dark flash on
      // every cold load.
      (function () {
        try {
          var stored = window.localStorage.getItem("matbot:theme");
          if (stored === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          document.documentElement.style.colorScheme =
            document.documentElement.classList.contains("dark") ? "dark" : "light";
        } catch (e) {
          /* localStorage unavailable — light default stands. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
