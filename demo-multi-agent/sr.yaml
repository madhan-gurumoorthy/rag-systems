schemaVersion: 1.0.0

notify:
  slack:
    channelName: matbot-kitt-agent-factory

# One SR application per deployable service:
#   - ITEM-OPS-MATBOT-MULTI-AGENTS         — parent runtime (PACK_ID=devops_health_check)
#   - ITEM-OPS-MATBOT-GIF-TOTE-VALIDATION  — gif_tote_validation pack
#
# Each declares consumerIdInfos so partner services can authenticate to
# its /a2a/* APIs through the Istio service mesh. consumerId is a fresh
# UUID per service-env; publicKey is shared across services (same RSA
# keypair issued for the matbot-multi-agents runtime).
applications:

  - name: ITEM-OPS-MATBOT-MULTI-AGENTS
    key: ITEM-OPS-MATBOT-MULTI-AGENTS
    description: >
      matbot multi-agent runtime — parent service that hosts the React
      landing page at stage.agentfactory.matbot.walmart.com and runs the
      devops_health_check reference pack. Provides the shared FastAPI
      /a2a/* surface that every pack child also exposes.
    teamRostersProductId: 5772
    serviceNowApmId: APM0019161
    businessCriticality: MAJOR
    communication:
      slack:
        - channel: matbot-kitt-agent-factory
      email:
        - address: HPL_Pipeline_Support@email.wal-mart.com
        - address: muthukrishnan.gurusamy@walmart.com
    members:
      - homeoffice\m0g0m5q
      - homeoffice\r0m08w0
      - homeoffice\s0s0f76

    environments:
      - name: stage
        type: STAGING
        description: Staging Service
        externalCatalog: false
        serviceType: REST
        properties:
          swaggerEndpoint:
            - https://stage.agentfactory.matbot.walmart.com/openapi.json
        soaIntegration:
          serviceVersion: 1.0.0
          endPoint: https://stage.agentfactory.matbot.walmart.com
          contract: https://stage.agentfactory.matbot.walmart.com/openapi.json
          environmentName: stage
        serviceMeshConfig:
          deploymentType: WCNP
          defaultIngressConfig:
            requestTimeout: 300000
          ingressListeners:
            - protocol: HTTP
              applicationHost: 127.0.0.1
              applicationPort: 8000
              enablePolicyEngine: true
              passthroughURIs:
                - uri: "/"
                  methods:
                    - GET
                - uri: "/assets/.*"
                  methods:
                    - GET
                - uri: "/openapi.json"
                  methods:
                    - GET
                - uri: "/docs"
                  methods:
                    - GET
                - uri: "/redoc"
                  methods:
                    - GET
                - uri: "/dashboard"
                  methods:
                    - GET
                - uri: "/api/dashboard/.*"
                  methods:
                    - GET
                - uri: "/api/factory/.*"
                  methods:
                    - GET
                - uri: "/api/pack/info"
                  methods:
                    - GET
                - uri: "/.well-known/agents.json"
                  methods:
                    - GET
                - uri: "/healthz"
                  methods:
                    - GET
                - uri: "/readyz"
                  methods:
                    - GET
                - uri: "/metrics"
                  methods:
                    - GET
                - uri: "/.*"
                  methods:
                    - OPTIONS
        consumerIdInfos:
          - consumerId: 4b91fc6e-07df-408f-a629-9f0b429b14f6
            publicKey: 

