# Sonar settings
sonar.projectKey=MATBOT-MULTI-AGENTS
sonar.projectName=MATBOT-MULTI-AGENTS
sonar.projectVersion=1.0
sonar.projectDescription=Multi-pack agent runtime hosting Walmart automation agents (gif_tote_validation today; more packs to come) on a shared FastAPI / LangGraph substrate.
sonar.ws.timeout=360
sonar.host.url=https://sonar.prod.walmart.com
sonar.verbose=false
sonar.log.level=INFO
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

# Python Sonar settings
sonar.language=python
sonar.python.version=3.12

# Paths — first-party code lives in agent_factory/, storage/, packs/, app.py.
sonar.sources=agent_factory,storage,packs,app.py
sonar.tests=tests

# Test reporting
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=**/cfg/**, **/tests/**, **/__init__.*, **.xml, **.sql, **.txt, **.yml, **.yaml, **/Dockerfile*, **/__pycache__/**, **/env*/**, **/packs/_example/**, packs/offer_intelligence/services/siv_service.py
sonar.coverage.exclusions=**/cfg/**, **/tests/**, **/__init__.*, **.xml, **.sql, **.txt, **.yml, **.yaml, **/Dockerfile*, **/__pycache__/**, **/env*/**, **/packs/_example/**, packs/offer_intelligence/services/siv_service.py
