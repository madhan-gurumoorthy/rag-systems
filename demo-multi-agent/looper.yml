
parameters:
  - userId: { type: string, defaultValue: "matbot" }
  - executionName: { type: string, defaultValue: "matbot" }
  - testrunid: { type: string }
  - cid: { type: string }
  - env: { type: string }
  - be_url: { type: string }

envs:
  global:
    variables:
      type: "suite"
      testBurst: true
      userId: $userId
      executionName: $executionName
      TESTCONTAINERS_RYUK_DISABLED: true

docker:
  - name: 'python-agent'
    image: 'docker.ci.artifacts.walmart.com/devtools-docker/python-looper-agent:3.12-main'
    bindingsEnabled: false

flows:
  unit_tests:
    try:
      - echo "Starting unit tests"
      - node(docker-daemon):
        - dockguardAgent(looper-agent): |
            #!/bin/bash
            export PYTHONPATH=$PWD
            echo CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTRUNID=${testrunid} userId=${userId}
            export CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTTYPE=unit ENV=${env} TESTRUNID=${testrunid}
            pip3 config --user set global.extra-index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/devtools-pypi/simple
            pip3 config --user set global.index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/pythonhosted-pypi-release-remote/simple
            pip3 config --user set global.trusted-host pypi.ci.artifacts.walmart.com
            pip3 install --no-cache-dir -r requirements.txt
            export ENV_FOR_DYNACONF="test"
            pytest ./tests/unit -vv --cov-report xml --cov=. --junitxml=test-output.xml || true
    catch:
      - echo "Unit tests failed, but continuing execution"

  functional_tests:
    try:
      - echo "Starting functional tests"
      - node(docker-daemon):
        - dockguardAgent(looper-agent): |
            #!/bin/bash
            export PYTHONPATH=$PWD
            echo CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTRUNID=${testrunid} userId=${userId}
            export CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTTYPE=functional ENV=${env} TESTRUNID=${testrunid}
            pip3 config --user set global.extra-index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/devtools-pypi/simple
            pip3 config --user set global.index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/pythonhosted-pypi-release-remote/simple
            pip3 config --user set global.trusted-host pypi.ci.artifacts.walmart.com
            pip3 install --no-cache-dir -r requirements.txt
            export ENV_FOR_DYNACONF="test"
            pytest ./tests/functional -vv --cov-report xml --cov=. --junitxml=test-output.xml || true
    catch:
      - echo "Functional tests failed, but continuing execution"

  integration_tests:
    try:
      - echo "Starting integration tests"
      - node(docker-daemon):
        - dockguardAgent(looper-agent): |
            #!/bin/bash
            export PYTHONPATH=$PWD
            echo CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTRUNID=${testrunid} userId=${userId}
            export CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTTYPE=integration ENV=${env} TESTRUNID=${testrunid}
            pip3 config --user set global.extra-index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/devtools-pypi/simple
            pip3 config --user set global.index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/pythonhosted-pypi-release-remote/simple
            pip3 config --user set global.trusted-host pypi.ci.artifacts.walmart.com
            pip3 install --no-cache-dir -r requirements.txt
            export ENV_FOR_DYNACONF="test"
            pytest ./tests/integration -vv --cov-report xml --cov=. --junitxml=test-output.xml || true
    catch:
      - echo "Integration tests failed, but continuing execution"

  e2e_tests:
    try:
      - echo "Starting E2E tests"
      - node(docker-daemon):
        - dockguardAgent(looper-agent): |
            #!/bin/bash
            export PYTHONPATH=$PWD
            echo CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTRUNID=${testrunid} userId=${userId}
            export CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTTYPE=e2e ENV=${env} TESTRUNID=${testrunid}
            # E2E target defaults to the gif_tote_validation pack since it is
            # the only deployable pack today. When additional packs land, pass
            # `be_url` explicitly to point the suite at the target hostname.
            case "${env}" in
              stage) export E2E_BASE_URL="https://stage.gif-tote-validation.matbot.walmart.com" ;;
              *)     export E2E_BASE_URL="${be_url:-https://stage.gif-tote-validation.matbot.walmart.com}" ;;
            esac
            echo "E2E_BASE_URL=${E2E_BASE_URL}"
            pip3 config --user set global.extra-index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/devtools-pypi/simple
            pip3 config --user set global.index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/pythonhosted-pypi-release-remote/simple
            pip3 config --user set global.trusted-host pypi.ci.artifacts.walmart.com
            pip3 install --no-cache-dir -r requirements.txt
            export ENV_FOR_DYNACONF="test"
            pytest ./tests/e2e -vv --cov-report xml --cov=. --junitxml=test-output.xml || true
    catch:
      - echo "E2E tests failed, but continuing execution"

  contract_tests:
    try:
      - echo "Starting contract tests"
