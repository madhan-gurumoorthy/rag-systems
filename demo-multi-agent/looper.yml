            #!/bin/bash
            export PYTHONPATH=$PWD
            echo CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTRUNID=${testrunid} userId=${userId}
            export CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTTYPE=contract ENV=${env} TESTRUNID=${testrunid}
            pip3 config --user set global.extra-index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/devtools-pypi/simple
            pip3 config --user set global.index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/pythonhosted-pypi-release-remote/simple
            pip3 config --user set global.trusted-host pypi.ci.artifacts.walmart.com
            pip3 install --no-cache-dir -r requirements.txt
            export ENV_FOR_DYNACONF="test"
            pytest ./tests/contract -vv --cov-report xml --cov=. --junitxml=test-output.xml || true
    catch:
      - echo "Contract tests failed, but continuing execution"

  performance_tests:
    try:
      - echo "Starting performance tests"
      - node(docker-daemon):
        - dockguardAgent(looper-agent): |
            #!/bin/bash
            export PYTHONPATH=$PWD
            echo CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTRUNID=${testrunid} userId=${userId}
            export CONCORDID=${cid} LOOPERID=${LOOPER_RUN_ID} BUILDURL=${BUILD_URL} TESTTYPE=performance ENV=${env} TESTRUNID=${testrunid}
            pip3 config --user set global.extra-index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/devtools-pypi/simple
            pip3 config --user set global.index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/pythonhosted-pypi-release-remote/simple
            pip3 config --user set global.trusted-host pypi.ci.artifacts.walmart.com
            pip3 install --no-cache-dir -r requirements.txt
            export ENV_FOR_DYNACONF="test"
            case "${env}" in
              stage) export PERF_BASE_URL="https://stage.gif-tote-validation.matbot.walmart.com" ;;
              *)     export PERF_BASE_URL="${be_url:-https://stage.gif-tote-validation.matbot.walmart.com}" ;;
            esac
            echo "PERF_BASE_URL=${PERF_BASE_URL}"
            locust -f tests/performance/locustfile.py --headless -u 10 -r 2 --run-time 60s --host=${PERF_BASE_URL} --html=performance-report.html || true
    catch:
      - echo "Performance tests failed, but continuing execution"

  api_spec_drift:
    # Drift gate: regenerate ``specs/api-spec.json`` from FastAPI and
    # fail the build if it differs from the committed copy. Keeps the
    # R2C contract runner's source-of-truth honest — any route or
    # Pydantic schema change must land in the same commit as the
    # regenerated spec.
    try:
      - echo "Starting API spec drift check"
      - node(docker-daemon):
        - dockguardAgent(looper-agent): |
            #!/bin/bash
            set -euo pipefail
            export PYTHONPATH=$PWD
            pip3 config --user set global.extra-index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/devtools-pypi/simple
            pip3 config --user set global.index-url https://pypi.ci.artifacts.walmart.com/artifactory/api/pypi/pythonhosted-pypi-release-remote/simple
            pip3 config --user set global.trusted-host pypi.ci.artifacts.walmart.com
            pip3 install --no-cache-dir -r requirements.txt
            export ENV_FOR_DYNACONF="test"
            python3 scripts/export_api_spec.py
            if ! git diff --exit-code specs/api-spec.json; then
              echo "::error::specs/api-spec.json is out of date."
              echo "Run: python3 scripts/export_api_spec.py && commit the result."
              exit 1
            fi
            echo "API spec is in sync."
    catch:
      - echo "API spec drift check failed — see diff above"
