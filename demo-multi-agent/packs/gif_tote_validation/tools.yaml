# Tool Manifest — GIF Tote Validation Agent
#
# All tools are defined here as YAML config. The factory's ToolExecutor
# handles HTTP calls, ServiceNow operations, auth, response extraction,
# and outcome derivation generically — NO Python code needed.
#
# Config references:
#   {{KEY}} in url_template/headers/body_template resolve from Dynaconf secrets.toml.
#   Auth credentials ALWAYS come from secrets.toml — never in this file.

tools:
  # ── Diagnostic Tools (read-only) ──────────────────────────────────

  - id: DIAG-TICKET-01
    type: python_function
    description: >
      Fetch a ticket by its reference number and extract structured data
      for GIF tote validation.  Calls MatBotServicesClient.ticket_get().
    import: "packs.gif_tote_validation.ticket_tools:fetch_ticket"
    params:
      - name: ticket_ref
        type: str
        required: true
        description: "Ticket reference number (e.g., INC52148837)"
    response:
      processor: passthrough
      outcome_rules:
        - when: "data"
          outcome: "TICKET_FOUND"
        - when: ""
          outcome: "TICKET_NOT_FOUND"
      error_outcomes:
        "404": "TICKET_NOT_FOUND"
        "500": "SERVICE_ERROR"
      include_raw: false
    risk: low
    timeout_seconds: 30


  - id: DIAG-API-01
    type: http_api
    description: >
      Retrieve item dimensions from GIF API (IQS GraphQL) using GTIN and Store ID.
      Returns height, width, depth, weight with UOM codes.
    url_template: "{{GIF_API_URL}}"
    method: POST
    headers:
      WM_CONSUMER.ID: "{{GIF_CONSUMER_ID}}"
      WM_QOS.CORRELATION_ID: "{{_request_id}}"
      WM_SVC.NAME: "{{GIF_SVC_NAME}}"
      WM_SVC.VERSION: "{{GIF_SVC_VERSION}}"
      WM_SVC.ENV: "{{GIF_SVC_ENV}}"
      Content-Type: "application/json"
    body_template:
      ids: ["{{ gtin }}"]
      type: "GTIN"
      storeId: "{{ store_id }}"
    params:
      - name: gtin
        type: str
        required: true
        description: "14-digit GTIN (pad UPC with leading 00)"
      - name: store_id
        type: str
        required: false
        default: ""
        description: "4-digit store number"
    response:
      processor: field_presence
      presence_fields:
        - "data.getGifItem[0].tradeItems[0].tradeItemDimensionsHeightQty"
        - "data.getGifItem[0].tradeItems[0].tradeItemDimensionsWidthQty"
        - "data.getGifItem[0].tradeItems[0].tradeItemDimensionsDepthQty"
      extract_fields:
        dim_uom: "data.getGifItem[0].tradeItems[0].tradeItemDimensionsUomCode"
        height: "data.getGifItem[0].tradeItems[0].tradeItemDimensionsHeightQty"
        width: "data.getGifItem[0].tradeItems[0].tradeItemDimensionsWidthQty"
        depth: "data.getGifItem[0].tradeItems[0].tradeItemDimensionsDepthQty"
        weight_uom: "data.getGifItem[0].tradeItems[0].tradeItemWeightUomCode"
        weight: "data.getGifItem[0].tradeItems[0].tradeItemWeightQty"
        cross_reference: "data.getGifItem[0].crossReferenceLocation"
      outcome_rules:
        - when: "has_fields"
          outcome: "DATA_FOUND"
        - when: ""
          outcome: "DATA_NOT_FOUND"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
      include_raw: false
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  - id: DIAG-API-02
    type: http_api
    description: >
      Determine Gold status and product info from IQS Catalog API.
      Checks BOTH informationProviderTypeCode == "GOLD" AND informationProviderId == "GOLD"
      per the spec (Section 6, Step 2) to determine dimension source authority.
    method: GET
    url_template: "{{IQS_API_URL}}?id={{ gtin }}&type=GTIN&rt=SITI&filterGoldenData=true&rt=PRODUCT"
    headers:
      Accept: "application/json"
      WM_CONSUMER.ID: "{{IQS_CONSUMER_ID}}"
      WM_SVC.NAME: "{{IQS_SVC_NAME}}"
      WM_SVC.VERSION: "{{IQS_SVC_VERSION}}"
      WM_SVC.ENV: "{{IQS_SVC_ENV}}"
      limo_fuel_subscription_id: "{{IQS_LIMO_SUBSCRIPTION_ID}}"
    params:
      - name: gtin
        type: str
        required: true
        description: "14-digit GTIN"
    response:
      processor: count_filter
      array_path: "payload.supplyTradeItems"
      filter_fields:
        - "informationProviderTypeCode=GOLD"
        - "informationProviderId=GOLD"
      extract_fields:
        product_name: "payload.product.product_attributes.product_name.values[0].value|payload.product.product_attributes.product_name.values[0].source_value"
        image_url: "payload.product.product_attributes.main_image.values[0].value|payload.product.product_attributes.main_image.values[0].source_value|payload.product.product_attributes.product_secondary_image_url.values[0].value|payload.product.product_attributes.product_secondary_image_url.values[0].source_value"
      outcome_rules:
        - when: "count > 0"
          outcome: "GOLD"
        - when: "total > 0"
          outcome: "NOT_GOLD"
        - when: ""
          outcome: "API_ERROR"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
      include_raw: false
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  - id: DIAG-API-03
    type: http_api
    description: >
      Retrieve supplier dimensions from Uber API for supplier-side comparison.
      Falls back to POST with empty body if GET returns 405 or 400
      (per spec Section 6, Step 3).
    method: GET
    url_template: "{{UBER_API_URL}}?id={{ gtin }}&type=GTIN&rt=TI"
    headers:
      Accept: "application/json"
      WM_CONSUMER.ID: "{{UBER_CONSUMER_ID}}"
      WM_SVC.NAME: "{{UBER_SVC_NAME}}"
      WM_SVC.VERSION: "{{UBER_SVC_VERSION}}"
      WM_SVC.ENV: "{{UBER_SVC_ENV}}"
      Content-Type: "application/json"
    fallback_methods: ["POST"]
    fallback_on_status_codes: [400, 405]
    params:
      - name: gtin
        type: str
        required: true
        description: "14-digit GTIN"
    response:
      processor: field_presence
      presence_fields:
        - "supplyTradeItems[0].payloadJson.attributes.tradeItemDimensions"
      outcome_rules:
        - when: "has_fields"
          outcome: "DATA_FOUND"
        - when: ""
          outcome: "DATA_NOT_FOUND"
      error_outcomes:
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
      include_raw: false
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  - id: DIAG-LOGIC-01
    type: threshold_check
    description: >
      Validate item dimensions against standard tote constraints.
      Compares each dimension against its limit with unit conversion.
      Tote limits: Height 10.5 IN, Width 13.0 IN, Depth 20.5 IN, Weight 34.55 LB.
    params:
      - name: height
        type: float
        required: true
        description: "Item height"
      - name: width
        type: float
        required: true
        description: "Item width"
      - name: depth
        type: float
        required: true
        description: "Item depth"
      - name: weight
        type: float
        required: true
        description: "Item weight"
      - name: dim_uom
        type: str
        required: false
        description: "Dimension unit of measure (IN, CM, MM). Default: IN"
      - name: weight_uom
        type: str
        required: false
        description: "Weight unit of measure (LB, KG, G, OZ). Default: LB"
    thresholds:
      - "height=10.5"
      - "width=13.0"
      - "depth=20.5"
    weight_threshold: 34.55
    weight_param: "weight"
    dim_uom_param: "dim_uom"
    weight_uom_param: "weight_uom"
    dim_conversions:
      CM: 0.3937
      MM: 0.03937
    weight_conversions:
      KG: 2.205
      G: 0.002205
      OZ: 0.0625
    exceeds_outcome: "OVERSIZED"
    within_outcome: "FITS_TOTE"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 10


  # ── Action Tools (write operations) ──────────────────────────────

  - id: QRY-TICKET-01
    type: python_function
    description: >
      Update an existing ticket — add a work note or comment.
      Calls MatBotServicesClient.ticket_update().
    import: "packs.gif_tote_validation.ticket_tools:update_ticket"
    params:
      - name: ticket_ref
        type: str
        required: true
        description: "Ticket reference number (e.g. INC52148837)"
      - name: comment
        type: str
        required: true
        description: "Work note or comment to add to the ticket"
    response:
      processor: passthrough
      outcome_rules:
        - when: "data"
          outcome: "UPDATE_SUCCESS"
        - when: ""
          outcome: "UPDATE_FAILED"
      include_raw: true
    risk: medium
    timeout_seconds: 30


  - id: QRY-TICKET-02
    type: python_function
    description: >
      Resolve/close a ticket with optional resolution notes.
      Calls MatBotServicesClient.ticket_resolve().
    import: "packs.gif_tote_validation.ticket_tools:resolve_ticket"
    params:
      - name: ticket_ref
        type: str
        required: true
        description: "Ticket reference number (e.g. INC52148837)"
      - name: description
        type: str
        required: false
        description: "Optional resolution notes"
    response:
      processor: passthrough
      outcome_rules:
        - when: "data"
          outcome: "RESOLVE_SUCCESS"
        - when: ""
          outcome: "RESOLVE_FAILED"
      include_raw: true
    risk: medium
    timeout_seconds: 30


  # ── Post-approval action tools ─────────────────────────────────────
  # Called by the action node after approval.  Param names match what
  # _resolve_state_params builds from approved_actions config.

  - id: ACT-WORKNOTES-01
    type: python_function
    description: >
      Add work notes to a ticket (post-approval).  Accepts external_ref
      from pipeline state and comment from the closure summary.
    import: "packs.gif_tote_validation.ticket_tools:add_work_notes"
    params:
      - name: external_ref
        type: str
        required: true
        description: "Ticket reference (from pipeline state)"
      - name: comment
        type: str
        required: true
        description: "Work note content"
    response:
      processor: passthrough
      include_raw: true
    risk: medium
    timeout_seconds: 30

  - id: ACT-PENDING-01
    type: python_function
    description: >
      Set a ticket to Pending status (post-approval).  Adds a work note
      indicating the ticket is awaiting merchant response.
    import: "packs.gif_tote_validation.ticket_tools:set_ticket_pending"
    params:
      - name: external_ref
        type: str
        required: true
        description: "Ticket reference (from pipeline state)"
    response:
      processor: passthrough
      include_raw: true
    risk: medium
    timeout_seconds: 30


  - id: QRY-GIF-01
    type: http_api
    description: >
      Query GIF API for item dimensions (same as DIAG-API-01 but available
      for the ActionAgent during resolution steps).
    url_template: "{{GIF_API_URL}}"
    method: POST
    headers:
      WM_CONSUMER.ID: "{{GIF_CONSUMER_ID}}"
      WM_QOS.CORRELATION_ID: "{{_request_id}}"
      WM_SVC.NAME: "{{GIF_SVC_NAME}}"
      WM_SVC.VERSION: "{{GIF_SVC_VERSION}}"
      WM_SVC.ENV: "{{GIF_SVC_ENV}}"
      Content-Type: "application/json"
    body_template:
      ids: ["{{ gtin }}"]
      type: "GTIN"
      storeId: "{{ store_id }}"
    params:
      - name: gtin
        type: str
        required: true
        description: "14-digit GTIN"
      - name: store_id
        type: str
        required: false
        default: ""
        description: "Store number"
    response:
      processor: passthrough
      include_raw: true
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  - id: QRY-IQS-01
    type: http_api
    description: >
      Query IQS Catalog API for Gold status and product info
      (same as DIAG-API-02 but available for ActionAgent).
    method: GET
    url_template: "{{IQS_API_URL}}?id={{ gtin }}&type=GTIN&rt=SITI&filterGoldenData=true&rt=PRODUCT"
    headers:
      Accept: "application/json"
      WM_CONSUMER.ID: "{{IQS_CONSUMER_ID}}"
      WM_SVC.NAME: "{{IQS_SVC_NAME}}"
      WM_SVC.VERSION: "{{IQS_SVC_VERSION}}"
      WM_SVC.ENV: "{{IQS_SVC_ENV}}"
      limo_fuel_subscription_id: "{{IQS_LIMO_SUBSCRIPTION_ID}}"
    params:
      - name: gtin
        type: str
        required: true
        description: "14-digit GTIN"
    response:
      processor: passthrough
      include_raw: true
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  - id: QRY-UBER01
    type: http_api
    description: >
      Query Uber API for supplier dimensions (same as DIAG-API-03 but
      available for ActionAgent).
    method: GET
    url_template: "{{UBER_API_URL}}?id={{ gtin }}&type=GTIN&rt=TI"
    headers:
      Accept: "application/json"
      WM_CONSUMER.ID: "{{UBER_CONSUMER_ID}}"
      WM_SVC.NAME: "{{UBER_SVC_NAME}}"
      WM_SVC.VERSION: "{{UBER_SVC_VERSION}}"
      WM_SVC.ENV: "{{UBER_SVC_ENV}}"
      Content-Type: "application/json"
    params:
      - name: gtin
        type: str
        required: true
        description: "14-digit GTIN"
    response:
      processor: passthrough
      include_raw: true
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  - id: QRY-ISAM-01
    type: python_function
    description: >
      MOCK iSAM: merchant email by GTIN. Returns a fixed merchant email for any GTIN
      until the real ISAM API is wired. Action update_dimensions is accepted but not persisted.
    import: "packs.gif_tote_validation.isam_mock:mock_isam_lookup"
    params:
      - name: gtin
        type: str
        required: true
        description: "14-digit GTIN (echoed in response; mock ignores value for email resolution)"
      - name: action
        type: str
        required: false
        default: "lookup_merchant_email"
        description: "lookup_merchant_email or update_dimensions (mock)"
      - name: dimensions
        type: str
        required: false
        default: ""
        description: "Reserved for real API (JSON string); ignored in mock"
    response:
      processor: passthrough
      outcome_rules:
        - when: "merchant_email"
          outcome: "EMAIL_FOUND"
        - when: ""
          outcome: "EMAIL_NOT_FOUND"
      include_raw: true
    risk: low
    timeout_seconds: 10


  # ── Email (Merchant Outreach — MatBot Common Services) ────────────

  - id: ACT-EMAIL-01
    type: python_function
    description: >
      Send merchant outreach email for dimension review. Delegates to the
      MatBot Common Services /email/send endpoint. Builds an HTML email
      with incident details, item dimensions, tote constraints, and
      reply instructions.
    import: "packs.gif_tote_validation.email_sender:send_merchant_outreach"
    params:
      - name: to_address
        type: str
        required: true
        description: "Merchant email address (from iSAM lookup via QRY-ISAM-01)"
      - name: incident_number
        type: str
        required: true
        description: "ServiceNow incident number (e.g., INC52148837)"
      - name: gtin
        type: str
        required: true
        description: "14-digit GTIN for the item"
      - name: item_dims
        type: str
        required: true
        description: "Item dimensions string (e.g., '12.3 × 8.1 × 5.2 IN, 10.5 LB')"
      - name: tote_dims
        type: str
        required: false
        default: "10.5 × 13.0 × 20.5 IN, 34.55 LB max"
        description: "Tote constraint string (default: standard GIF tote)"
      - name: gold_dims
        type: str
        required: false
        default: ""
        description: "Gold (IQS) dimensions string (e.g., '14.2 × 9.8 × 6.1 IN, 12.3 LB') from DIAG-API-01/QRY-GIF-01"
      - name: supplier_dims
        type: str
        required: false
        default: ""
        description: "Supplier (Uber) dimensions string (e.g., '13.5 × 10.0 × 5.8 IN, 11.7 LB') from DIAG-API-03/QRY-UBER01"
      - name: item_id
        type: str
        required: false
        default: ""
        description: "Walmart Item Number / WIN (e.g., '10536149') from DIAG-TICKET-01 ticket data"
      - name: item_description
        type: str
        required: false
        default: ""
        description: "Product name/description from catalog (e.g., 'Purina Friskies Prime Filets, 5.5 oz Can')"
      - name: store_report
        type: str
        required: false
        default: ""
        description: "Store associate's reported issue text from the SNOW incident description (quoted in email)"
      - name: additional_context
        type: str
        required: false
        default: ""
        description: "Optional extra context to include in the email body"
      - name: cc_address
        type: str
        required: false
        default: ""
        description: "Optional CC recipient(s), comma-separated"
      - name: is_gold
        type: str
        required: false
        default: "true"
        description: "Whether item has Gold dimensions ('true'/'false'). Controls email language: 'golden' vs 'supplier' per spec Section 9.1."
    response:
      processor: passthrough
      outcome_rules:
        - when: "success == true"
          outcome: "EMAIL_SENT"
        - when: "success == false"
          outcome: "EMAIL_FAILED"
      include_raw: true
    risk: medium
    timeout_seconds: 30


  # ── Uber Keys (Entity Mapping — UPC/SI → GTIN) ────────────────────

  - id: DIAG-UBERKEYS-01
    type: http_api
    description: >
      Look up GTIN via Uber Keys entity-mapping API. Supports two mapping types:
      WUPC_TO_GTIN (resolve GTIN from UPC barcode) and SI_TO_GTIN (resolve GTIN
      from Walmart Item Number / WIN). Returns the mapped GTIN or empty if not found.
    method: GET
    url_template: "{{UBER_KEYS_BASE_URL}}"
    query_params:
      key: "{{ key }}"
      type: "{{ mapping_type }}"
    headers:
      WM_CONSUMER.ID: "{{UBER_KEYS_CONSUMER_ID}}"
      WM_SVC.ENV: "{{UBER_KEYS_SVC_ENV}}"
      WM_MART_ID: "0"
      WM_SVC.NAME: "{{UBER_KEYS_SVC_NAME}}"
      wm_svc.version: "{{UBER_KEYS_SVC_VERSION}}"
      Content-Type: "application/json"
    params:
      - name: key
        type: str
        required: true
        description: "The identifier to look up (UPC barcode or Walmart Item Number)"
      - name: mapping_type
        type: str
        required: true
        description: "Mapping type: 'WUPC_TO_GTIN' or 'SI_TO_GTIN'"
    response:
      processor: passthrough
      outcome_rules:
        - when: "data[0]"
          outcome: "GTIN_FOUND"
        - when: ""
          outcome: "GTIN_NOT_FOUND"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
      include_raw: false
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 10


  # ── Decision Engine Tools ──────────────────────────────────────────

  - id: DIAG-DECISION-MATRIX
    type: decision_matrix
    description: >
      Evaluate diagnostic observations against the decision rule table.
      First-match wins. Checks for error codes first, then evaluates
      condition rules with AND logic + absent-key constraints.
    params:
      - name: observations
        type: str
        required: true
        description: "JSON-encoded diagnostic observations dict"
    decision_rules:
      - id: "RULE-1"
        conditions:
          DIAG-LOGIC-01: "FITS_TOTE"
        runbook: "RBK-GIF-01"
        description: "Item fits tote → auto-route to GIF Picking Team"
      - id: "RULE-2"
        conditions:
          DIAG-LOGIC-01: "OVERSIZED"
        requires_absent: ["merchant_response"]
        runbook: "MERCHANT_OUTREACH"
        description: "Oversized item detected → email merchant for dimension verification"
      - id: "RULE-3"
        conditions:
          DIAG-LOGIC-01: "OVERSIZED"
          merchant_response: "DIMENSIONS_CORRECT"
        runbook: "RBK-GIF-02"
        description: "Oversized but merchant confirms dimensions correct → route to GIF Picking"
      - id: "RULE-4"
        conditions:
          DIAG-LOGIC-01: "OVERSIZED"
          merchant_response: "DIMENSIONS_NEED_UPDATE"
          DIAG-API-02: "GOLD"
        runbook: "RBK-GIF-03"
        description: "Oversized, needs update, Gold → SSOT team update via Slack"
      - id: "RULE-5"
        conditions:
          DIAG-LOGIC-01: "OVERSIZED"
          merchant_response: "DIMENSIONS_NEED_UPDATE"
          DIAG-API-02: "NOT_GOLD"
        runbook: "RBK-GIF-04"
        description: "Oversized, needs update, Supplier → iSAM direct update"
    decision_fallback:
      runbook: "RBK-GIF-05"
      description: "No rule matched — escalate to manual review"
    decision_error_codes:
      - "API_ERROR"
      - "PARSE_FAILURE"
      - "SERVICE_ERROR"
      - "TICKET_NOT_FOUND"
    risk: low


  - id: DIAG-RAG-FALLBACK
    type: python_function
    description: "RAG-based decision fallback when rules engine has no match"
    import: "agent_factory.tools.rag_fallback:query_playbook_for_decision"
    params:
      - name: incident_description
        type: str
        required: true
        description: "Original incident text from ServiceNow or user input"
      - name: mep_results_json
        type: str
        required: true
        description: "JSON string of diagnostic check outcomes"
      - name: rule_engine_decision_json
        type: str
        required: true
        description: "JSON string of rule engine decision (with confidence level)"
    risk: low
