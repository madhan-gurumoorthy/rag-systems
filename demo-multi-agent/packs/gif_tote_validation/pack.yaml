# GIF Tote Validation – Autonomous Incident Resolution System SOP Pack
#
# This pack defines the incident and retrieval pipelines, maps
# agents to prompts and tools, and configures the decision engine.
#
# Model credentials are configured in agent_factory/infrastructure/secrets.toml
# under [default.azure_chat] — NOT in this file.

id: gif_tote_validation
name: GIF Tote Validation – Autonomous Incident Resolution System
version: 1.0.0
description: >
  Covers end-to-end autonomous validation and resolution of GIF Tote-related
  incidents in ServiceNow, including dimension extraction, API validation,
  decision routing, merchant and SSOT communication, and ticket updates.
  Excludes non-GIF tote incidents and manual-only workflows.
owner_team: MerchantOps - Item Setup/Maintenance
# Default tenant_id stamped on session + event rows when no
# `X-Tenant-Id` header is supplied.  SNOW webhooks can't propagate
# custom headers today, so a per-pack default keeps the inbound
# webhook path multi-tenant-clean.  Multi-tenant callers that send
# `X-Tenant-Id` override this value per-request.
tenant_id: walmart-merchspace-merchantops
default: true
decision_engine: yaml_rules
# Only DiagnosticAgent uses LLM; triage, decision, action, closure are config-driven

# Model config — build_model_client() reads from secrets.toml [default.azure_chat].
# These values are fallback metadata only; runtime credentials come from secrets.toml.
model:
  provider: azure_openai
  model: gpt-4.1-mini
  deployment: gpt-4.1-mini
  api_version: "2024-10-21"
  endpoint: https://wmtllmgateway.stage.walmart.com/wmtllmgateway
  max_tokens: 4096
  temperature: 0.1
  extra_params: {}

# Pre-triage gate — fast validation BEFORE spinning up the LLM pipeline.
# Incidents that don't match are logged as "skipped" (no LLM cost).
pre_triage:
  enabled: true
  # Fallback tool used to fetch upstream data when state.domain_payload
  # is missing (must be defined in tools.yaml).
  fetch_tool: DIAG-TICKET-01
  # The kwarg name the fetch tool expects to carry external_ref.
  fetch_param: ticket_ref
  # SNOW prefixes incident column names with 'incident_'.
  payload_field_prefix: "incident_"
  # Where to find the upstream record id inside the payload.
  external_id_keys: ["incident_sys_id", "sys_id"]
  # Assignment groups that this agent handles (case-insensitive substring match)
  assignment_groups:
    - "MerchantOps - Item Setup/Maintenance"
    - "GIF"
  # Keywords in short_description or description (case-insensitive, any match)
  keywords:
    - "dimension"
    - "tote"
    - "GIF"
    - "GTIN"
    - "incorrect"
    - "does not fit"
  # Category filter (case-insensitive, any match); empty list = no filter
  categories:
    - "GIF"
    - "Software"
    - "Application"
  # Groups that indicate "already routed" — skip with a friendly reason
  routed_groups:
    "ops - ecomfulfillment - picking": "GIF Picking Team"
    "ops - ecomfulfillment": "eComFulfillment"
  # Keywords that trigger Slack thread creation before triage runs
  slack_notification_keywords:
    - "tote"
    - "incorrect dimensions"
    - "ems gif"
    - "gif 2.0"

rules_engine: {}

rag:
  domain: gif_tote_validation
  rag_query_prefix: "GIF Tote Validation incident decision matrix"
  prompt_template: ''

# ── Display labels ────────────────────────────────────────────────
# Human-readable names for tool IDs and outcome codes, used in Slack
# notifications and approval forms.  The runtime falls back to the
# raw tool_id / outcome code when a key is not listed here.
display:
  tool_names:
    diag_ticket_01: "Ticket Lookup"
    diag_uberkeys_01: "Item Key Resolution (GTIN)"
    diag_api_01: "GIF Dimensions"
    diag_api_02: "Dimension Source (Golden/Supplier)"
    diag_api_03: "Supplier Dimensions"
    diag_logic_01: "Tote Fit Check"
    diag_decision_matrix: "Decision Matrix"
    mock_isam_lookup: "iSAM Lookup"
    send_merchant_outreach: "Merchant Email"
    query_playbook_for_decision: "RAG Fallback"
    qry_ticket_01: "Ticket Update"
    qry_ticket_02: "Ticket Resolve"
    qry_gif_01: "GIF Query"
    qry_iqs_01: "IQS Query"
    qry_uber01: "Uber Query"
  outcome_labels:
    TICKET_FOUND: "Ticket found"
    GTIN_FOUND: "GTIN resolved"
    DATA_FOUND: "Data retrieved"
    GOLD: "Golden dimensions (SSOT — authoritative)"
    NOT_GOLD: "Supplier dimensions (non-authoritative)"
    FITS_TOTE: "Fits in tote"
    OVERSIZED: "Oversized — does not fit"
    DATA_NOT_FOUND: "No data available"
    AUTH_ERROR: "Auth failed"
    NOT_FOUND: "Not found"
    TICKET_NOT_FOUND: "Ticket not found"
    GTIN_NOT_FOUND: "Could not resolve GTIN"
    PARSE_FAILURE: "Response parse error"
    EMAIL_FAILED: "Email delivery failed"
    EMAIL_NOT_FOUND: "Merchant email not found"

# ── Resolution status mapping ─────────────────────────────────────
# Maps closure status strings emitted by the LLM to internal statuses
# used in the incident store and approval workflow.
resolution_statuses:
  statuses:
    pending_review: "pending_review"
    pending_merchant: "pending_merchant"
    escalated: "escalated"
    resolved: "resolved"
    routed: "routed"
  closure_pattern: '^[\s\-\*>#]*\**\s*status:\s*\**\s*(.+?)[\s\*]*$'
  default_status: "pending_review"

# ── Safety-net overrides ──────────────────────────────────────────
# Override the LLM-derived closure status when specific tool outcomes
# are detected in evidence.  Prevents the LLM from silently dropping
# critical findings (e.g. marking OVERSIZED as "resolved").
safety_net_overrides:
  - name: oversized_must_be_pending_review
    enabled: true
    tool: diag_logic_01
    outcome: OVERSIZED
    override_status: pending_review

# ── Safety-net dimension checks ───────────────────────────────────
# If the DiagnosticAgent skipped a dimension check despite having
# dimension data from earlier tools, run it deterministically.
safety_net_dimension_checks:
  - name: ensure_tote_fit_check
    enabled: true
    dimension_tools:
      - diag_api_01
      - qry_gif_01
    dimension_fields: ["height", "width", "depth", "weight"]
    uom_fields: ["dim_uom", "weight_uom"]
    check_tool: DIAG-LOGIC-01
    override_on_outcome: OVERSIZED

# ── Triage extraction (deterministic) ─────────────────────────────
# Field labels and symptom-classification rules used by the runtime's
# regex-driven triage stage.  No domain logic in the agent_factory.
triage_extraction:
  # ServiceNow incident-number convention — INC followed by 8+ digits.
  # The framework default is empty; packs that need text-driven
  # extraction declare their own pattern here.
  external_ref_pattern: "(INC\\d{8,})"
  fields:
    - name: store_number
      aliases: ["Store"]
      int_value: true
      required: true
    - name: upc_win
      aliases: ["UPC", "WIN", "Product Code", "Item Number"]
      required: true
    - name: assignment_group
      aliases: ["Assignment Group"]
      multiline: true
    - name: ticket_state
      aliases: ["State"]
    - name: priority
      aliases: ["Priority"]
    - name: sys_id
      aliases: ["Sys ID"]
  symptom_rules:
    - symptom: tote_dimension_mismatch
      keywords: ["tote size", "tote dimension", "does not fit"]
    - symptom: incorrect_item_data
      keywords: ["incorrect"]
  default_symptom: general_incident
  description_marker: "--- Full Description ---"

# ── Evidence field extraction ─────────────────────────────────────
# Rules that map tool_result evidence to closure-template fields.
evidence_extraction:
  defaults:
    dim_uom: "IN"
    weight_uom: "LB"
  rules:
    - field: gtin
      tool_match: uberkeys
      preview_keys: ["gtin", "GTIN"]
    - field: gtin
      tool_match: gtin
      preview_keys: ["gtin", "GTIN"]
    - field: height
      tool_match_all: ["api", "01"]
      preview_keys: ["height", "HEIGHT"]
    - field: width
      tool_match_all: ["api", "01"]
      preview_keys: ["width", "WIDTH"]
    - field: depth
      tool_match_all: ["api", "01"]
      preview_keys: ["depth", "DEPTH"]
    - field: weight
      tool_match_all: ["api", "01"]
      preview_keys: ["weight", "WEIGHT"]
    - field: dim_uom
      tool_match_all: ["api", "01"]
      preview_keys: ["dim_uom", "dimensionUom"]
    - field: weight_uom
      tool_match_all: ["api", "01"]
      preview_keys: ["weight_uom", "weightUom"]
    - field: product_name
      tool_match_all: ["api", "01"]
      preview_keys: ["product_name", "productName", "itemDescription"]
    - field: item_id
      tool_match_all: ["api", "01"]
      preview_keys: ["item_id", "itemId", "win"]
    - field: store_number
      tool_match_all: ["api", "01"]
      preview_keys: ["store_number", "storeNumber"]
    - field: is_gold
      tool_match_all: ["api", "02"]
      outcome_value_map:
        GOLD: "Yes"
        NOT_GOLD: "No"
    - field: dimension_source
      tool_match_all: ["api", "02"]
      outcome_value_map:
        GOLD: "Golden (SSOT)"
        NOT_GOLD: "Supplier"
    - field: verdict
      tool_match: logic
      outcome_value_map:
        OVERSIZED: "OVERSIZED"
        FITS_TOTE: "FITS_TOTE"
    - field: verdict
      tool_match: threshold
      outcome_value_map:
        OVERSIZED: "OVERSIZED"
        FITS_TOTE: "FITS_TOTE"
    - field: exceeded_reason
      tool_match: logic
      preview_keys: ["reason", "details"]
    - field: exceeded_reason
      tool_match: threshold
      preview_keys: ["reason", "details"]
    - field: merchant_email
      tool_match: isam
      preview_keys: ["merchant_email", "email", "merchantEmail"]

# ── Closure templates + post-verdict actions ──────────────────────
# Maps the verdict to a Jinja2 template in templates/.  Post-verdict
# actions can populate closure fields (e.g. merchant email lookup).
closure_templates:
  verdict_field: verdict
  template_map:
    OVERSIZED: closure_oversized.j2
    FITS_TOTE: closure_fits_tote.j2
    ESCALATED: closure_escalated.j2
  default_template: closure_escalated.j2
  fallback_verdict: ESCALATED
  verdict_inference:
    - verdict: OVERSIZED
      runbook_keywords: ["MERCHANT", "OVERSIZED"]
    - verdict: FITS_TOTE
      runbook_keywords: ["GIF-01", "FITS"]
  post_verdict_actions:
    - name: merchant_email_lookup
      enabled: true
      when_verdict: OVERSIZED
      when_field_blank: merchant_email
      tool: QRY-ISAM-01
      param_from_field:
        gtin: gtin
      result_to_field: merchant_email
      result_keys: ["merchant_email", "email"]

# ── Approved actions ──────────────────────────────────────────────
# Actions that can be executed after Concord approval.  Each action
# maps to a tool in tools.yaml and has optional static params.
approved_actions:
  - id: add_work_notes
    tool: ACT-WORKNOTES-01
    enabled: true
    requires_external_id: false
    params: {}
    state_params:
      - external_ref
      - closure_content
    closure_fields: []
    slack_success: "✅ Work notes added to incident"
    slack_failure: "❌ Work notes failed: {error}"

  - id: send_email
    tool: ACT-EMAIL-01
    enabled: true
    requires_external_id: false
    params: {}
    state_params:
      - external_ref
      - merchant_email
      - gtin
      - dimensions
    closure_fields:
      - gtin
      - merchant_email
      - product_name
      - dimensions
    slack_success: "📧 Merchant email sent to {merchant_email}"
    slack_failure: "❌ Email failed: {error}"

  - id: set_pending
    tool: ACT-PENDING-01
    enabled: true
    requires_external_id: true
    params: {}
    closure_fields: []
    slack_success: "✅ Ticket set to Pending"
    slack_failure: "❌ Set pending failed: {error}"

  - id: route_to_gif_picking
    tool: QRY-TICKET-01
    enabled: true
    requires_external_id: true
    params:
      assignment_group: "OPS - eComFulfillment - Picking"
      assigned_to: ""
    closure_fields: []
    slack_success: "✅ Routed to GIF Picking Team"
    slack_failure: "❌ Routing failed: {error}"

  - id: add_comment
    tool: QRY-TICKET-01
    enabled: true
    requires_external_id: true
    params:
      field_name: comments
    closure_fields: []
    slack_success: "✅ Comment added to incident"
    slack_failure: "❌ Comment failed: {error}"

  - id: clear_assignee
    tool: QRY-TICKET-01
    enabled: true
    requires_external_id: true
    params:
      assigned_to: ""
    closure_fields: []
    slack_success: "✅ Assignee cleared"
    slack_failure: "❌ Clear assignee failed: {error}"

  - id: escalate
    tool: QRY-TICKET-01
    enabled: true
    requires_external_id: true
    params:
      priority: "2"
    closure_fields: []
    slack_success: "✅ Escalated to L2"
    slack_failure: "❌ Escalation failed: {error}"

# ── Approval workflow (Concord) ───────────────────────────────────
# Configuration for the Concord approval process.  The runtime uses
# findings_extractors to pull values from evidence and snow_data,
# then verdict_actions to decide which approved_actions to recommend.
approval_workflow:
  enabled: true
  provider: concord
  provider_display_name: "Concord"
  findings_extractors:
    - field: gtin
      tool: diag_uberkeys_01
      path: "data[0]"
    - field: dimensions
      tool: diag_api_01
      template: "{height}×{width}×{depth} IN, {weight} LB"
    - field: dim_source
      tool: diag_api_02
      outcome_map:
        GOLD: "Golden (SSOT)"
        NOT_GOLD: "Supplier"
    - field: product_name
      tool: diag_api_02
      path: "product_name"
    - field: tote_verdict
      tool: diag_logic_01
      path: "exceeds"
      outcome_map:
        "true": "OVERSIZED"
        "false": "FITS_TOTE"
    - field: merchant_email
      tool: mock_isam_lookup
      path: "merchant_email"
    - field: store
      tool: __snow__
      path: "incident_store_number"
    - field: item_id
      tool: __snow__
      path: "incident_details"
      template: "parse:Item Number"
  verdict_field: tote_verdict
  verdict_actions:
    OVERSIZED:
      actions:
        - send_email
        - add_work_notes
        - set_pending
      previews:
        work_notes: >
          Issue Summary: Item dimensions exceed standard GIF tote limits
          Analysis/Action Taken: Automated tote validation — merchant outreach initiated
          Impact: N/A
          Root Cause: N/A
        email_subject: "[Action Required] Item Dimension Review — {incident_number} (GTIN: {gtin})"
        status: "Pending — Awaiting Merchant Response"
    FITS_TOTE:
      actions:
        - add_work_notes
        - add_comment
        - route_to_gif_picking
        - clear_assignee
      previews:
        work_notes: >
          Issue Summary: Item dimensions validated — fits within standard tote
          Analysis/Action Taken: Automated tote validation — routing to GIF Picking
          Impact: N/A
          Root Cause: N/A
        comment: "Item dimensions validated — fits within standard GIF tote. Routing to GIF Picking Team."
        status: "Assignment Group → OPS - eComFulfillment - Picking"
    DEFAULT:
      actions:
        - add_work_notes
        - escalate
      previews:
        work_notes: >
          Issue Summary: Automated validation incomplete — manual review required
          Analysis/Action Taken: Partial diagnostic results available
        status: "Pending — Manual Review Required"

# ── Slack notification config ─────────────────────────────────────
slack:
  client_name: "gif-tote-validation-agent"
  client_version: "1.0.0"
  thread_title_template: "🔍 {ref_link} — Tote Dimension Investigation"
  thread_title_fallback: "🔍 *{external_ref}* — Tote Dimension Investigation"
  notify_context_fields:
    - label: "Store"
      raw_keys: ["store_number", "site"]
      prefix: "#"
    - label: "Caller"
      raw_keys: ["caller", "primary_contact"]

# ── Runtime entry points ──────────────────────────────────────────
# Pack-declared callables the runtime resolves at load time via
# importlib so app.py doesn't need to hard-code per-pack imports.
runtime:
  state_schema: "packs.gif_tote_validation.state:IncidentState"
  state_factory: "packs.gif_tote_validation.state:empty_incident_state"

pipelines:
  incident:
    type: selector
    max_turns: 30
    termination_agent: ClosureAgent
    selector_prompt: >
      You are the orchestrator for a GIF Tote Validation incident resolution pipeline.
      Select the NEXT agent strictly based on the pipeline stage. Each agent speaks ONCE.

      PIPELINE ORDER (strictly sequential — never go backward):
        1. TriageAgent → extracts incident parameters (INC#, UPC/WIN, store). Goes FIRST and only once.
        2. DiagnosticAgent → runs tool calls (SNOW fetch, GTIN lookup, GIF API, IQS, tote fit). Goes SECOND and only once.
        3. DecisionAgent → maps diagnostic outcomes to a runbook card. Goes THIRD and only once.
        4. ActionAgent → executes runbook actions (ticket routing, email, SSOT). Goes FOURTH and only once.
        5. ClosureAgent → generates closure notes. Goes FIFTH (LAST) and terminates the pipeline.

      RULES:
        - NEVER select an agent that has already produced output — each agent gets exactly ONE turn.
        - If DiagnosticAgent reported tool failures or SKIPPED steps, still move forward to DecisionAgent.
        - DecisionAgent must handle incomplete diagnostics gracefully (escalate to manual if needed).
        - After ClosureAgent speaks, the pipeline MUST end.
        - If you see repeated messages from the same agent, immediately select the NEXT agent in order.
    agents:
      - name: TriageAgent
        role: Extracts key parameters and classifies the incident symptom
        prompt_file: triage.j2
        tools: []

      - name: DiagnosticAgent
        role: Runs diagnostic checks to gather system observations
        prompt_file: diagnostic.j2
        tools:
          - DIAG-TICKET-01
          - DIAG-UBERKEYS-01
          - DIAG-API-01
          - DIAG-API-02
          - DIAG-API-03
          - DIAG-LOGIC-01

      - name: DecisionAgent
        role: Maps diagnostic observations to the correct runbook card
        prompt_file: decision.j2
        tools:
          - DIAG-DECISION-MATRIX
          - DIAG-RAG-FALLBACK

      - name: ActionAgent
        role: Compiles findings and recommends actions for support team (observation mode)
        prompt_file: action.j2
        tools:
          - QRY-ISAM-01

      - name: ClosureAgent
        role: Generates standardized closure notes and closes the ticket
        prompt_file: closure.j2
        tools: []

  retrieval:
    type: round_robin
    max_turns: 10
    termination_agent: RetrievalAgent
    agents:
      - name: RetrievalAgent
        role: >
          Answers questions, checks status, and executes self-service actions
          for GIF Tote Validation incidents
        prompt_file: retrieval.j2
        tools:
          - DIAG-TICKET-01
          - QRY-TICKET-01
          - QRY-GIF-01
          - QRY-IQS-01
          - QRY-UBER01
