# Tool Manifest — DevOps Health Check (toy pack)
#
# Every tool is a python_function so the toy pack exercises the factory
# substrate without needing external HTTP / SQL / Kafka infrastructure.

tools:

  # ── Diagnostics (read-only) ────────────────────────────────────────

  - id: DIAG-PING-01
    type: python_function
    import: packs.devops_health_check.health_checks:check_ping
    description: Ping a host; returns HOST_UP / HOST_DOWN.
    params:
      - name: hostname
        type: str
        required: true
    response:
      processor: passthrough
      outcome_rules:
        - when: "status == 'up'"
          outcome: HOST_UP
        - when: "status == 'down'"
          outcome: HOST_DOWN
      include_raw: false
    risk: low
    timeout_seconds: 10

  - id: DIAG-CPU-01
    type: python_function
    import: packs.devops_health_check.health_checks:check_cpu
    description: Check CPU utilisation; returns CPU_OK / CPU_HIGH.
    params:
      - name: hostname
        type: str
        required: true
    response:
      processor: passthrough
      outcome_rules:
        - when: "exceeds == True"
          outcome: CPU_HIGH
        - when: "exceeds == False"
          outcome: CPU_OK
      include_raw: false
    risk: low
    timeout_seconds: 10

  # ── Decision matrix ────────────────────────────────────────────────

  - id: DIAG-DECISION-MATRIX
    type: decision_matrix
    description: Map ping + CPU outcomes to a runbook card.
    decision_rules:
      - id: RESTART_DOWN
        conditions:
          DIAG-PING-01: HOST_DOWN
        runbook_card: R1
        confidence: 0.95
      - id: RESTART_HIGH_CPU
        conditions:
          DIAG-PING-01: HOST_UP
          DIAG-CPU-01: CPU_HIGH
        runbook_card: R1
        confidence: 0.85
      - id: HEALTHY
        conditions:
          DIAG-PING-01: HOST_UP
          DIAG-CPU-01: CPU_OK
        runbook_card: H1
        confidence: 0.9
    default_card: H1
    risk: low

  # ── Actions ────────────────────────────────────────────────────────

  - id: ACT-NOTIFY-01
    type: python_function
    import: packs.devops_health_check.health_checks:notify_oncall
    description: Post a notification to the on-call channel (mock).
    params:
      - name: hostname
        type: str
        required: true
      - name: message
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 10

  - id: ACT-RESTART-01
    type: python_function
    import: packs.devops_health_check.health_checks:restart_service
    description: Restart a service on the target host (mock — requires approval).
    params:
      - name: hostname
        type: str
        required: true
      - name: service_name
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: high
    requires_approval: true
    timeout_seconds: 30
