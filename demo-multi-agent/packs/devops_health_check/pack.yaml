# DevOps Health Check — Toy SOP Pack
#
# Minimal pack with only ``python_function`` tools, a 2-rule decision matrix,
# and two closure templates — validates that the agent_factory substrate is
# genuinely pack-agnostic.
#
# Model credentials are configured in agent_factory/infrastructure/secrets.toml
# under [default.azure_chat] — NOT in this file.

id: devops_health_check
name: DevOps Health Check (Toy Pack)
version: 0.1.0
description: >
  Synthetic toy pack exercising the agent_factory substrate end-to-end
  with no external dependencies.  Pings a host, checks CPU, and either
  closes HEALTHY or recommends a service restart (requires approval).
owner_team: DevOps - Platform
tenant_id: walmart-devops-platform
default: false
decision_engine: yaml_rules
# All agents are config-driven; only DiagnosticAgent uses LLM, and even
# then only to call two python_function tools.

# Model config — kept as ``stub`` because the toy pack is run end-to-end
# without a real LLM (the decision matrix is deterministic and the
# diagnostic agent has only two tools to choose from).  Real packs
# would point at azure_openai with a deployment name.
model:
  provider: stub
  model: ""
  deployment: ""
  max_tokens: 1024
  temperature: 0.0
  extra_params: {}

# Pre-triage disabled — this pack receives ``hostname`` / ``service_name``
# directly from the caller, no SNOW fetch.
pre_triage:
  enabled: false

rules_engine: {}

rag:
  domain: devops_health_check
  rag_query_prefix: ""
  prompt_template: ""

# ── Display labels ────────────────────────────────────────────────
display:
  tool_names:
    diag_ping_01: "Host Ping"
    diag_cpu_01: "CPU Utilisation"
    diag_decision_matrix: "Decision Matrix"
    act_notify_01: "On-call Notification"
    act_restart_01: "Service Restart"
  outcome_labels:
    HOST_UP: "Host responds"
    HOST_DOWN: "Host unreachable"
    CPU_OK: "CPU within threshold"
    CPU_HIGH: "CPU above threshold"

# ── Resolution status mapping ─────────────────────────────────────
resolution_statuses:
  statuses:
    resolved: "resolved"
    pending_approval: "pending_approval"
    escalated: "escalated"
  closure_pattern: '^[\s\-\*>#]*\**\s*status:\s*\**\s*(.+?)[\s\*]*$'
  default_status: "pending_approval"

# Safety-net overrides — none for this toy pack.
safety_net_overrides: []
safety_net_dimension_checks: []

# ── Triage extraction (deterministic) ─────────────────────────────
# Pull hostname, service_name, severity from the raw incident text.
triage_extraction:
  fields:
    - name: hostname
      aliases: ["Host", "Hostname"]
      required: true
    - name: service_name
      aliases: ["Service", "Service Name"]
      required: true
    - name: severity
      aliases: ["Severity"]
      required: false
  symptom_rules:
    - symptom: host_unreachable
      keywords: ["down", "unreachable", "no response"]
    - symptom: high_cpu
      keywords: ["cpu", "load", "spike"]
  default_symptom: general_incident
  description_marker: "--- Full Description ---"

# ── Evidence field extraction ─────────────────────────────────────
# Pulls observation codes from the diagnostic tool results so the
# closure templates can render ``ping_status`` and ``cpu_percent``.
evidence_extraction:
  defaults: {}
  rules:
    - field: ping_status
      tool_match: ping
      preview_keys: ["status"]
    - field: cpu_percent
      tool_match: cpu
      preview_keys: ["cpu_percent"]

# ── Closure templates + verdict inference ─────────────────────────
# The decision matrix emits a runbook_card (R1 / H1); we infer the
# verdict from the card and pick the matching Jinja2 template.
closure_templates:
  verdict_field: verdict
  template_map:
    HEALTHY: closure_healthy.j2
    RESTART_NEEDED: closure_restart_needed.j2
  default_template: closure_healthy.j2
  fallback_verdict: HEALTHY
  verdict_inference:
    - verdict: RESTART_NEEDED
      runbook_keywords: ["R1", "RESTART"]
    - verdict: HEALTHY
      runbook_keywords: ["H1", "HEALTHY"]
  post_verdict_actions: []

# ── Approved actions ──────────────────────────────────────────────
# RESTART_NEEDED → notify on-call + (after approval) restart the service.
approved_actions:
  - id: notify_oncall
    tool: ACT-NOTIFY-01
    enabled: true
    requires_external_id: false
    state_params: ["hostname"]
    params:
      message: "DevOps health-check flagged this host for restart."
    closure_fields: []
    slack_success: "✅ Notified #devops-oncall"
    slack_failure: "❌ Notify failed: {error}"

  - id: restart_service
    tool: ACT-RESTART-01
    enabled: true
    requires_external_id: false
    state_params: ["hostname", "service_name"]
    params: {}
    closure_fields: []
    slack_success: "✅ Service {service_name} restarted on {hostname}"
    slack_failure: "❌ Restart failed: {error}"

# ── Approval workflow ─────────────────────────────────────────────
# Restart needs explicit approval; healthy closures need none.
# Disabled in the toy pack: the policy.yaml gate on ACT-RESTART-01 is
# enough to prove the wiring without standing up a real Concord client.
approval_workflow:
  enabled: false
  provider: concord
  provider_display_name: "Concord"
  findings_extractors:
    - field: hostname
      tool: diag_ping_01
      path: "hostname"
    - field: ping_status
      tool: diag_ping_01
      path: "status"
    - field: cpu_percent
      tool: diag_cpu_01
      path: "cpu_percent"
    - field: runbook_verdict
      tool: diag_decision_matrix
      path: "runbook_card"
      outcome_map:
        R1: "RESTART_NEEDED"
        H1: "HEALTHY"
  verdict_field: runbook_verdict
  verdict_actions:
    RESTART_NEEDED:
      actions:
        - notify_oncall
        - restart_service
      previews:
        status: "Pending — Awaiting Restart Approval"
    HEALTHY:
      actions: []
      previews:
        status: "Resolved — No action required"
    DEFAULT:
      actions: []
      previews:
        status: "Pending — Manual review"
  fallback_verdict: HEALTHY

# ── Slack notification config ─────────────────────────────────────
slack:
  client_name: "devops-health-check-agent"
  client_version: "0.1.0"
  thread_title_template: "🔧 {ref_link} — DevOps Health Check"
  thread_title_fallback: "🔧 *{external_ref}* — DevOps Health Check"
  notify_context_fields:
    - label: "Host"
      raw_keys: ["hostname"]
    - label: "Service"
      raw_keys: ["service_name"]

# ── Runtime entry points ──────────────────────────────────────────
# Pack-declared callables the runtime resolves at load time via
# importlib so app.py doesn't need to hard-code per-pack imports.
runtime:
  state_schema: "packs.devops_health_check.state:IncidentState"
  state_factory: "packs.devops_health_check.state:empty_incident_state"

# ── Pipelines ─────────────────────────────────────────────────────
pipelines:
  incident:
    type: selector
    max_turns: 10
    termination_agent: ClosureAgent
    selector_prompt: >
      You are the orchestrator for a DevOps health-check pipeline.
      Select the NEXT agent strictly based on the pipeline stage.
      Each agent speaks ONCE.

      PIPELINE ORDER (strictly sequential — never go backward):
        1. TriageAgent    → extracts hostname / service / severity.
        2. DiagnosticAgent → runs DIAG-PING-01 + DIAG-CPU-01.
        3. DecisionAgent  → mapped deterministically by the runtime.
        4. ActionAgent    → recommends notify / restart actions.
        5. ClosureAgent   → renders the closure template and terminates.

      RULES:
        - NEVER select an agent that has already produced output.
        - After ClosureAgent speaks, the pipeline MUST end.
    agents:
      - name: TriageAgent
        role: Extracts hostname, service_name, and severity
        prompt_file: triage.j2
        tools: []

      - name: DiagnosticAgent
        role: Runs ping + CPU health checks
        prompt_file: diagnostic.j2
        tools:
          - DIAG-PING-01
          - DIAG-CPU-01

      - name: DecisionAgent
        role: Maps observations to the correct runbook card
        prompt_file: decision.j2
        tools:
          - DIAG-DECISION-MATRIX

      - name: ActionAgent
        role: Recommends notify / restart actions per verdict
        prompt_file: action.j2
        tools: []

      - name: ClosureAgent
        role: Renders the closure template and closes the incident
        prompt_file: closure.j2
        tools: []
