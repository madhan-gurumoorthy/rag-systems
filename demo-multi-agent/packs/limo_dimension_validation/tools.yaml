# Tool Manifest — LIMO Dimension Validation Pack
#
# Validates that product package dimensions are consistent across ODIN
# (offer source-of-record), IQS TI (trade-item source), and the
# Eligibility Consolidated API (downstream).
#
# Config references:
#   {{KEY}} in url_template / headers / body_template / query_params
#   resolve from Dynaconf [default.*] in secrets.toml at execution time.

tools:

  # ── ODIN — fetch offer by Offer ID ────────────────────────────────

  - id: DIAG-ODIN-01
    type: http_api
    description: >
      Fetch offer details from ODIN for a given Offer ID.  Returns the
      offer header (Offer ID, Seller ID, Seller Type) and the
      product-package dimensions when available.
    method: GET
    url_template: "{{ODIN_BASE_URL}}/odin/services/ops/offer/{{ offer_id }}"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    params:
      - name: offer_id
        type: str
        required: true
        description: "ODIN Offer ID (e.g. E981AC30C2C635B999DEEEF8DF07196D)"
    response:
      processor: field_presence
      # Weight is the universal minimum every offer has — MP offers
      # only ship `uwt`, standard offers ship all four.  Presence here
      # signals "some dimension data exists"; the DiagnosticAgent
      # decides which path to walk based on wfs_eligible + seller_type.
      presence_fields:
        - "oa.pdims.uwt.mv"
      # ODIN ships dimensions as {uom, mv} objects.  Reach for `.mv`
      # so the downstream comparators receive scalar floats, not dicts.
      extract_fields:
        offer_id: "oid"
        seller_id: "sid"
        seller_type: "styp"
        wfs_eligible: "wfsElig"
        primary_gtin: "gtin"
        alternate_gtins: "oa.altGtins"
        odin_height: "oa.pdims.uht.mv"
        odin_length: "oa.pdims.uln.mv"
        odin_width: "oa.pdims.uwd.mv"
        odin_weight: "oa.pdims.uwt.mv"
        info_provider_code: "oa.pdims.infoPrvCd"
      outcome_rules:
        - when: "has_fields"
          outcome: "ODIN_DIMS_PRESENT"
        - when: "offer_id"
          outcome: "ODIN_DIMS_MISSING"
        - when: ""
          outcome: "ODIN_NOT_FOUND"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "ODIN_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
      include_raw: false
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── IQS TI — trade-item dimensions by GTIN ────────────────────────
  #
  # Returns ALL supplyTradeItems for the GTIN (GOLD + Supplier).  The
  # DiagnosticAgent classifies records by informationProviderTypeCode
  # and extracts dimensions, timestamps, and capture method from each.
  # No GOLD-only filter — the agent needs both GOLD and Supplier data
  # for the enhanced per-dimension comparison.

  - id: DIAG-IQS-TI-01
    type: http_api
    description: >
      Fetch ALL trade-item records from IQS for a given GTIN.  Returns
      every supplyTradeItem (GOLD and Supplier/Non-GOLD) so the
      DiagnosticAgent can classify each record, extract dimensions,
      timestamps (lastUpdateTimestamp), and capture method
      (receivingDimensionsCaptureMethodTypeCode).  The agent iterates
      matching_records to separate GOLD vs Supplier data.
    method: GET
    url_template: "{{IQS_LIMO_BASE_URL}}/catalog/v1?id={{ gtin }}&filterGoldenData=false&type=GTIN&rt=TI"
    headers:
      "WM_CONSUMER.ID": "{{IQS_LIMO_CONSUMER_ID}}"
      "WM_QOS.CORRELATION_ID": "{{IQS_LIMO_QOS_CORRELATION_ID}}"
      "WM_SVC.ENV": "{{IQS_LIMO_SVC_ENV}}"
      "WM_SVC.NAME": "{{IQS_LIMO_SVC_NAME}}"
      "WM_SVC.VERSION": "{{IQS_LIMO_SVC_VERSION}}"
      "ENABLE_AUTH_OVERRIDE_TEMP": ""
    params:
      - name: gtin
        type: str
        required: true
        description: "14-digit GTIN to look up in IQS"
    response:
      processor: count_filter
      array_path: "payload.supplyTradeItems"
      # No filter_fields — all trade items returned in matching_records.
      # DiagnosticAgent classifies GOLD vs Supplier by inspecting
      # each record's informationProviderTypeCode.
      outcome_rules:
        - when: "count > 0"
          outcome: "TI_DATA_PRESENT"
        - when: ""
          outcome: "TI_DIMS_MISSING"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "TI_DIMS_MISSING"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
      include_raw: false
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── IQS TI — deterministic per-GTIN flatten ───────────────────────
  #
  # Fetches the same IQS catalog endpoint as DIAG-IQS-TI-01 but performs
  # the GOLD vs Supplier classification + per-record field extraction
  # in Python.  Returns flat slots so the DiagnosticAgent never has to
  # navigate the nested payloadJson tree itself.

  - id: DIAG-IQS-EXTRACT-01
    type: python_function
    description: >
      Fetch IQS trade-item records for a single GTIN and return flat
      iqs_gold_* / iqs_supplier_* slots.  The first GOLD record (by
      informationProviderTypeCode == "GOLD") fills the gold slots; the
      first non-GOLD record fills the supplier slots.  Capture method
      is pulled from
      payloadJson.attributes.metadata.tradeItemDimensions.receivingDimensionsCaptureMethodTypeCode,
      falling back to the tradeItemWeight metadata block when the
      dimensions key is absent.  Emits outcome TI_DATA_PRESENT,
      TI_DIMS_MISSING, or UPSTREAM_ERROR.
    import: "packs.limo_dimension_validation.iqs_extract:iqs_extract_for_gtin"
    params:
      - name: gtin
        type: str
        required: true
        description: "14-digit GTIN to look up in IQS"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 35


  # ── MP classifier — deterministic Marketplace-offer gate ──────────
  #
  # Pure-Python decision that runs immediately after DIAG-ODIN-01.
  # Reads ``seller_type`` (styp) and ``wfs_eligible`` (wfsElig), applies
  # the canonical rule (seller_type == EXTERNAL AND wfs_eligible in
  # {FALSE, absent}), and returns ``mp_offer: true|false`` plus
  # normalized inputs.  The DiagnosticAgent gates the MP vs standard
  # path off this single boolean so the branch cannot be missed when
  # ODIN omits ``wfsElig`` or returns mixed casing.

  - id: DIAG-MP-CLASSIFY-01
    type: python_function
    description: >
      Classify an ODIN offer as Marketplace (MP) or standard.  Returns
      ``outcome`` (MP_OFFER | STANDARD_OFFER), ``mp_offer`` (bool),
      normalized ``seller_type_norm`` / ``wfs_eligible_norm``, and a
      one-line ``reason``.  Pure function; no I/O.
    import: "packs.limo_dimension_validation.mp_classify:classify_mp_offer"
    params:
      - name: seller_type
        type: str
        required: false
        description: "ODIN styp (e.g. EXTERNAL / INTERNAL)"
      - name: wfs_eligible
        type: str
        required: false
        description: "ODIN wfsElig (e.g. TRUE / FALSE / absent)"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Eligibility Consolidated — downstream dimensions ──────────────

  - id: DIAG-CONSOLIDATED-01
    type: http_api
    description: >
      Fetch productPackageDimensions from the Eligibility Consolidated
      API for an offer.  Called only when ODIN and IQS dimensions are
      already known to match.
    method: POST
    url_template: "{{CONSOLIDATED_BASE_URL}}/offer/consolidated"
    headers:
      Content-Type: "application/json"
      "FUEL_SUBSCRIPTION_ID": "{{CONSOLIDATED_FUEL_SUBSCRIPTION_ID}}"
      "WM_CONSUMER.ID": "{{CONSOLIDATED_CONSUMER_ID}}"
      "WM_QOS.CORRELATION_ID": "{{CONSOLIDATED_QOS_CORRELATION_ID}}"
      "WM_SVC.NAME": "{{CONSOLIDATED_SVC_NAME}}"
      "WM_SVC.ENV": "{{CONSOLIDATED_SVC_ENV}}"
    body_template:
      payload:
        address:
          stateCode: "{{CONSOLIDATED_DEFAULT_STATE}}"
          zipCode: "{{CONSOLIDATED_DEFAULT_ZIP}}"
          countryCode: "{{CONSOLIDATED_DEFAULT_COUNTRY}}"
        sellers:
          - nodes: []
            offers:
              - offerId: "{{ offer_id }}"
            partnerId: "{{ partner_id }}"
            partnerType: "{{ partner_type }}"
    params:
      - name: offer_id
        type: str
        required: true
        description: "ODIN Offer ID (oid)"
      - name: partner_id
        type: str
        required: true
        description: "ODIN Seller ID (sid)"
      - name: partner_type
        type: str
        required: true
        description: "ODIN Seller Type (styp), e.g. INTERNAL / EXTERNAL"
    response:
      processor: field_presence
      # Weight is the universal minimum (MP offers only ship weight;
      # standard offers ship all four).  The DiagnosticAgent and
      # comparators downstream see all four scalars (or null) and
      # route to the right runbook based on which are present.
      presence_fields:
        - "payload.consolidatedResponse[0].offerConsolidated.productPackageDimensions[0].unitWeight.measurementValue"
      extract_fields:
        consolidated_height: "payload.consolidatedResponse[0].offerConsolidated.productPackageDimensions[0].unitHeight.measurementValue"
        consolidated_length: "payload.consolidatedResponse[0].offerConsolidated.productPackageDimensions[0].unitLength.measurementValue"
        consolidated_width: "payload.consolidatedResponse[0].offerConsolidated.productPackageDimensions[0].unitWidth.measurementValue"
        consolidated_weight: "payload.consolidatedResponse[0].offerConsolidated.productPackageDimensions[0].unitWeight.measurementValue"
      outcome_rules:
        - when: "has_fields"
          outcome: "CONSOLIDATED_DIMS_PRESENT"
        - when: ""
          outcome: "CONSOLIDATED_DIMS_MISSING"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "CONSOLIDATED_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
      include_raw: false
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── ODIN vs IQS TI comparator (python_function) ───────────────────
  #
  # Enhanced: accepts GOLD and Supplier dimensions separately, plus
  # timestamps and capture method.  Returns per-dimension source
  # selection explanation.

  - id: DIAG-COMPARE-ODIN-IQS-01
    type: python_function
    description: >
      Compare ODIN dimensions against IQS TI dimensions from both GOLD
      and Supplier records.  For each dimension (height, length, width,
      weight), identifies which IQS source matches ODIN, explains why
      that source was selected (priority, timestamp, capture method),
      and why alternate values were not selected.  Emits one of:
      ODIN_IQS_MATCH, ODIN_IQS_MISMATCH, ODIN_MISSING_IQS_PRESENT,
      ODIN_PRESENT_IQS_MISSING, BOTH_MISSING.
    import: "packs.limo_dimension_validation.dimension_compare:compare_odin_iqs"
    params:
      # ── ODIN dimensions ──
      - name: odin_height
        type: float
        required: false
      - name: odin_length
        type: float
        required: false
      - name: odin_width
        type: float
        required: false
      - name: odin_weight
        type: float
        required: false
      # ── IQS GOLD dimensions + metadata ──
      - name: iqs_gold_height
        type: float
        required: false
      - name: iqs_gold_length
        type: float
        required: false
      - name: iqs_gold_width
        type: float
        required: false
      - name: iqs_gold_weight
        type: float
        required: false
      - name: iqs_gold_timestamp
        type: str
        required: false
        description: "lastUpdateTimestamp from the GOLD trade-item record"
      - name: iqs_gold_capture_method
        type: str
        required: false
        description: "receivingDimensionsCaptureMethodTypeCode from the GOLD record (e.g. CUBIC_SCAN, PREDICTED)"
      # ── IQS Supplier dimensions + metadata ──
      - name: iqs_supplier_height
        type: float
        required: false
      - name: iqs_supplier_length
        type: float
        required: false
      - name: iqs_supplier_width
        type: float
        required: false
      - name: iqs_supplier_weight
        type: float
        required: false
      - name: iqs_supplier_timestamp
        type: str
        required: false
        description: "lastUpdateTimestamp from the Supplier trade-item record"
      - name: iqs_supplier_capture_method
        type: str
        required: false
        description: "receivingDimensionsCaptureMethodTypeCode from the Supplier record (e.g. CUBIC_SCAN, PREDICTED)"
      # ── Tolerance ──
      - name: tolerance
        type: float
        required: false
        default: 0.01
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 10


  # ── Three-way comparator (python_function) ────────────────────────

  - id: DIAG-COMPARE-THREE-WAY-01
    type: python_function
    description: >
      Compare ODIN / IQS / Consolidated dimensions when ODIN and IQS
      have already matched.  Emits ALL_MATCH, CONSOLIDATED_MISMATCH,
      or CONSOLIDATED_MISSING.  All dimension values include UOM
      (IN for length/height/width, LB for weight).
    import: "packs.limo_dimension_validation.dimension_compare:compare_three_way"
    params:
      - name: odin_height
        type: float
        required: false
      - name: odin_length
        type: float
        required: false
      - name: odin_width
        type: float
        required: false
      - name: odin_weight
        type: float
        required: false
      - name: iqs_height
        type: float
        required: false
      - name: iqs_length
        type: float
        required: false
      - name: iqs_width
        type: float
        required: false
      - name: iqs_weight
        type: float
        required: false
      - name: consolidated_height
        type: float
        required: false
      - name: consolidated_length
        type: float
        required: false
      - name: consolidated_width
        type: float
        required: false
      - name: consolidated_weight
        type: float
        required: false
      - name: tolerance
        type: float
        required: false
        default: 0.01
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 10


  # ── MP offer weight-only comparator (python_function) ──────────────
  #
  # Used when wfsElig=FALSE and seller_type=EXTERNAL (Marketplace offers).
  # Compares only ODIN weight vs Consolidated weight — IQS TI is skipped.

  - id: DIAG-COMPARE-MP-WEIGHT-01
    type: python_function
    description: >
      Compare ODIN weight against Consolidated weight for Marketplace
      (MP) offers where wfsElig=FALSE and seller_type=EXTERNAL.  Only
      weight is validated; height, length, and width are not checked.
      IQS TI is skipped entirely for this path.  Emits MP_WEIGHT_MATCH
      or MP_WEIGHT_MISMATCH.
    import: "packs.limo_dimension_validation.dimension_compare:compare_mp_weight"
    params:
      - name: odin_weight
        type: float
        required: false
        description: "ODIN product package weight (oa.pdims.uwt)"
      - name: consolidated_weight
        type: float
        required: false
        description: "Consolidated API weight (measurementValue)"
      - name: tolerance
        type: float
        required: false
        default: 0.01
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 10


  # ── Decision engine — first-match rule table ──────────────────────

  - id: DIAG-DECISION-MATRIX
    type: decision_matrix
    description: >
      Map ODIN / IQS / Consolidated observations to a LIMO runbook
      verdict.  First-match wins.
    params:
      - name: observations
        type: str
        required: true
        description: "JSON-encoded diagnostic observations dict"
    decision_rules:
      # ── Early exit: ODIN not found (before comparator rules) ──
      - id: "LIMO-ODIN-NOT-FOUND"
        conditions:
          DIAG-ODIN-01: "ODIN_NOT_FOUND"
        runbook: "RBK-LIMO-ODIN-NOT-FOUND"
        description: "Offer ID not found in ODIN — verify the ID or escalate."
      # ── MP offer (weight-only) rules ──
      - id: "LIMO-MP-PASS"
        conditions:
          DIAG-COMPARE-MP-WEIGHT-01: "MP_WEIGHT_MATCH"
        runbook: "RBK-LIMO-MP-PASS"
        description: "MP offer — ODIN and Consolidated weight match."
      - id: "LIMO-MP-FAIL"
        conditions:
          DIAG-COMPARE-MP-WEIGHT-01: "MP_WEIGHT_MISMATCH"
        runbook: "RBK-LIMO-MP-FAIL"
        description: "MP offer — ODIN and Consolidated weight mismatch."
      # ── Standard (full-dimension) rules ──
      - id: "LIMO-PASS"
        conditions:
          DIAG-COMPARE-ODIN-IQS-01: "ODIN_IQS_MATCH"
          DIAG-COMPARE-THREE-WAY-01: "ALL_MATCH"
        runbook: "RBK-LIMO-PASS"
        description: "ODIN, IQS, and Consolidated dimensions all match."
      - id: "LIMO-FAIL-CONS"
        conditions:
          DIAG-COMPARE-ODIN-IQS-01: "ODIN_IQS_MATCH"
          DIAG-COMPARE-THREE-WAY-01: "CONSOLIDATED_MISMATCH"
        runbook: "RBK-LIMO-FAIL-CONS"
        description: "ODIN and IQS match but Consolidated API differs."
      - id: "LIMO-BLOCK-CONS"
        conditions:
          DIAG-COMPARE-ODIN-IQS-01: "ODIN_IQS_MATCH"
          DIAG-COMPARE-THREE-WAY-01: "CONSOLIDATED_MISSING"
        runbook: "RBK-LIMO-BLOCKED"
        description: "ODIN and IQS match but Consolidated dimensions could not be retrieved."
      - id: "LIMO-INV-IQS-MISSING-3W"
        conditions:
          DIAG-COMPARE-THREE-WAY-01: "IQS_MISSING_FOR_THREE_WAY"
        runbook: "RBK-LIMO-INV-IQS-MISSING"
        description: "Three-way comparator could not run — IQS TI dimensions are incomplete."
      - id: "LIMO-FAIL-ODIN-IQS"
        conditions:
          DIAG-COMPARE-ODIN-IQS-01: "ODIN_IQS_MISMATCH"
        runbook: "RBK-LIMO-FAIL-ODIN-IQS"
        description: "ODIN and IQS dimensions disagree — escalate to LIMO Ops."
      - id: "LIMO-INV-ODIN-MISSING"
        conditions:
          DIAG-COMPARE-ODIN-IQS-01: "ODIN_MISSING_IQS_PRESENT"
        runbook: "RBK-LIMO-INV-ODIN-MISSING"
        description: "ODIN dimensions missing while IQS TI has data."
      - id: "LIMO-INV-IQS-MISSING"
        conditions:
          DIAG-COMPARE-ODIN-IQS-01: "ODIN_PRESENT_IQS_MISSING"
        runbook: "RBK-LIMO-INV-IQS-MISSING"
        description: "IQS TI dimensions missing or partial while ODIN has data."
      - id: "LIMO-BLOCKED-BOTH"
        conditions:
          DIAG-COMPARE-ODIN-IQS-01: "BOTH_MISSING"
        runbook: "RBK-LIMO-BLOCKED-BOTH"
        description: "No dimensions in ODIN or IQS TI — no downstream validation possible."
    decision_fallback:
      runbook: "RBK-LIMO-ESCALATE"
      description: "No rule matched — escalate for manual review."
    decision_error_codes:
      - "BAD_REQUEST"
      - "AUTH_ERROR"
      - "UPSTREAM_ERROR"
      - "UPSTREAM_UNAVAILABLE"
      - "RATE_LIMITED"
    risk: low
