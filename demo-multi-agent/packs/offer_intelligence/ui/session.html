<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OL Triage — Session Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#0f1117; --surface:#1a1d2e; --surface2:#232640;
      --border:#2e3250; --accent:#4f8ef7; --accent2:#7c5af7;
      --green:#22c55e; --red:#ef4444; --yellow:#f59e0b;
      --gray:#8892a4; --text:#e2e8f0; --text-dim:#94a3b8;
      --mono:'JetBrains Mono','Fira Code','Cascadia Code',monospace;
    }
    body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; min-height:100vh; }

    header { background:var(--surface); border-bottom:1px solid var(--border); padding:0 2rem; height:56px; display:flex; align-items:center; gap:.75rem; }
    header .logo { width:30px; height:30px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; }
    header h1 { font-size:1rem; font-weight:600; }
    header nav { margin-left:auto; display:flex; gap:.5rem; }
    header nav a { color:var(--gray); font-size:.78rem; text-decoration:none; padding:4px 10px; border-radius:6px; border:1px solid transparent; transition:all .15s; }
    header nav a:hover, header nav a.active { color:var(--accent); border-color:var(--border); }

    .toolbar { background:var(--surface); border-bottom:1px solid var(--border); padding:.85rem 2rem; display:flex; align-items:center; gap:.75rem; }
    .toolbar label { font-size:.8rem; color:var(--text-dim); white-space:nowrap; }
    .toolbar input { background:var(--bg); border:1px solid var(--border); border-radius:7px; color:var(--text); font-family:var(--mono); font-size:.82rem; padding:6px 10px; outline:none; width:320px; transition:border-color .15s; }
    .toolbar input:focus { border-color:var(--accent); }
    .btn { display:inline-flex; align-items:center; gap:5px; padding:7px 14px; border-radius:7px; border:1px solid var(--border); background:var(--surface2); color:var(--text-dim); font-size:.8rem; cursor:pointer; transition:all .15s; }
    .btn:hover { border-color:var(--accent); color:var(--accent); }
    .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff; }
    .badge { background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:2px 9px; font-size:.7rem; font-family:var(--mono); color:var(--gray); }

    .content { max-width:1100px; margin:0 auto; padding:1.75rem 2rem; }

    /* ── Session summary card ── */
    .summary-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.25rem 1.5rem; margin-bottom:1.5rem; display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:.75rem 1.5rem; }
    .stat { display:flex; flex-direction:column; gap:3px; }
    .stat-label { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); }
    .stat-value { font-family:var(--mono); font-size:.88rem; word-break:break-all; }

    /* ── Timeline ── */
    .section-title { font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gray); margin-bottom:.85rem; }
    .timeline { position:relative; padding-left:2rem; }
    .timeline::before { content:''; position:absolute; left:9px; top:8px; bottom:8px; width:2px; background:var(--border); }

    .step { position:relative; margin-bottom:1rem; animation:fadein .25s; }
    @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1} }
    .step::before { content:''; position:absolute; left:-25px; top:10px; width:12px; height:12px; border-radius:50%; border:2px solid var(--border); background:var(--surface); }
    .step.human::before { border-color:var(--accent); background:rgba(79,142,247,.2); }
    .step.ai::before { border-color:var(--accent2); background:rgba(124,90,247,.2); }
    .step.tool::before { border-color:var(--green); background:rgba(34,197,94,.2); }
    .step.system::before { border-color:var(--gray); }

    .step-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .step-header { display:flex; align-items:center; gap:.6rem; padding:.7rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); cursor:pointer; user-select:none; }
    .step-header:hover { background:#2a2d48; }
    .role-badge { padding:2px 8px; border-radius:12px; font-size:.68rem; font-weight:600; font-family:var(--mono); text-transform:uppercase; }
    .rb-human { background:rgba(79,142,247,.2); color:var(--accent); }
    .rb-ai { background:rgba(124,90,247,.2); color:var(--accent2); }
    .rb-tool { background:rgba(34,197,94,.2); color:var(--green); }
    .rb-system { background:rgba(136,146,164,.15); color:var(--gray); }
    .step-meta { font-size:.7rem; color:var(--gray); font-family:var(--mono); margin-left:auto; }
    .step-preview { font-size:.78rem; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:420px; }
    .chevron { color:var(--gray); font-size:.7rem; margin-left:.25rem; transition:transform .2s; }
    .step-card.open .chevron { transform:rotate(90deg); }

    .step-body { padding:1rem; display:none; }
    .step-card.open .step-body { display:block; }

    .msg-content { background:var(--bg); border-radius:8px; padding:.85rem; font-family:var(--mono); font-size:.78rem; line-height:1.7; white-space:pre-wrap; word-break:break-word; color:var(--text); max-height:400px; overflow-y:auto; }
    .tool-calls-section { margin-top:.75rem; }
    .tool-call-chip { display:inline-flex; align-items:center; gap:5px; background:rgba(124,90,247,.1); border:1px solid rgba(124,90,247,.3); border-radius:6px; padding:3px 9px; font-size:.72rem; font-family:var(--mono); color:var(--accent2); margin:3px 3px 3px 0; }

    /* ── Checkpoint section ── */
    .checkpoint { background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:.75rem; overflow:hidden; }
    .cp-header { display:flex; align-items:center; gap:.6rem; padding:.7rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); cursor:pointer; }
    .cp-header:hover { background:#2a2d48; }
    .cp-num { font-family:var(--mono); font-size:.72rem; color:var(--gray); }
    .cp-node { font-family:var(--mono); font-size:.78rem; color:var(--accent); font-weight:600; }
    .cp-ts { margin-left:auto; font-size:.7rem; color:var(--gray); font-family:var(--mono); }
    .cp-body { padding:1rem; display:none; }
    .checkpoint.open .cp-body { display:block; }

    .kv-grid { display:grid; grid-template-columns:140px 1fr; gap:4px 10px; font-size:.78rem; margin-bottom:.75rem; }
    .kv-k { color:var(--text-dim); }
    .kv-v { font-family:var(--mono); word-break:break-all; }
    .json-block { background:var(--bg); border-radius:8px; padding:.75rem; font-family:var(--mono); font-size:.72rem; line-height:1.6; white-space:pre-wrap; word-break:break-word; color:var(--gray); max-height:300px; overflow-y:auto; }

    /* ── Empty / loading ── */
    .empty { text-align:center; padding:5rem 2rem; color:var(--gray); }
    .empty .icon { font-size:2.5rem; opacity:.3; margin-bottom:.75rem; }
    .empty p { font-size:.85rem; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(79,142,247,.3); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to{transform:rotate(360deg)} }
    ::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js" integrity="sha512-Y1p/STLW/B+l+MPJ5K5OdILMwJa2gMFXXmC/qsyDuGH9uc1MZMUo6/8YQUg9Ut4ns8KGCrCtt+58UwmNFFiVvA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<header>
  <div class="logo">📊</div>
  <h1>OL Triage — Session Dashboard</h1>
  <nav>
    <a href="/ol/ui">Triage</a>
    <a href="/ol/session" class="active">Session Dashboard</a>
  </nav>
</header>

<div class="toolbar">
  <label>Session ID</label>
  <input id="sid-input" type="text" placeholder="Paste session UUID or leave blank to load all recent sessions" />
  <button class="btn btn-primary" onclick="load()">Load</button>
  <button class="btn" onclick="clear_()">Clear</button>
  <span class="badge" id="count-badge" style="display:none"></span>
</div>

<div class="content" id="main-content">
  <div class="empty">
    <div class="icon">📊</div>
    <p>Enter a session ID above and click Load, or run a triage from the <a href="/ol/ui" style="color:var(--accent)">Triage page</a>.</p>
  </div>
</div>

<script>
const B = window.location.origin;

// Pre-fill from ?id= query param
const urlSid = new URLSearchParams(location.search).get('id');
if (urlSid) { document.getElementById('sid-input').value = urlSid; }

function clear_() {
  document.getElementById('sid-input').value = '';
  document.getElementById('main-content').innerHTML = `<div class="empty"><div class="icon">📊</div><p>Enter a session ID above and click Load.</p></div>`;
  document.getElementById('count-badge').style.display = 'none';
}

async function load() {
  const sid = document.getElementById('sid-input').value.trim();
  if (!sid) { alert('Please enter a session ID.'); return; }

  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div class="empty"><div class="icon"><div class="spinner"></div></div><p>Loading session data…</p></div>`;

  try {
    const r = await fetch(`${B}/ol/session/${encodeURIComponent(sid)}`);
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      mc.innerHTML = `<div class="empty"><div class="icon">⚠️</div><p style="color:var(--red)">${esc(d.detail||d.error||'Failed to load session')}</p></div>`;
      return;
    }
    const data = await r.json();
    render(data);
  } catch(e) {
    mc.innerHTML = `<div class="empty"><div class="icon">✗</div><p style="color:var(--red)">${esc(e.message)}</p></div>`;
  }
}

function render(data) {
  const mc = document.getElementById('main-content');
  const msgs = data.messages || [];
  const cps = data.checkpoints || [];
  const badge = document.getElementById('count-badge');
  badge.textContent = `${msgs.length} msg${msgs.length!==1?'s':''} · ${cps.length} checkpoint${cps.length!==1?'s':''}`;
  badge.style.display = '';

  let html = '';

  // ── Summary card ──
  html += `<div class="summary-card">
    <div class="stat"><div class="stat-label">Session ID</div><div class="stat-value" style="font-size:.72rem">${esc(data.session_id||'—')}</div></div>
    <div class="stat"><div class="stat-label">Messages</div><div class="stat-value">${msgs.length}</div></div>
    <div class="stat"><div class="stat-label">Checkpoints</div><div class="stat-value">${cps.length}</div></div>
    <div class="stat"><div class="stat-label">Fast-path hits</div><div class="stat-value">${data.fast_path_count ?? '—'}</div></div>
    <div class="stat"><div class="stat-label">LLM tool calls</div><div class="stat-value">${data.tool_call_count ?? '—'}</div></div>
  </div>`;

  // ── Conversation timeline ──
  if (msgs.length > 0) {
    html += `<div class="section-title">Conversation Timeline (${msgs.length} messages)</div>`;
    html += `<div class="timeline">`;
    msgs.forEach((m, i) => {
      const role = m.type || m.msg_type || 'unknown';
      const content = m.content || '';
      const preview = content.slice(0, 100).replace(/\n/g,' ');
      const ts = m.created_at ? new Date(m.created_at).toLocaleTimeString() : '';
      const tcalls = m.tool_calls || [];
      const roleClass = {human:'human',user:'human',ai:'ai',assistant:'ai',tool:'tool',system:'system'}[role]||'';
      const rbClass = {human:'rb-human',user:'rb-human',ai:'rb-ai',assistant:'rb-ai',tool:'rb-tool',system:'rb-system'}[role]||'rb-system';
      const roleLabel = {human:'User',user:'User',ai:'AI',assistant:'AI',tool:'Tool',system:'System'}[role]||role;

      html += `<div class="step ${roleClass}">
        <div class="step-card" id="step-${i}">
          <div class="step-header" onclick="toggleStep('step-${i}')">
            <span class="role-badge ${rbClass}">${roleLabel}</span>
            <span class="step-preview">${esc(preview)}${content.length>100?'…':''}</span>
            <span class="step-meta">${ts}</span>
            <span class="chevron">▶</span>
          </div>
          <div class="step-body">
            <div class="msg-content">${esc(content)}</div>`;
      if (tcalls.length > 0) {
        html += `<div class="tool-calls-section"><div style="font-size:.72rem;color:var(--gray);margin-bottom:5px">Tool calls:</div>`;
        tcalls.forEach(tc => {
          html += `<span class="tool-call-chip">⚡ ${esc(tc.name||tc.id||'?')}</span>`;
        });
        html += `</div>`;
      }
      html += `</div></div></div>`;
    });
    html += `</div>`;
  }

  // ── Checkpoints ──
  if (cps.length > 0) {
    html += `<div class="section-title" style="margin-top:1.5rem">LangGraph Checkpoints (${cps.length} steps)</div>`;
    cps.forEach((cp, i) => {
      const node = cp.metadata?.writes ? Object.keys(cp.metadata.writes)[0] : (cp.metadata?.source || '?');
      const step = cp.metadata?.step ?? i;
      const ts = cp.checkpoint?.ts || cp.ts || '';
      const msgCount = cp.checkpoint?.channel_values?.messages?.length ?? (cp.messages?.length ?? 0);

      html += `<div class="checkpoint" id="cp-${i}">
        <div class="cp-header" onclick="toggleCp('cp-${i}')">
          <span class="cp-num">Step ${step}</span>
          <span class="cp-node">${esc(node)}</span>
          <span class="badge">${msgCount} msg${msgCount!==1?'s':''}</span>
          <span class="cp-ts">${ts ? new Date(ts).toLocaleTimeString() : ''}</span>
          <span class="chevron">▶</span>
        </div>
        <div class="cp-body">`;

      // Metadata
      if (cp.metadata) {
        html += `<div class="kv-grid">
          <span class="kv-k">Step</span><span class="kv-v">${cp.metadata.step ?? '—'}</span>
          <span class="kv-k">Source</span><span class="kv-v">${esc(cp.metadata.source||'—')}</span>
          <span class="kv-k">Writes</span><span class="kv-v">${esc(JSON.stringify(cp.metadata.writes||{}).slice(0,80))}</span>
        </div>`;
      }

      // Messages in this checkpoint
      const cpMsgs = cp.checkpoint?.channel_values?.messages || cp.messages || [];
      if (cpMsgs.length > 0) {
        const last = cpMsgs[cpMsgs.length - 1];
        const lrole = last.type || '?';
        const lcontent = typeof last.content === 'string' ? last.content : JSON.stringify(last.content);
        const ltcalls = last.tool_calls || [];
        html += `<div style="font-size:.72rem;color:var(--gray);margin-bottom:5px">Last message in state:</div>
          <div class="msg-content">${esc(lcontent.slice(0,600))}${lcontent.length>600?'\n…':''}`;
        if (ltcalls.length > 0) {
          html += `\n\nTool calls: ${ltcalls.map(t=>`${t.name}(${JSON.stringify(t.args||{}).slice(0,80)})`).join(', ')}`;
        }
        html += `</div>`;
      }

      // Full checkpoint JSON (collapsed)
      html += `<details style="margin-top:.75rem">
        <summary style="font-size:.72rem;color:var(--gray);cursor:pointer;margin-bottom:.4rem">Full checkpoint JSON</summary>
        <div class="json-block">${esc(JSON.stringify(cp, null, 2))}</div>
      </details>`;

      html += `</div></div>`;
    });
  }

  if (msgs.length === 0 && cps.length === 0) {
    html = `<div class="empty"><div class="icon">🔍</div><p>No data found for session <code style="color:var(--accent)">${esc(data.session_id)}</code>.<br>Make sure you've run a triage on the <a href="/ol/ui" style="color:var(--accent)">Triage page</a> first.</p></div>`;
  }

  mc.innerHTML = DOMPurify.sanitize(html);
}

function toggleStep(id) {
  document.getElementById(id).classList.toggle('open');
}
function toggleCp(id) {
  document.getElementById(id).classList.toggle('open');
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Auto-load if session_id in URL
if (urlSid) load();
</script>
</body>
</html>
