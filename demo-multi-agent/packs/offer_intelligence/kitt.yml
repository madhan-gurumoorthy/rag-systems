# Pack child — deploy-only. The parent kitt.yml builds the shared
# matbot-multi-agents image and triggers this deployment via postBuild.deployApp.
# No build section needed; the parent passes tag: "" so this reuses the
# parent-built image version automatically.
#
# Secrets: layers /etc/secrets/secrets-pack.toml on top of the parent's
# secrets-common.toml; settings.py merges via Dynaconf so pack overrides
# common on key conflict.

profiles:
  - stage-gates
  - test-executors-testhub
  - git://item-ops:matbot-multi-agents:main:kitt-stageGates

owner:
  group: Hyperloop-monitoring

managedNamespace:
  apmId: APM0019161

notify:
  slack:
    channelName: matbot-kitt-agent-factory

setup:
  changePaths:
    - packs/offer_intelligence/
    - agent_factory/
    - storage/
    - app.py
    - requirements.txt
    - Dockerfile

build:
  artifact: matbot-offer-intelligence
  skip: true

deploy:
  skip: false
  tenantSite: USGM
  namespace: matbot-stg
  releaseType:
    strategy: normal
    rollbackOnError: false
    waitForReady: true
    deployTimeout: 900

  gslb:
    enabled: true
    strategy: stage
    lbRoutings:
      stage:
        cnames: [stage.offer-intelligence.matbot.walmart.com]
        matchStages: [stage]
      # prod:
      #   cnames: [offer-intelligence.matbot.walmart.com]
      #   matchStages: [prod]

  helm:
    values:
      container:
        image: item-ops-docker/matbot-multi-agents
        tag: "{{$.kitt.build.version}}"
      env:
        CLUSTER_ID: "{{$.kittExec.currentCluster.clusterId}}"
      metadata:
        labels:
          wm.app: ITEM-OPS-MATBOT-OFFER-INTELLIGENCE
        annotations:
          sidecar.istio.io/inject: "true"
          traffic.sidecar.istio.io/excludeOutboundPorts: "8080,8300,15020,8200,15000,15001,15004,15006,15008,15009,15021,15053,15090"
          sidecar.istio.io/proxyCPU: 100m
          sidecar.istio.io/proxyCPULimit: 100m
          sidecar.istio.io/proxyMemory: 200M
          sidecar.istio.io/proxyMemoryLimit: 200M
      networking:
        internalPort: "8000"
        externalPort: "8000"
        httpsEnabled: true
      readinessProbe:
        enabled: "true"
        path: "/readyz"
        port: 8000
        headers: "*/*"
        wait: 10
        failureThreshold: 3
        probeInterval: 20
      livenessProbe:
        enabled: "true"
        path: "/healthz"
        port: 8000
        headers: "*/*"
        failureThreshold: 5
        probeInterval: 20
        wait: 10
      global:
        metrics:
          remoteWriteSampleLimit: 500

  stages:
    - name: stage
      refs: [main]
      target:
        cluster_id: ["uscentral-stage-wmt-005", "useast-stage-wmt-004"]
      helm:
        values:
          env:
            PACK_ID: offer_intelligence
            DEFAULT_PACK_ID: offer_intelligence
          min:
            cpu: 200m
            memory: 512Mi
          max:
            cpu: 1000m
            memory: 1280Mi
          scaling:
            cpuPercent: 50
            min: 2
            max: 4
          # Two Akeyless static secrets at /etc/secrets:
          #   secrets-common.toml — framework bundle
          #   secrets-pack.toml   — pack bundle
          secrets:
            akeyless: true
            config:
              akeyless:
                path: /Prod/WCNP/homeoffice/Hyperloop-monitoring/matbot-multi-agents
              path: /etc/secrets
            files:
              - destination: secrets-common.toml
                content: '{{$.kittExec.currentStage.name}}/config'
              - destination: secrets-pack.toml
                content: matbot-offer-intelligence/{{$.kittExec.currentStage.name}}/config
      preDeploy:
        - task:
            name: messageSlack
            text: "Deployment of offer_intelligence pack to stage is starting"
        - task:
            name: messageSlack
            text: "Starting Functional Tests"
        - concord:
            name: Functional Test
            enabled: true
            arguments:
              config:
                git:
                  orgName: '{{$.kitt.build.commitEvent.repo.org}}'
                  repoName: '{{$.kitt.build.commitEvent.repo.name}}'
                  branchName: '{{$.kitt.build.commitEvent.currentBranch}}'
                  looperFile: 'looper.yml'
                functionalTesting:
                  call: 'functional_tests'
                  mode: Passive
                  env: "{{$.kittExec.currentStage.profile}}"
                  teamChannel: "{{$.kitt.notify.slack.channelName}}"
                  timestamp: "{{$.kitt.notify.slack.threadTS}}"
                  threshHold: 10
        - task:
            name: messageSlack
            text: "Functional tests completed, starting Integration Tests"
        - concord:
            name: Integration Test
            enabled: true
            arguments:
              config:
                git:
                  orgName: '{{$.kitt.build.commitEvent.repo.org}}'
                  repoName: '{{$.kitt.build.commitEvent.repo.name}}'
                  branchName: '{{$.kitt.build.commitEvent.currentBranch}}'
                  looperFile: 'looper.yml'
                integrationTesting:
                  call: 'integration_tests'
                  mode: Passive
                  env: "{{$.kittExec.currentStage.profile}}"
                  teamChannel: "{{$.kitt.notify.slack.channelName}}"
                  timestamp: "{{$.kitt.notify.slack.threadTS}}"
                  threshHold: 10
        - task:
            name: messageSlack
            text: "Integration tests completed, deployment to stage in-progress.."
      postDeploy:
        - task:
            name: messageSlack
            text: "offer_intelligence pack deployed to https://stage.offer-intelligence.matbot.walmart.com"
        - task:
            name: messageSlack
            text: "Starting End to End Tests"
        - concord:
            name: End To End Test
            enabled: true
            arguments:
              config:
                git:
                  orgName: '{{$.kitt.build.commitEvent.repo.org}}'
                  repoName: '{{$.kitt.build.commitEvent.repo.name}}'
                  branchName: '{{$.kitt.build.commitEvent.currentBranch}}'
                  looperFile: 'looper.yml'
                endToEndTesting:
                  call: 'e2e_tests'
                  mode: Passive
                  threshHold: 10
                  env: "{{$.kittExec.currentStage.profile}}"
                  teamChannel: "{{$.kitt.notify.slack.channelName}}"
                  timestamp: "{{$.kitt.notify.slack.threadTS}}"
        - task:
            name: messageSlack
            text: "End to End tests completed. Starting R2C Contract Tests"
        - concord:
            name: R2C
            enabled: true
            arguments:
              config:
                spec:
                  apiSpecUrl: ''
                  specPath: 'specs/api-spec.json'
                contractTest:
                  cname: "stage.offer-intelligence.matbot.walmart.com"
                  threshHold: 10
                  mode: Passive
                  appName: matbot-multi-agents
        - task:
            name: messageSlack
            text: "R2C Contract Tests completed"

