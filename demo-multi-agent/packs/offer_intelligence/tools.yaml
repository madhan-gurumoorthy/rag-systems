# Tool Manifest — Offer Intelligence
#
# Combines the deterministic Offer Listing (OL) triage engine and the
# Offer Publish (unpublish) reason-code validator under a single pack.
#
# The DiagnosticAgent picks which tool(s) to run based on the
# ``check_mode`` slot set by the TriageAgent:
#
#   * ``ol_only``      → DIAG-OL-TRIAGE-01 (+ optional render)
#   * ``publish_only`` → DIAG-VALIDATE-OFFER-01
#   * ``both``         → DIAG-OL-TRIAGE-01 and DIAG-VALIDATE-OFFER-01
#
# DIAG-DECISION-MATRIX maps the resulting observation codes to a
# verdict-keyed runbook card; ClosureAgent renders the matching
# template.

tools:

  # ── Deterministic OL Triage Engine ─────────────────────────────
  - id: DIAG-OL-TRIAGE-01
    type: python_function
    import: packs.offer_intelligence.ol_tools:run_ol_triage
    description: >
      Run the deterministic Offer Listing triage engine for the given
      (offer_id, store_id, mart_id).  Calls the OL API, loads matched
      rules from the IMP policy snapshot, resolves required facts
      concurrently from the upstream services, and evaluates each rule's
      boolean expression.  Returns the full TriageResult dict containing
      listing_status, overall_verdict, matched_rule_ids, rule_verdicts,
      reason_codes, and errors.
    params:
      - name: offer_id
        type: str
        required: true
        description: "Walmart Offer / Dotcom Offer ID"
      - name: store_id
        type: str
        required: true
        description: "Walmart Store ID"
      - name: mart_id
        type: str
        required: false
        description: "Mart ID (defaults to '0')"
    response:
      processor: passthrough
      extract_fields:
        listing_status: listing_status
        overall_verdict: overall_verdict
        matched_rule_ids: matched_rule_ids
        reason_codes: reason_codes
        rule_verdicts: rule_verdicts
        triage_errors: errors
      outcome_rules:
        - when: "listing_status == 'LISTED'"
          outcome: OL_LISTED
        - when: "overall_verdict == 'ALL_VALID'"
          outcome: OL_ALL_VALID
        - when: "overall_verdict == 'HAS_INVALID'"
          outcome: OL_HAS_INVALID
        - when: "overall_verdict == 'PARTIAL'"
          outcome: OL_PARTIAL
        - when: "overall_verdict == 'CANNOT_EVALUATE'"
          outcome: OL_CANNOT_EVALUATE
        - when: "listing_status == 'UNKNOWN'"
          outcome: OL_LISTING_UNKNOWN
        - when: "overall_verdict == 'NO_MATCHED_RULES'"
          outcome: OL_NO_MATCHED_RULES
      include_raw: true
    risk: low
    timeout_seconds: 60
    retry:
      max_attempts: 1
      backoff: exponential
      retryable_status_codes: []

  # ── Report Renderer (informational, read-only) ─────────────────
  - id: DIAG-OL-RENDER-REPORT-01
    type: python_function
    import: packs.offer_intelligence.ol_tools:render_ol_report
    description: >
      Render a human-readable Markdown report from a TriageResult dict.
      Read-only; no upstream calls.  Used by the closure node when a
      richer textual summary is needed in addition to the templated
      closure note.
    params:
      - name: triage_result
        type: dict
        required: true
        description: "TriageResult dict returned by DIAG-OL-TRIAGE-01"
    response:
      processor: passthrough
      include_raw: true
    risk: low
    timeout_seconds: 10

  # ── Unpublish Reason-Code Validator ────────────────────────────
  - id: DIAG-VALIDATE-OFFER-01
    type: python_function
    description: >
      Validate a Walmart offer's unpublish reason code(s) by fetching live data
      from IQS, CASTAR, Oasis, Offer Store, Product Matching, Product Store,
      and Uber Keys, then running the appropriate validator for each of the 20
      known unpublish reason codes.

      Returns a structured dict containing:
        - success: bool
        - offer_id: str
        - publish_status: str (PUBLISHED | UNPUBLISHED | null)
        - audit_history: str (last PUBLISHED→UNPUBLISHED transition from CASTAR)
        - reason_codes_checked: list[str]
        - results: list of per-reason-code ValidationResult dicts, each with:
            offer_id, reason_code, status, message, details
        - summary: { total: int, by_status: { "<status_label>": count } }

      ValidationStatus values:
        "Valid ✅"                          — reason code correctly applied
        "Invalid (needs review) ❌"         — offer likely wrongly unpublished
        "Unknown reason code ❓"            — code not in the known list
        "Needs Manual Review 🛠️"           — data insufficient for automated verdict
        "Validator not yet implemented 🚧" — no validator for this code yet
        "No review required ✅"             — code does not require validation
    import: "packs.offer_intelligence.validator_service:validate_offer"
    params:
      - name: offer_id
        type: str
        required: true
        description: "32-character alphanumeric Walmart Offer ID"
      - name: reason_code
        type: str
        required: false
        default: ""
        description: >
          Optional specific reason code to validate (e.g. END_DATE, NO_PRICE).
          If empty, all reason codes present on the offer are validated.
    response:
      processor: passthrough
      outcome_rules:
        - when: "success == true and publish_status == PUBLISHED"
          outcome: "OFFER_PUBLISHED"
        - when: "success == true"
          outcome: "VALIDATION_COMPLETE"
        - when: ""
          outcome: "API_ERROR"
      include_raw: true
    risk: low
    timeout_seconds: 120

  # ── Decision Matrix ────────────────────────────────────────────
  - id: DIAG-DECISION-MATRIX
    type: decision_matrix
    description: >
      Map the combined Offer Intelligence outcomes to a verdict-keyed
      runbook card.  First-match wins.  OL-triage outcomes take
      precedence over unpublish-validator outcomes when both run in the
      same session (i.e. ``check_mode == both``), because a wrongful
      delist is the more actionable finding.
    decision_rules:
      # ── OL listing verification ──────────────────────────────
      - id: OL_LISTED
        conditions:
          DIAG-OL-TRIAGE-01: OL_LISTED
        runbook: OL_H1
        description: "Offer is currently LISTED at this store"

      - id: OL_ALL_VALID
        conditions:
          DIAG-OL-TRIAGE-01: OL_ALL_VALID
        runbook: OL_H2
        description: "DELISTED — all matched rules evaluate VALID"

      - id: OL_HAS_INVALID
        conditions:
          DIAG-OL-TRIAGE-01: OL_HAS_INVALID
        runbook: OL_R1
        description: "DELISTED — at least one rule evaluates INVALID"

      - id: OL_PARTIAL
        conditions:
          DIAG-OL-TRIAGE-01: OL_PARTIAL
        runbook: OL_R2
        description: "DELISTED — partial evaluation (some fields unsupported)"

      - id: OL_CANNOT_EVALUATE
        conditions:
          DIAG-OL-TRIAGE-01: OL_CANNOT_EVALUATE
        runbook: OL_R3
        description: "Cannot evaluate — all required fields unsupported"

      - id: OL_LISTING_UNKNOWN
        conditions:
          DIAG-OL-TRIAGE-01: OL_LISTING_UNKNOWN
        runbook: OL_R3
        description: "OL API returned UNKNOWN listing status"

      - id: OL_NO_MATCHED_RULES
        conditions:
          DIAG-OL-TRIAGE-01: OL_NO_MATCHED_RULES
        runbook: OL_R3
        description: "DELISTED but no matched rule IDs returned"

      # ── Unpublish reason-code validation ─────────────────────
      - id: OPV_OFFER_PUBLISHED
        conditions:
          DIAG-VALIDATE-OFFER-01: OFFER_PUBLISHED
        runbook: OPV_H0
        description: "Offer is currently PUBLISHED — no unpublish to validate"

      - id: OPV_COMPLETE
        conditions:
          DIAG-VALIDATE-OFFER-01: VALIDATION_COMPLETE
        runbook: OPV_R1
        description: "Unpublish validation complete — decision routed by verdict"

      - id: OPV_API_ERROR
        conditions:
          DIAG-VALIDATE-OFFER-01: API_ERROR
        runbook: OPV_R3
        description: "Upstream API error during unpublish validation"

    decision_fallback:
      runbook: ESCALATE
      description: "No decision rule matched — escalate for manual review"
    risk: low
