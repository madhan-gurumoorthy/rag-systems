# Policy Configuration — Offer Intelligence
#
# Combined read-only pack: Offer Listing (delist) verification and Offer
# Publish (unpublish reason-code) validation.  No approvals required;
# all upstream calls are read-only.

approvals:
  required_for_cards: []
  required_for_tools: []
  approval_channel: none
  timeout_minutes: 0
  ad_group: ""

blast_radius:
  max_batch_size: 1
  limits:
    # OL Triage
    max_triages_per_minute: 60
    # Offer Publish Validator
    max_iqs_calls_per_hour: 240
    max_oasis_calls_per_hour: 30
    max_castar_calls_per_hour: 30
    max_offer_store_calls_per_hour: 30
    max_product_matching_calls_per_hour: 30

permitted_actions:
  # OL listing verification
  - "Read-only OL API lookup"
  - "Read-only IQS / SIV product attribute lookup (RSA-signed)"
  - "Read-only Uber Mappings and Uber Keys lookup"
  - "Read-only Offer RT lookup"
  - "Read-only Product Store Read lookup"
  - "Read-only Item Pricing Setup lookup"
  - "Read-only Merloc (Rampart) location lookup"
  - "Read-only Oasis Inventory lookup"
  - "Read-only HAT Path lookup"
  - "Deterministic boolean rule evaluation against IMP policy snapshot"
  # Unpublish reason-code validation
  - "Read-only: IQS Offer, Product, Price, Logistics, OSCAR, SI resource types"
  - "Read-only: CASTAR audit history (last 30 days)"
  - "Read-only: Offer Store offer identifiers (GTIN)"
  - "Read-only: Product Matching API (GTIN → WPID)"
  - "Read-only: Product Store read (GTIN presence check)"
  - "Read-only: Uber Keys BUNDLE_TO_COMPONENT and GTIN_TO_DOTCOM_OFFER_ID"
  - "Recommendation output (per-reason-code validation status and message)"

denied_actions:
  - "Modifying offer listing state"
  - "Mutating product, price, or inventory data in any upstream system"
  - "Triggering any write or POST that changes state"
  - "Bypassing the IMP policy snapshot to invent matched rules"
  - "Writing to or modifying any catalog attribute"
  - "Directly changing offer publish status"
  - "Triggering Gatekeeper evaluation automatically"
  - "Creating or closing work items without user confirmation"

feature_flags:
  enable_concurrent_fact_resolution: true
  enable_demo_mode_fallback: true
  enable_rag_fallback: false
  enable_auto_close: false
  enable_batch_operations: false
  enable_teams_bot: false
  enable_email_ingress: false
  enable_merchant_outreach: false
