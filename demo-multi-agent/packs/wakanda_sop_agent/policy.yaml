# Policy Configuration — Wakanda Inventory SOP Agent
#
# All 15 diagnostic tools are read-only.
# No approval gates, no write operations, no blast-radius limits.

approvals:
  required_for_cards: []
  required_for_tools: []
  approval_channel: none

blast_radius:
  max_batch_size: 1
  limits: {}

permitted_actions:
  - "Read-only: Oasis API global inventory lookup"
  - "Read-only: BigQuery node-level inventory snapshot (killmonger + mbaku tables)"
  - "Read-only: BigQuery reservation and backorder queries"
  - "Read-only: BigQuery salescap queries"
  - "Read-only: BigQuery historical inventory timeline queries"
  - "Read-only: Enterprise Inventory (EI) comparison queries"
  - "Read: GCS signed URL generation for bulk result sets"

denied_actions:
  - "Any write to BigQuery, ServiceNow, iSAM, or any upstream system"
  - "Sending emails or Slack messages"
  - "Updating offer or node records"
  - "Approval or escalation routing"

feature_flags:
  enable_rag_fallback: false
  enable_auto_close: false
  enable_batch_operations: false
  enable_teams_bot: false
  enable_email_ingress: false
  strict_id_passthrough: true
  allow_cached_responses: false
