# Tool Manifest — 1P Store Path Eligibility Validation Pack
#
# Validates that a given offer + store pair has at least one eligible
# fulfillment path across AURUM, DEW, and the Eligibility Consolidated
# Store APIs.  Adds sub-case validators on top of the main flow for
# Tire, Photo, PetRx, Vision RX, Custom Cake, Humax RX, Delivery Inhome,
# Drone, IP Path and Instore-Purchase-Only.
#
# Config references:
#   {{KEY}} in url_template / headers / body_template / query_params
#   resolve from Dynaconf [default.*] in secrets.toml at execution time.
#   Per-pack-prefix every key (LIMO_PATH_*) to avoid Dynaconf flat-key
#   collisions with the limo_dimension_validation pack.

tools:

  # ── ODIN — fetch offer by Offer ID ────────────────────────────────

  - id: DIAG-ODIN-01
    type: http_api
    description: >
      Fetch the ODIN offer record by Offer ID.  Returns the offer
      header attributes the 1P store-path SOP needs:  oid, sid, styp,
      oa.ofrCrt, oa.otyp, oa.ftc, oa.itmClsId, oa.prdId, oa.dm,
      oa.sPill, oa.afa, oa.ptyp, oa.psi.accDNbr, oa.pfhbrc, oa.vca,
      oa.bndl.grpTyp, oa.bndl.grpSubTyp.
    method: GET
    url_template: "{{LIMO_PATH_ODIN_BASE_URL}}/odin/services/ops/offer/{{ offer_id }}"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    params:
      - name: offer_id
        type: str
        required: true
        description: "ODIN Offer ID (32-char uppercase hex)"
    response:
      processor: field_presence
      presence_fields:
        - "oid"
      extract_fields:
        offer_id: "oid"
        seller_id: "sid"
        seller_type: "styp"
        offer_created: "oa.ofrCrt"
        offer_type: "oa.otyp"
        ftc: "oa.ftc"
        item_class_id: "oa.itmClsId"
        product_id: "oa.prdId"
        delivery_method: "oa.dm"
        single_pillable: "oa.sPill"
        approved_for_animals: "oa.afa"
        product_type: "oa.ptyp"
        acc_d_nbr: "oa.psi.accDNbr"
        pfhbrc: "oa.pfhbrc"
        vision_center_approved: "oa.vca"
        bundle_grp_type: "oa.bndl.grpTyp"
        bundle_grp_sub_type: "oa.bndl.grpSubTyp"
      outcome_rules:
        - when: "has_fields"
          outcome: "ODIN_OFFER_FOUND"
        - when: ""
          outcome: "ODIN_NOT_FOUND"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "ODIN_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
      include_raw: false
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── Derivator MDM — store status lookup ───────────────────────────

  - id: DIAG-MDM-STORE-01
    type: python_function
    description: >
      Derivator MDM store-status lookup.  Issues the Cassandra-read POST
      to the seller_nodes table keyed by ``seller_id`` (with ``node_type:
      STORE``) and projects the bulk payload onto a single ``store_id``.
      The HTTP call and the per-store projection are folded into one
      python_function so the multi-MB bulk payload never reaches the LLM
      tool stream — only the small projection (store_status, state_code,
      business_code, timezone, activities) is returned.
      Outcomes:  MDM_STORE_OPEN, MDM_STORE_NOT_OPEN,
      MDM_STORE_NOT_IN_SELLER_MAP, plus the usual HTTP error outcomes.
    import: "packs.limo_store_path_validation.store_membership:fetch_mdm_store_status"
    params:
      - name: seller_id
        type: str
        required: true
        description: "Seller id from ODIN sid"
      - name: store_id
        type: str
        required: true
        description: "Store id to project the seller_nodes map onto"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 60


  # ── Product RT — itemClass / delivery / personalization by prdId ──

  - id: DIAG-PRODUCT-RT-01
    type: python_function
    description: >
      Fetch the Product RT record by product id.  POSTs the JSON-array
      body ``[{"productId": <pid>}]`` to the Walmart item-store service
      and projects the typed-attribute map ``payload[0].productAttributes``
      onto the SOP slots:  ``product_rt_item_class_id``,
      ``product_rt_delivery_method``, ``product_rt_personalization_url``,
      plus the top-level ``product_rt_product_type``,
      ``product_rt_product_type_id``, ``product_rt_product_segment``.
      Outcomes:  PRODUCT_RT_PRESENT, PRODUCT_RT_MISSING, plus the usual
      HTTP-mapped error outcomes.
    import: "packs.limo_store_path_validation.store_membership:fetch_product_attributes"
    params:
      - name: product_id
        type: str
        required: true
        description: "ODIN oa.prdId"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 30


  # ── AURUM Final Eligibility ───────────────────────────────────────

  - id: DIAG-AURUM-01
    type: http_api
    description: >
      Call AURUM Final Eligibility preview by offer_id + store_id.
      GET endpoint; no auth headers required.  Raw response is passed
      through to ``analyze_aurum_paths``, which deterministically
      projects ``offerNodeAttr.nodes.<store_id>.finalEligibilities.path
      .inclusions / .exclusions`` against the canonical 30-path
      allow-list.
    method: GET
    url_template: "{{LIMO_PATH_AURUM_BASE_URL}}/aurum/services/final-eligibility/preview/tenant/{{LIMO_PATH_AURUM_TENANT_ID}}/offer/{{ offer_id }}/node/{{ store_id }}"
    headers:
      Accept: "application/json"
    params:
      - name: offer_id
        type: str
        required: true
      - name: store_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "AURUM_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "AURUM_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── DEW Store API ─────────────────────────────────────────────────

  - id: DIAG-DEW-STORE-01
    type: http_api
    description: >
      Call DEW Store API by ``offerId-STORE-storeId`` to retrieve
      ``ftxn.outboundPaths`` for offer_id + store_id.  GET endpoint;
      no auth headers required.  Raw response is passed through to
      ``analyze_dew_paths`` for deterministic projection.
    method: GET
    url_template: "{{LIMO_PATH_DEW_BASE_URL}}/offer/read/id/{{ offer_id }}-STORE-{{ store_id }}"
    headers:
      Accept: "application/json"
    params:
      - name: offer_id
        type: str
        required: true
      - name: store_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "DEW_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "DEW_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── Eligibility Consolidated Store API ────────────────────────────

  - id: DIAG-CONSOLIDATED-STORE-01
    type: http_api
    description: >
      Call the Eligibility Consolidated Store API with offer_id +
      store_id + sid; raw response is fed to the consolidated analyzer
      which walks consolidatedResponse[].offerNodePayload.nodeData.STORE.
    method: POST
    url_template: "{{LIMO_PATH_CONSOLIDATED_STORE_BASE_URL}}/offer/consolidated/v2"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
      "FUEL_SUBSCRIPTION_ID": "{{LIMO_PATH_CONSOLIDATED_STORE_FUEL_SUBSCRIPTION_ID}}"
      "WM_CONSUMER.ID": "{{LIMO_PATH_CONSOLIDATED_STORE_CONSUMER_ID}}"
      "WM_QOS.CORRELATION_ID": "{{LIMO_PATH_CONSOLIDATED_STORE_QOS_CORRELATION_ID}}"
      "WM_SVC.ENV": "{{LIMO_PATH_CONSOLIDATED_STORE_SVC_ENV}}"
      "WM_SVC.NAME": "{{LIMO_PATH_CONSOLIDATED_STORE_SVC_NAME}}"
    body_template:
      payload:
        sellers:
          - partnerId: "{{ partner_id }}"
            partnerType: "{{ partner_type }}"
            nodes:
              - "{{ store_id }}"
            offers:
              - offerId: "{{ offer_id }}"
    params:
      - name: offer_id
        type: str
        required: true
      - name: store_id
        type: str
        required: true
      - name: partner_id
        type: str
        required: true
        description: "ODIN sid"
      - name: partner_type
        type: str
        required: true
        description: "ODIN styp (typically INTERNAL for 1P)"
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "CONSOLIDATED_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "CONSOLIDATED_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── Store eligibility list check (python_function) ────────────────

  - id: DIAG-CHECK-STORE-LIST
    type: python_function
    description: >
      O(1) membership check against the named eligible-store list.
      Returns STORE_ELIGIBLE / STORE_NOT_ELIGIBLE / BAD_REQUEST.
      Valid list_name values: TIRE, PHOTO, DRONE, NATIONAL_CARRIER,
      CUSTOM_CAKE, DELIVERY_INHOME, IP_PATH.
    import: "packs.limo_store_path_validation.store_membership:check_store_eligibility"
    params:
      - name: store_id
        type: str
        required: true
      - name: list_name
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Keyword router (python_function) ──────────────────────────────

  - id: DIAG-ROUTE-SUBCASE
    type: python_function
    description: >
      Word-boundary keyword router for explicit sub-case requests in the
      user's free-form query.  Scans for TIRE / PHOTO / VISION / PET /
      HUMAN RX / CUSTOM CAKE / CAKE / IP PATH / DRONE; emits one of
      SUBCASE_TIRE, SUBCASE_PHOTO, SUBCASE_VISION_RX, SUBCASE_PETRX,
      SUBCASE_HUMAX_RX, SUBCASE_CUSTOM_CAKE, SUBCASE_IP_PATH,
      SUBCASE_DRONE, SUBCASE_RX_AMBIGUOUS (bare RX), SUBCASE_KEYWORD_CONFLICT
      (more than one distinct sub-case keyword), or SUBCASE_NONE.
      This routing layer is independent of and additive to the
      attribute-based DIAG-DISPATCH-SUBCASE; both are called and the
      orchestrator reconciles the outcomes.
    import: "packs.limo_store_path_validation.store_membership:route_subcase_by_query"
    params:
      - name: work_item_text
        type: str
        required: false
        description: "User's raw query text"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Sub-case dispatcher (python_function) ─────────────────────────

  - id: DIAG-DISPATCH-SUBCASE
    type: python_function
    description: >
      Classify the 1P store-path sub-case (tire / photo / petrx /
      vision_rx / custom_cake / humax_rx / delivery_inhome / drone /
      ip_path / main) from ODIN + optional Product RT + store id.
    import: "packs.limo_store_path_validation.store_membership:dispatch_subcase"
    params:
      - name: itm_cls_id
        type: str
        required: false
      - name: ftc
        type: list
        required: false
      - name: acc_d_nbr
        type: str
        required: false
      - name: ptyp
        type: str
        required: false
      - name: afa
        type: str
        required: false
      - name: pfhbrc
        type: str
        required: false
      - name: otyp
        type: str
        required: false
      - name: styp
        type: str
        required: false
      - name: vca
        type: str
        required: false
      - name: store_id
        type: str
        required: false
      - name: product_rt_item_class_id
        type: str
        required: false
      - name: product_rt_delivery_method
        type: str
        required: false
      - name: product_rt_personalizable
        type: str
        required: false
      - name: product_rt_personalization_url
        type: str
        required: false
      - name: work_item_text
        type: str
        required: false
        description: >
          Inbound free-form request text.  Used to short-circuit to
          the outbound_geo sub-case when the caller's text contains
          "outbound geo", "alcohol geo", or "alcohol restrictions".
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Outbound GEO — offer-fully-created gate (python_function) ─────

  - id: DIAG-PATH-ODIN-OFR-CRT-01
    type: python_function
    description: >
      Deterministic gate on ODIN ``oa.ofrCrt`` shared by the Outbound
      GEO sub-SOP.  Emits ``OFFER_FULLY_CREATED`` /
      ``OFFER_NOT_CREATED`` / ``OFFER_CRT_UNKNOWN``.
    import: "packs.limo_store_path_validation.outbound_geo:check_offer_fully_created"
    params:
      - name: ofr_crt
        type: str
        required: false
        description: "ODIN oa.ofrCrt (bool or stringified bool)"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Outbound GEO — Consolidated v2 (http_api) ─────────────────────

  - id: DIAG-CONSOLIDATED-V2-01
    type: http_api
    description: >
      Call the Eligibility Consolidated v2 endpoint with the caller's
      address (stateCode + zipCode + countryCode) and the store-scoped
      sellers payload.  Raw response is fed to the Consolidated v2
      analyzer which walks consolidatedResponse[].offerNodePayload
      .nodeData.STORE per the Outbound GEO sub-SOP.
    method: POST
    url_template: "{{LIMO_PATH_CONSOLIDATED_V2_BASE_URL}}/offer/consolidated/v2"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
      "FUEL_SUBSCRIPTION_ID": "{{LIMO_PATH_CONSOLIDATED_V2_FUEL_SUBSCRIPTION_ID}}"
      "WM_CONSUMER.ID": "{{LIMO_PATH_CONSOLIDATED_V2_CONSUMER_ID}}"
      "WM_QOS.CORRELATION_ID": "{{LIMO_PATH_CONSOLIDATED_V2_QOS_CORRELATION_ID}}"
      "WM_SVC.ENV": "{{LIMO_PATH_CONSOLIDATED_V2_SVC_ENV}}"
      "WM_SVC.NAME": "{{LIMO_PATH_CONSOLIDATED_V2_SVC_NAME}}"
    body_template:
      payload:
        address:
          stateCode: "{{ state_code }}"
          zipCode: "{{ zip_code }}"
          countryCode: "USA"
        sellers:
          - partnerId: "{{ partner_id }}"
            partnerType: "{{ partner_type }}"
            nodes:
              - "{{ store_id }}"
            offers:
              - offerId: "{{ offer_id }}"
    params:
      - name: offer_id
        type: str
        required: true
      - name: store_id
        type: str
        required: true
      - name: state_code
        type: str
        required: true
        description: "2-char US state code (e.g. AR)"
      - name: zip_code
        type: str
        required: true
        description: "5-digit US ZIP (e.g. 72404)"
      - name: partner_id
        type: str
        required: true
        description: "ODIN sid"
      - name: partner_type
        type: str
        required: true
        description: "ODIN styp (typically INTERNAL for 1P)"
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "CONSOLIDATED_V2_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "CONSOLIDATED_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── Outbound GEO — Consolidated v2 analyzer (python_function) ─────

  - id: DIAG-ANALYZE-CONSOLIDATED-V2
    type: python_function
    description: >
      Walk Consolidated v2 STORE paths per the Outbound GEO SOP.
      Emits one of:
        * CONSOLIDATED_STORE_ELIGIBLE
        * CONSOLIDATED_STORE_RESTRICTED   (store in RESTRICTED_NODE)
        * CONSOLIDATED_STORE_NOT_ELIGIBLE
        * CONSOLIDATED_STORE_PARTIAL
        * CONSOLIDATED_NO_PATHS
    import: "packs.limo_store_path_validation.outbound_geo:analyze_consolidated_store_v2"
    params:
      - name: consolidated_response
        type: dict
        required: true
      - name: store_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Outbound GEO — DEW store-scoped restriction fetch (http_api) ──
  # No auth headers required — the dew-sync-ops service is internal
  # and accepts unauthenticated GETs.

  - id: DIAG-DEW-RESTRICTION-STORE-01
    type: http_api
    description: >
      Fetch the DEW sync-ops record for the store-scoped key
      ``{offerId}-STORE-{storeId}``.  Returns forxn[] entries keyed
      by state[] and/or zip[]; the matcher below filters them down
      to the caller's geo.
    method: GET
    url_template: "{{LIMO_PATH_DEW_RESTRICTION_STORE_BASE_URL}}/offer/read/id/{{ offer_id }}-STORE-{{ store_id }}"
    headers:
      Accept: "application/json"
    params:
      - name: offer_id
        type: str
        required: true
      - name: store_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "DEW_RESTRICTION_STORE_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "DEW_RESTRICTION_STORE_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── Outbound GEO — DEW geo matcher (python_function) ──────────────

  - id: DIAG-DEW-GEO-MATCH-01
    type: python_function
    description: >
      Match store-scoped DEW forxn entries against caller's
      state_code and zip_code.  Honours both keying schemes (state[]
      and zip[]) — entries that match either key yield a result row
      carrying {tag, type, path[], storeId, key_matched,
      matched_value}.  Emits DEW_GEO_RESTRICTED when any match is
      produced, DEW_GEO_CLEAR otherwise.
    import: "packs.limo_store_path_validation.outbound_geo:match_dew_geo_restriction"
    params:
      - name: forxn
        type: list
        required: false
        description: "forxn array from DIAG-DEW-RESTRICTION-STORE-01"
      - name: store_id
        type: str
        required: false
      - name: state_code
        type: str
        required: false
      - name: zip_code
        type: str
        required: false
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Outbound GEO — DEW offer-level restriction fetch (http_api) ───

  - id: DIAG-DEW-RESTRICTION-OFFER-01
    type: http_api
    description: >
      Fetch the DEW sync-ops record for the offer-level key
      (offer id only, no -STORE-suffix).  Returns the offer-wide
      forxn[] used by the offer-level grouper.
    method: GET
    url_template: "{{LIMO_PATH_DEW_RESTRICTION_OFFER_BASE_URL}}/offer/read/id/{{ offer_id }}"
    headers:
      Accept: "application/json"
    params:
      - name: offer_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "DEW_RESTRICTION_OFFER_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "DEW_RESTRICTION_OFFER_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── Outbound GEO — DEW offer-level grouper (python_function) ──────

  - id: DIAG-DEW-OFFER-GROUP-01
    type: python_function
    description: >
      Group offer-level DEW forxn entries by individual restriction
      path.  Each forxn entry's path + state are lists; the entry is
      exploded across its path list and state codes are unioned per
      distinct path.  Rows are sorted by path so the closure renders
      deterministically.  Emits DEW_OFFER_RESTRICTIONS_PRESENT when
      any rows are produced, DEW_OFFER_NO_RESTRICTIONS otherwise.
    import: "packs.limo_store_path_validation.outbound_geo:group_dew_offer_restrictions"
    params:
      - name: forxn
        type: list
        required: false
        description: "forxn array from DIAG-DEW-RESTRICTION-OFFER-01"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── AURUM analyzer (python_function) ──────────────────────────────

  - id: DIAG-ANALYZE-AURUM
    type: python_function
    description: >
      Parse the AURUM Final Eligibility response and project
      inclusions / exclusions for the canonical 30-path allow-list.
      Emits AURUM_PATHS_PRESENT, AURUM_NO_PATHS, or AURUM_NOT_FOUND.
    import: "packs.limo_store_path_validation.store_membership:analyze_aurum_paths"
    params:
      - name: aurum_response
        type: dict
        required: true
      - name: store_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── DEW analyzer (python_function) ────────────────────────────────

  - id: DIAG-ANALYZE-DEW
    type: python_function
    description: >
      Flatten ftxn.outboundPaths into [{path, fulfillmentMethods,
      types}] rows.  Emits DEW_PATHS_PRESENT or DEW_NO_PATHS.
    import: "packs.limo_store_path_validation.store_membership:analyze_dew_paths"
    params:
      - name: dew_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Consolidated analyzer (python_function) ───────────────────────

  - id: DIAG-ANALYZE-CONSOLIDATED
    type: python_function
    description: >
      Walk consolidatedResponse[].offerNodePayload.nodeData.STORE for
      the given store id, applying the eligible/nodes/nodeExceptions
      logic from the SOP.  Emits CONSOLIDATED_PATHS_PRESENT or
      CONSOLIDATED_NO_PATHS.
    import: "packs.limo_store_path_validation.store_membership:analyze_consolidated_paths"
    params:
      - name: consolidated_response
        type: dict
        required: true
      - name: store_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Decision engine — first-match rule table ──────────────────────

  - id: DIAG-DECISION-MATRIX
    type: decision_matrix
    description: >
      Map ODIN / MDM / sub-case / AURUM / DEW / Consolidated
      observations to a 1P store-path verdict.  First-match wins.
    params:
      - name: observations
        type: str
        required: true
        description: "JSON-encoded diagnostic observations dict"
    decision_rules:
      # ── Pre-validation gates ──
      - id: "PATH-ODIN-NOT-FOUND"
        conditions:
          DIAG-ODIN-01: "ODIN_NOT_FOUND"
        runbook: "RBK-PATH-ODIN-NOT-FOUND"
        description: "Offer not found in ODIN — verify the Offer ID or escalate."
      - id: "PATH-OFFER-NOT-CREATED"
        conditions:
          DIAG-ODIN-01: "ODIN_OFFER_FOUND"
          state.offer_created: "false"
        runbook: "RBK-PATH-OFFER-NOT-CREATED"
        description: "Offer is not fully created in ODIN (oa.ofrCrt != true)."
      - id: "PATH-STORE-NOT-OPEN"
        conditions:
          DIAG-MDM-STORE-01: "STORE_STATUS_PRESENT"
          state.store_status_not_open: "true"
        runbook: "RBK-PATH-STORE-NOT-OPEN"
        description: "Store status is not OPEN — engage LIMO Ops."
      - id: "PATH-STORE-NOT-FOUND"
        conditions:
          DIAG-MDM-STORE-01: "STORE_NOT_FOUND"
        runbook: "RBK-PATH-STORE-NOT-OPEN"
        description: "Store not found in Derivator MDM."

      # ── Sub-case store-list blocks (early stop) ──
      - id: "PATH-TIRE-STORE-NOT-ELIGIBLE"
        conditions:
          state.subcase: "tire"
          state.store_list_eligible: "false"
        runbook: "RBK-PATH-TIRE-STORE-NOT-ELIGIBLE"
        description: "Tire offer at a non-Tire-eligible store."
      - id: "PATH-PHOTO-STORE-NOT-ELIGIBLE"
        conditions:
          state.subcase: "photo"
          state.store_list_eligible: "false"
        runbook: "RBK-PATH-PHOTO-STORE-NOT-ELIGIBLE"
        description: "Photo offer at a non-Photo-eligible store."
      - id: "PATH-CUSTOM-CAKE-STORE-NOT-ELIGIBLE"
        conditions:
          state.subcase: "custom_cake"
          state.store_list_eligible: "false"
        runbook: "RBK-PATH-CUSTOM-CAKE-STORE-NOT-ELIGIBLE"
        description: "Custom Cake offer at a non-Custom-Cake-eligible store."
      - id: "PATH-DRONE-STORE-NOT-ELIGIBLE"
        conditions:
          state.subcase: "drone"
          state.store_list_eligible: "false"
        runbook: "RBK-PATH-DRONE-STORE-NOT-ELIGIBLE"
        description: "Drone subcase but store not on drone-eligible list."
      - id: "PATH-IP-STORE-NOT-ELIGIBLE"
        conditions:
          state.subcase: "ip_path"
          state.store_list_eligible: "false"
        runbook: "RBK-PATH-IP-STORE-NOT-ELIGIBLE"
        description: "IP path offer at a non-IP-eligible store."
      - id: "PATH-DELIVERY-INHOME-STORE-NOT-ELIGIBLE"
        conditions:
          state.subcase: "delivery_inhome"
          state.store_list_eligible: "false"
        runbook: "RBK-PATH-DELIVERY-INHOME-STORE-NOT-ELIGIBLE"
        description: "Delivery Inhome offer at a non-Inhome-eligible store."

      # ── Eligibility outcome rules (any AURUM/DEW/Consolidated path found) ──
      - id: "PATH-ELIGIBLE"
        conditions:
          DIAG-ANALYZE-AURUM: "AURUM_PATHS_PRESENT"
          DIAG-ANALYZE-DEW: "DEW_PATHS_PRESENT"
          DIAG-ANALYZE-CONSOLIDATED: "CONSOLIDATED_PATHS_PRESENT"
        runbook: "RBK-PATH-ELIGIBLE"
        description: "Offer + store has eligibility across AURUM, DEW, and Consolidated."
      - id: "PATH-PARTIAL-AURUM-ONLY"
        conditions:
          DIAG-ANALYZE-AURUM: "AURUM_PATHS_PRESENT"
          DIAG-ANALYZE-DEW: "DEW_NO_PATHS"
        runbook: "RBK-PATH-PARTIAL"
        description: "AURUM has paths but DEW does not — downstream gap."
      - id: "PATH-PARTIAL-NO-CONSOLIDATED"
        conditions:
          DIAG-ANALYZE-AURUM: "AURUM_PATHS_PRESENT"
          DIAG-ANALYZE-CONSOLIDATED: "CONSOLIDATED_NO_PATHS"
        runbook: "RBK-PATH-PARTIAL"
        description: "AURUM has paths but Consolidated Store does not — downstream gap."
      - id: "PATH-NOT-ELIGIBLE"
        conditions:
          DIAG-ANALYZE-AURUM: "AURUM_NO_PATHS"
        runbook: "RBK-PATH-NOT-ELIGIBLE"
        description: "AURUM returned no eligibility paths."
      - id: "PATH-AURUM-NODE-MISSING"
        conditions:
          DIAG-ANALYZE-AURUM: "AURUM_NOT_FOUND"
        runbook: "RBK-PATH-AURUM-NODE-MISSING"
        description: "Store id not present in AURUM offerNodeAttr.nodes."

      # ── Outbound GEO sub-SOP ──
      # Mechanically-derived verdicts; the LLM never decides these.
      - id: "PATH-OUTBOUND-GEO-OFFER-NOT-CREATED"
        conditions:
          state.subcase: "outbound_geo"
          DIAG-PATH-ODIN-OFR-CRT-01: "OFFER_NOT_CREATED"
        runbook: "RBK-PATH-OUTBOUND-GEO-OFFER-NOT-CREATED"
        description: >
          Offer is not fully created — raise a LIMO Ops ticket before
          validating outbound GEO restrictions.
      - id: "PATH-OUTBOUND-GEO-CONSOLIDATED-MISSING"
        conditions:
          state.subcase: "outbound_geo"
          DIAG-ANALYZE-CONSOLIDATED-V2: "CONSOLIDATED_NO_PATHS"
        runbook: "RBK-PATH-OUTBOUND-GEO-CONSOLIDATED-MISSING"
        description: >
          Consolidated v2 returned no STORE paths — raise a LIMO Ops ticket.
      - id: "PATH-OUTBOUND-GEO-RESTRICTED"
        conditions:
          state.subcase: "outbound_geo"
          DIAG-ANALYZE-CONSOLIDATED-V2: "CONSOLIDATED_STORE_RESTRICTED"
        runbook: "RBK-PATH-OUTBOUND-GEO-RESTRICTED"
        description: >
          Store appears in RESTRICTED_NODE for at least one path — not
          eligible (restricted).
      - id: "PATH-OUTBOUND-GEO-NOT-ELIGIBLE"
        conditions:
          state.subcase: "outbound_geo"
          DIAG-ANALYZE-CONSOLIDATED-V2: "CONSOLIDATED_STORE_NOT_ELIGIBLE"
        runbook: "RBK-PATH-OUTBOUND-GEO-NOT-ELIGIBLE"
        description: >
          Every Consolidated STORE path is not eligible for this store.
      - id: "PATH-OUTBOUND-GEO-DEW-RESTRICTED"
        conditions:
          state.subcase: "outbound_geo"
          DIAG-DEW-GEO-MATCH-01: "DEW_GEO_RESTRICTED"
        runbook: "RBK-PATH-OUTBOUND-GEO-DEW-RESTRICTED"
        description: >
          DEW forxn matched caller's state_code or zip_code — geo
          restriction applies.
      - id: "PATH-OUTBOUND-GEO-OFFER-RESTRICTED"
        conditions:
          state.subcase: "outbound_geo"
          DIAG-DEW-OFFER-GROUP-01: "DEW_OFFER_RESTRICTIONS_PRESENT"
        runbook: "RBK-PATH-OUTBOUND-GEO-OFFER-RESTRICTED"
        description: >
          DEW offer-level restrictions present — surface to caller.
      - id: "PATH-OUTBOUND-GEO-ELIGIBLE"
        conditions:
          state.subcase: "outbound_geo"
          DIAG-ANALYZE-CONSOLIDATED-V2: "CONSOLIDATED_STORE_ELIGIBLE"
          DIAG-DEW-GEO-MATCH-01: "DEW_GEO_CLEAR"
          DIAG-DEW-OFFER-GROUP-01: "DEW_OFFER_NO_RESTRICTIONS"
        runbook: "RBK-PATH-OUTBOUND-GEO-ELIGIBLE"
        description: >
          Consolidated eligible, no DEW geo match, no offer-level
          restrictions — store is eligible for outbound GEO.

    decision_fallback:
      runbook: "RBK-PATH-ESCALATE"
      description: "No rule matched — escalate for manual review."
    decision_error_codes:
      - "BAD_REQUEST"
      - "AUTH_ERROR"
      - "UPSTREAM_ERROR"
      - "UPSTREAM_UNAVAILABLE"
      - "RATE_LIMITED"
    risk: low
