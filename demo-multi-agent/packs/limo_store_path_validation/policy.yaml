# Policy Configuration — 1P Store Path Eligibility Validation
#
# Read-only validation pack: no approval-gated tools, no write actions,
# no destructive operations.

approvals:
  required_for_cards: []
  required_for_tools: []
  approval_channel: ""
  concord_entry_point: ""
  timeout_minutes: 15
  ad_group: ""

blast_radius:
  max_batch_size: 1
  limits: {}

permitted_actions:
  - "Read-only ODIN offer lookup"
  - "Read-only MDM store status lookup"
  - "Read-only Product RT lookup"
  - "Read-only AURUM Final Eligibility lookup"
  - "Read-only DEW Store API lookup"
  - "Read-only Eligibility Consolidated Store lookup"
  - "Read-only Eligibility Consolidated v2 address-scoped lookup"
  - "Read-only DEW sync-ops restriction lookups (store-scoped + offer-level)"
  - "Eligible-store-list membership checks"
  - "Path eligibility reporting and outbound GEO restriction reporting"

denied_actions:
  - "Modifying offer data"
  - "Modifying store data"
  - "Updating downstream APIs"
  - "Publishing or unpublishing offers"

feature_flags:
  enable_outbound_geo_subcase: true
