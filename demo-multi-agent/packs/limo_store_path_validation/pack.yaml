# 1P Store Path Eligibility Validation — SOP Pack
#
# Validates that a given (offer, store) pair has at least one eligible
# fulfillment path across AURUM, DEW, and the Eligibility Consolidated
# Store APIs.  Handles the 1P main flow plus 10 sub-cases (Tire, Photo,
# Custom Cake, PetRx, Vision RX, Drone, IP Path, Humax RX, Delivery
# Inhome, Instore Purchase Only).
#
# Model credentials are configured in agent_factory/infrastructure/secrets.toml
# under [default.azure_chat] — NOT in this file.

id: limo_store_path_validation
name: 1P Store Path Eligibility Validation
version: 0.1.0
description: >
  Validates 1P store-path eligibility for an offer + store pair.
  Walks ODIN → Derivator MDM → optional Product RT → AURUM → DEW →
  Eligibility Consolidated Store, applying the appropriate sub-case
  validator on top of the main flow.
owner_team: LIMO Ops
tenant_id: walmart-limo-ops
default: false
decision_engine: yaml_rules

# Model config — LLM is used by TriageAgent (offer-id + store-id
# extraction) and DiagnosticAgent (tool orchestration).
model:
  provider: azure_openai
  model: gpt-4.1-mini
  deployment: gpt-4.1-mini
  api_version: "2024-10-21"
  endpoint: https://wmtllmgateway.stage.walmart.com/wmtllmgateway
  max_tokens: 4096
  temperature: 0.1
  extra_params: {}

# Pre-triage gate — disabled.  Entry point is "validate offer X store Y",
# not a SNOW-routed ticket.  TriageAgent extracts the IDs from the
# inbound text instead.
pre_triage:
  enabled: false

rules_engine: {}

rag:
  domain: limo_store_path_validation
  rag_query_prefix: ""
  prompt_template: ""

# ── Display labels ────────────────────────────────────────────────
display:
  tool_names:
    diag_odin_01: "ODIN Offer Lookup"
    diag_mdm_store_01: "Derivator MDM Store Status"
    diag_product_rt_01: "Product RT Lookup"
    diag_aurum_01: "AURUM Final Eligibility"
    diag_dew_store_01: "DEW Store API"
    diag_consolidated_store_01: "Eligibility Consolidated Store"
    diag_check_store_list: "Eligible-Store List Check"
    diag_route_subcase: "Sub-case Keyword Router"
    diag_dispatch_subcase: "Sub-case Dispatcher"
    diag_analyze_aurum: "AURUM Path Analyzer"
    diag_analyze_dew: "DEW Path Analyzer"
    diag_analyze_consolidated: "Consolidated Path Analyzer"
    diag_path_odin_ofr_crt_01: "ODIN oa.ofrCrt Gate"
    diag_consolidated_v2_01: "Eligibility Consolidated v2 (Address-Scoped)"
    diag_analyze_consolidated_v2: "Consolidated v2 STORE Analyzer"
    diag_dew_restriction_store_01: "DEW Restriction (Offer-Store)"
    diag_dew_geo_match_01: "DEW Geo Matcher"
    diag_dew_restriction_offer_01: "DEW Restriction (Offer-Level)"
    diag_dew_offer_group_01: "DEW Offer-Level Grouper"
    diag_decision_matrix: "Decision Matrix"
  outcome_labels:
    ODIN_OFFER_FOUND: "ODIN offer found"
    ODIN_NOT_FOUND: "ODIN offer not found"
    STORE_STATUS_PRESENT: "Store status retrieved"
    STORE_NOT_FOUND: "Store not found in MDM"
    PRODUCT_RT_PRESENT: "Product RT record present"
    PRODUCT_RT_MISSING: "Product RT record missing"
    SUBCASE_TIRE: "Tire sub-case"
    SUBCASE_PHOTO: "Photo sub-case"
    SUBCASE_PETRX: "PetRx sub-case"
    SUBCASE_VISION_RX: "Vision RX sub-case"
    SUBCASE_CUSTOM_CAKE: "Custom Cake sub-case"
    SUBCASE_HUMAX_RX: "Humax RX sub-case"
    SUBCASE_DELIVERY_INHOME: "Delivery Inhome sub-case"
    SUBCASE_DRONE: "Drone sub-case"
    SUBCASE_IP_PATH: "IP Path sub-case"
    SUBCASE_OUTBOUND_GEO: "Outbound GEO restrictions sub-case"
    SUBCASE_MAIN: "Main 1P store-path flow"
    SUBCASE_NONE: "No explicit sub-case keyword in the user query"
    SUBCASE_KEYWORD_CONFLICT: "User query names more than one distinct sub-case keyword"
    SUBCASE_RX_AMBIGUOUS: "Bare 'RX' keyword — needs PET / VISION / HUMAN qualifier"
    OFFER_FULLY_CREATED: "Offer is fully created"
    OFFER_NOT_CREATED: "Offer is not fully created"
    OFFER_CRT_UNKNOWN: "Offer-created flag unknown"
    CONSOLIDATED_STORE_ELIGIBLE: "Consolidated STORE paths eligible"
    CONSOLIDATED_STORE_RESTRICTED: "Store appears in RESTRICTED_NODE"
    CONSOLIDATED_STORE_NOT_ELIGIBLE: "All Consolidated STORE paths not eligible"
    CONSOLIDATED_STORE_PARTIAL: "Mixed Consolidated STORE eligibility"
    DEW_GEO_RESTRICTED: "DEW geo restriction matched"
    DEW_GEO_CLEAR: "No DEW geo restriction match"
    DEW_OFFER_RESTRICTIONS_PRESENT: "Offer-level DEW restrictions present"
    DEW_OFFER_NO_RESTRICTIONS: "No offer-level DEW restrictions"
    STORE_ELIGIBLE: "Store on eligible list"
    STORE_NOT_ELIGIBLE: "Store not on eligible list"
    AURUM_PATHS_PRESENT: "AURUM paths returned"
    AURUM_NO_PATHS: "AURUM returned no paths"
    AURUM_NOT_FOUND: "Store missing in AURUM node map"
    DEW_PATHS_PRESENT: "DEW outboundPaths returned"
    DEW_NO_PATHS: "DEW returned no paths"
    CONSOLIDATED_PATHS_PRESENT: "Consolidated paths returned"
    CONSOLIDATED_NO_PATHS: "Consolidated returned no paths"

# ── Resolution status mapping ─────────────────────────────────────
resolution_statuses:
  statuses:
    resolved: "resolved"
    escalated: "escalated"
    investigation_required: "investigation_required"
    blocked: "blocked"
  closure_pattern: '^[\s\-\*>#]*\**\s*status:\s*\**\s*(.+?)[\s\*]*$'
  default_status: "investigation_required"

safety_net_overrides: []
safety_net_dimension_checks: []

# ── Triage extraction (deterministic) ─────────────────────────────
# Two inputs need to be pulled out of the natural-language request:
#   - offer_id: 32-char uppercase hex (the ODIN Offer ID)
#   - store_id: short decimal store number (1–6 digits)
# external_ref_pattern matches the offer id so it lands on
# state.external_ref; store_id is pulled from the named aliases below.
triage_extraction:
  use_llm: true
  external_ref_pattern: "([A-F0-9]{32})"
  fields:
    - name: offer_id
      aliases: ["Offer", "Offer ID", "OfferId", "offerId", "OID", "offer"]
      required: true
    - name: store_id
      aliases: ["Store", "Store ID", "StoreId", "storeId", "storeNumber", "store"]
      required: true
    # Outbound GEO sub-SOP additional inputs.  Optional at extraction
    # time; the diagnostic prompt enforces them when the resolved
    # subcase is outbound_geo.
    - name: state_code
      aliases: ["State", "State Code", "stateCode", "state", "ST"]
      required: false
    - name: zip_code
      aliases: ["ZIP", "Zip", "Zipcode", "Zip Code", "zipCode", "zip", "Postal Code"]
      required: false
  symptom_rules:
    - symptom: store_path_eligibility
      keywords: ["store", "path", "eligibility", "1p", "limo", "validate"]
  default_symptom: store_path_eligibility
  description_marker: "--- Full Description ---"

# ── Evidence field extraction ─────────────────────────────────────
evidence_extraction:
  defaults: {}
  rules:
    # ── ODIN fields ──
    - field: offer_id
      tool_match: odin_01
      preview_keys: ["offer_id"]
    - field: seller_id
      tool_match: odin_01
      preview_keys: ["seller_id"]
    - field: seller_type
      tool_match: odin_01
      preview_keys: ["seller_type"]
    - field: offer_created
      tool_match: odin_01
      preview_keys: ["offer_created"]
    - field: offer_type
      tool_match: odin_01
      preview_keys: ["offer_type"]
    - field: ftc
      tool_match: odin_01
      preview_keys: ["ftc"]
    - field: item_class_id
      tool_match: odin_01
      preview_keys: ["item_class_id"]
    - field: product_id
      tool_match: odin_01
      preview_keys: ["product_id"]
    - field: delivery_method
      tool_match: odin_01
      preview_keys: ["delivery_method"]
    - field: single_pillable
      tool_match: odin_01
      preview_keys: ["single_pillable"]
    - field: approved_for_animals
      tool_match: odin_01
      preview_keys: ["approved_for_animals"]
    - field: product_type
      tool_match: odin_01
      preview_keys: ["product_type"]
    - field: acc_d_nbr
      tool_match: odin_01
      preview_keys: ["acc_d_nbr"]
    - field: pfhbrc
      tool_match: odin_01
      preview_keys: ["pfhbrc"]
    - field: vision_center_approved
      tool_match: odin_01
      preview_keys: ["vision_center_approved"]
    - field: bundle_grp_type
      tool_match: odin_01
      preview_keys: ["bundle_grp_type"]
    - field: bundle_grp_sub_type
      tool_match: odin_01
      preview_keys: ["bundle_grp_sub_type"]
    # ── Store status ──
    - field: store_status
      tool_match: mdm_store_01
      preview_keys: ["store_status"]
    # ── Product RT ──
    - field: product_rt_item_class_id
      tool_match: product_rt_01
      preview_keys: ["product_rt_item_class_id"]
    - field: product_rt_delivery_method
      tool_match: product_rt_01
      preview_keys: ["product_rt_delivery_method"]
    - field: product_rt_personalizable
      tool_match: product_rt_01
      preview_keys: ["product_rt_personalizable"]
    - field: product_rt_personalization_url
      tool_match: product_rt_01
      preview_keys: ["product_rt_personalization_url"]
    # ── Sub-case keyword router (explicit-intent signal) ──
    - field: keyword_subcase
      tool_match: route_subcase
      preview_keys: ["subcase"]
    - field: keyword_router_outcome
      tool_match: route_subcase
      preview_keys: ["outcome"]
    - field: keyword_matched
      tool_match: route_subcase
      preview_keys: ["matched_keywords"]
    # ── Sub-case dispatch ──
    - field: subcase
      tool_match: dispatch_subcase
      preview_keys: ["subcase"]
    # ── Store-list check ──
    - field: store_list_eligible
      tool_match: check_store_list
      preview_keys: ["eligible"]
    - field: store_list_name
      tool_match: check_store_list
      preview_keys: ["list_name"]
    # ── Eligibility-source paths ──
    - field: aurum_inclusions
      tool_match: analyze_aurum
      preview_keys: ["inclusions"]
    - field: aurum_exclusions
      tool_match: analyze_aurum
      preview_keys: ["exclusions"]
    - field: dew_paths
      tool_match: analyze_dew
      preview_keys: ["paths"]
    - field: consolidated_paths
      tool_match: analyze_consolidated
      preview_keys: ["paths"]
    # ── Outbound GEO sub-SOP ──
    - field: offer_fully_created
      tool_match: path_odin_ofr_crt_01
      preview_keys: ["ofr_crt_norm"]
    - field: consolidated_v2_paths
      tool_match: analyze_consolidated_v2
      preview_keys: ["paths"]
    - field: consolidated_v2_restricted
      tool_match: analyze_consolidated_v2
      preview_keys: ["store_restricted"]
    - field: dew_geo_matches
      tool_match: dew_geo_match_01
      preview_keys: ["matches"]
    - field: dew_geo_restricted
      tool_match: dew_geo_match_01
      preview_keys: ["outcome"]
    - field: dew_offer_groups
      tool_match: dew_offer_group_01
      preview_keys: ["groups"]
    - field: dew_offer_restricted
      tool_match: dew_offer_group_01
      preview_keys: ["outcome"]

# ── Closure templates + verdict inference ─────────────────────────
# Two templates only — closure.j2 renders the universal main + sub-case
# blocks (driven by state.subcase), closure_blocked.j2 renders an
# early-stop summary when ODIN / MDM / store-list checks fail.
closure_templates:
  verdict_field: verdict
  template_map:
    ELIGIBLE: closure.j2
    PARTIAL: closure.j2
    NOT_ELIGIBLE: closure.j2
    BLOCKED: closure_blocked.j2
  default_template: closure.j2
  fallback_verdict: BLOCKED
  verdict_inference:
    - verdict: ELIGIBLE
      runbook_keywords:
        - "RBK-PATH-ELIGIBLE"
        - "RBK-PATH-OUTBOUND-GEO-ELIGIBLE"
    - verdict: PARTIAL
      runbook_keywords: ["RBK-PATH-PARTIAL"]
    - verdict: NOT_ELIGIBLE
      runbook_keywords:
        - "RBK-PATH-NOT-ELIGIBLE"
        - "RBK-PATH-AURUM-NODE-MISSING"
        - "RBK-PATH-OUTBOUND-GEO-NOT-ELIGIBLE"
        - "RBK-PATH-OUTBOUND-GEO-RESTRICTED"
        - "RBK-PATH-OUTBOUND-GEO-DEW-RESTRICTED"
        - "RBK-PATH-OUTBOUND-GEO-OFFER-RESTRICTED"
    - verdict: BLOCKED
      runbook_keywords:
        - "RBK-PATH-ODIN-NOT-FOUND"
        - "RBK-PATH-OFFER-NOT-CREATED"
        - "RBK-PATH-STORE-NOT-OPEN"
        - "RBK-PATH-TIRE-STORE-NOT-ELIGIBLE"
        - "RBK-PATH-PHOTO-STORE-NOT-ELIGIBLE"
        - "RBK-PATH-CUSTOM-CAKE-STORE-NOT-ELIGIBLE"
        - "RBK-PATH-DRONE-STORE-NOT-ELIGIBLE"
        - "RBK-PATH-IP-STORE-NOT-ELIGIBLE"
        - "RBK-PATH-DELIVERY-INHOME-STORE-NOT-ELIGIBLE"
        - "RBK-PATH-OUTBOUND-GEO-OFFER-NOT-CREATED"
        - "RBK-PATH-OUTBOUND-GEO-CONSOLIDATED-MISSING"
        - "RBK-PATH-ESCALATE"
  post_verdict_actions: []

# ── Approved actions ──────────────────────────────────────────────
# Read-only validation pack — no post-approval mutations.
approved_actions: []

# ── Approval workflow ─────────────────────────────────────────────
approval_workflow:
  enabled: false
  provider: concord
  provider_display_name: "Concord"
  findings_extractors: []
  verdict_field: verdict
  verdict_actions:
    DEFAULT:
      actions: []
      previews:
        status: "Validation complete — see closure summary"
  fallback_verdict: BLOCKED

# ── Slack notification config ─────────────────────────────────────
slack:
  client_name: "limo-store-path-eligibility-agent"
  client_version: "0.1.0"
  thread_title_template: "🏬 {ref_link} — 1P Store Path Eligibility"
  thread_title_fallback: "🏬 *{external_ref}* — 1P Store Path Eligibility"
  notify_context_fields:
    - label: "Offer"
      raw_keys: ["offer_id"]
    - label: "Store"
      raw_keys: ["store_id"]
    - label: "Seller"
      raw_keys: ["seller_id"]
    - label: "Sub-case"
      raw_keys: ["subcase"]
    - label: "State"
      raw_keys: ["state_code"]
    - label: "ZIP"
      raw_keys: ["zip_code"]

# ── Runtime entry points ──────────────────────────────────────────
runtime:
  state_schema: "packs.limo_store_path_validation.state:PathEligibilityState"
  state_factory: "packs.limo_store_path_validation.state:empty_path_eligibility_state"

# ── Pipelines ─────────────────────────────────────────────────────
pipelines:
  incident:
    type: selector
    max_turns: 250
    termination_agent: ClosureAgent
    selector_prompt: >
      You are the orchestrator for the 1P Store Path Eligibility
      pipeline.  Select the NEXT agent strictly based on pipeline
      stage.  Each agent speaks ONCE.

      PIPELINE ORDER (strictly sequential — never go backward):
        1. TriageAgent     → extracts offer_id + store_id from the
                              user request.
        2. DiagnosticAgent → calls ODIN, MDM, optional Product RT,
                              dispatches sub-case, runs the eligible-
                              store list check (when relevant), then
                              AURUM + DEW + Consolidated.
        3. DecisionAgent   → mapped deterministically by the runtime.
        4. ActionAgent     → no-op for this read-only pack.
        5. ClosureAgent    → renders the closure template and terminates.

      RULES:
        - NEVER select an agent that has already produced output.
        - If a tool fails or short-circuits early (ODIN not found,
          store not OPEN, store-list block), still proceed to
          DecisionAgent so the verdict + closure render correctly.
        - After ClosureAgent speaks, the pipeline MUST end.
    agents:
      - name: TriageAgent
        role: Extracts the offer_id and store_id from the inbound request
        prompt_file: triage.j2
        tools: []

      - name: DiagnosticAgent
        role: >
          Walks the SOP — ODIN → MDM → Product RT → sub-case dispatch →
          store-list check → AURUM → DEW → Consolidated Store.  When
          the inbound text triggers the outbound_geo sub-case, walks
          Consolidated v2 + store-scoped DEW match + offer-level DEW
          grouping instead.
        prompt_file: diagnostic.j2
        tools:
          - DIAG-ODIN-01
          - DIAG-MDM-STORE-01
          - DIAG-PRODUCT-RT-01
          - DIAG-ROUTE-SUBCASE
          - DIAG-DISPATCH-SUBCASE
          - DIAG-CHECK-STORE-LIST
          - DIAG-AURUM-01
          - DIAG-DEW-STORE-01
          - DIAG-CONSOLIDATED-STORE-01
          - DIAG-ANALYZE-AURUM
          - DIAG-ANALYZE-DEW
          - DIAG-ANALYZE-CONSOLIDATED
          - DIAG-PATH-ODIN-OFR-CRT-01
          - DIAG-CONSOLIDATED-V2-01
          - DIAG-ANALYZE-CONSOLIDATED-V2
          - DIAG-DEW-RESTRICTION-STORE-01
          - DIAG-DEW-GEO-MATCH-01
          - DIAG-DEW-RESTRICTION-OFFER-01
          - DIAG-DEW-OFFER-GROUP-01

      - name: DecisionAgent
        role: Maps observations to a 1P store-path runbook verdict
        prompt_file: decision.j2
        tools:
          - DIAG-DECISION-MATRIX

      - name: ActionAgent
        role: Read-only pack — no actions performed
        prompt_file: action.j2
        tools: []

      - name: ClosureAgent
        role: Renders the closure template with the eligibility summary
        prompt_file: closure.j2
        tools: []

  retrieval:
    type: round_robin
    max_turns: 10
    termination_agent: RetrievalAgent
    agents:
      - name: RetrievalAgent
        role: >
          Answers natural-language questions about 1P store-path
          eligibility for a given offer + store, including outbound
          GEO / alcohol restrictions.
        prompt_file: retrieval.j2
        tools:
          # ── Standard flow (default) ──
          - DIAG-ODIN-01
          - DIAG-MDM-STORE-01
          - DIAG-PRODUCT-RT-01
          - DIAG-ROUTE-SUBCASE
          - DIAG-DISPATCH-SUBCASE
          - DIAG-CHECK-STORE-LIST
          - DIAG-AURUM-01
          - DIAG-ANALYZE-AURUM
          - DIAG-DEW-STORE-01
          - DIAG-ANALYZE-DEW
          - DIAG-CONSOLIDATED-STORE-01
          - DIAG-ANALYZE-CONSOLIDATED
          # ── Outbound GEO sub-SOP ──
          - DIAG-PATH-ODIN-OFR-CRT-01
          - DIAG-CONSOLIDATED-V2-01
          - DIAG-ANALYZE-CONSOLIDATED-V2
          - DIAG-DEW-RESTRICTION-STORE-01
          - DIAG-DEW-GEO-MATCH-01
          - DIAG-DEW-RESTRICTION-OFFER-01
          - DIAG-DEW-OFFER-GROUP-01
