# Tool Manifest — LIMO Online Eligibility Validation Pack
#
# Validates online eligibility for an (offer, node) pair across the
# MP / FC / WFS intents, with sub-SOPs for COST RT, Pre-Order,
# Replenishable, Shipsize, Ship Class, Sortable, Gifting, Substitution,
# ACS, and FTC.  The MAIN MP/FC/WFS intent is gathered via a Slack
# HITL menu (handled by the approval gate in pack.yaml); sub-SOP
# routing is keyword-driven from the inbound work-item text.
#
# Config references:
#   {{KEY}} in url_template / headers / body_template / query_params
#   resolve from Dynaconf [default.*] in secrets.toml at execution time.
#   Per-pack-prefix every key (LIMO_ONLINE_*) to avoid Dynaconf flat-key
#   collisions with limo_store_path_validation and other LIMO packs.

tools:

  # ── ODIN — fetch offer + node attributes ──────────────────────────

  - id: DIAG-ODIN-01
    type: http_api
    description: >
      Fetch the ODIN offer record and project the attributes the
      online eligibility SOP needs:  oid, sid, styp, oa.ofrCrt,
      oa.otyp, oa.prdId, oa.wfsElig, oa.ftc, oa.itmClsId,
      oa.gsTyp, oa.shpSzCd, oa.shpClsCd, oa.srtFlg, oa.oss.ase,
      oa.ptyp, oa.psi.accDNbr, oa.afa, oa.rplnFlg.
    method: GET
    url_template: "{{LIMO_ONLINE_ODIN_BASE_URL}}/odin/services/ops/offer/{{ offer_id }}"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    params:
      - name: offer_id
        type: str
        required: true
        description: "ODIN Offer ID (32-char uppercase hex)"
    response:
      processor: field_presence
      presence_fields:
        - "oid"
      extract_fields:
        offer_id: "oid"
        seller_id: "sid"
        seller_type: "styp"
        offer_created: "oa.ofrCrt"
        offer_type: "oa.otyp"
        product_id: "oa.prdId"
        wfs_eligible: "oa.wfsElig"
        ftc: "oa.ftc"
        item_class_id: "oa.itmClsId"
        goods_and_svc_type: "oa.gsTyp"
        ship_size_code_odin: "oa.shpSzCd"
        ship_class_code: "oa.shpClsCd"
        sortable_flag_odin: "oa.srtFlg"
        ase_odin: "oa.oss.ase"
        product_type: "oa.ptyp"
        acc_d_nbr: "oa.psi.accDNbr"
        approved_for_animals: "oa.afa"
        replen_flag_odin: "oa.rpln.isrpln"
      outcome_rules:
        - when: "has_fields"
          outcome: "ODIN_OFFER_FOUND"
        - when: ""
          outcome: "ODIN_NOT_FOUND"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "ODIN_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
      include_raw: false
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── AURUM FC — node-scoped attrs ──────────────────────────────────

  - id: DIAG-AURUM-FC-01
    type: http_api
    description: >
      Call AURUM Final Eligibility (FC mode) for an offer + node.
      Raw response is consumed by analyze_aurum_fc which projects
      offerNodeAttr.nodes[<node>] (finalEligibilities.path inclusions /
      exclusions / programEligibility / ols).
    method: GET
    url_template: "{{LIMO_ONLINE_AURUM_FC_BASE_URL}}/aurum/services/final-eligibility/preview/tenant/{{LIMO_ONLINE_AURUM_FC_TENANT}}/offer/{{ offer_id }}/node/{{ node_id }}"
    headers:
      Accept: "application/json"
    params:
      - name: offer_id
        type: str
        required: true
      - name: node_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "AURUM_FC_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "AURUM_NODE_MISSING"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── DEW FC API ────────────────────────────────────────────────────

  - id: DIAG-DEW-FC-01
    type: http_api
    description: >
      Call DEW FC API to retrieve ftxn.nodeData / outboundPaths for
      the offer + node.  Raw response is fed to analyze_dew_fc which
      filters to the matching node and flattens outbound paths.
      Internal endpoint; no WM_* auth headers required.
    method: GET
    url_template: "{{LIMO_ONLINE_DEW_FC_BASE_URL}}/offer/read/id/{{ offer_id }}-FC"
    headers:
      Accept: "application/json"
    params:
      - name: offer_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "DEW_FC_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "DEW_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── Promise / Wakanda (non-blocking) ──────────────────────────────

  - id: DIAG-PROMISE-01
    type: http_api
    description: >
      Call the Wakanda Promise (fuel/offer) API to confirm a promise
      was generated for the offer.  Non-blocking: failures or missing
      promise surface PROMISE_MISSING but do not block the verdict.
      Request body is offer-keyed only; nodeId is not part of the
      payload (the API returns per-offer nodeData which is filtered
      by the analyzer).
    method: POST
    url_template: "{{LIMO_ONLINE_PROMISE_BASE_URL}}/fuel/offer"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
      "FUEL_SUBSCRIPTION_ID": "{{LIMO_ONLINE_PROMISE_FUEL_SUBSCRIPTION_ID}}"
      "BATCH_ID": "{{LIMO_ONLINE_PROMISE_BATCH_ID}}"
      "WM_CONSUMER.ID": "{{LIMO_ONLINE_PROMISE_CONSUMER_ID}}"
      "WM_QOS.CORRELATION_ID": "{{LIMO_ONLINE_PROMISE_QOS_CORRELATION_ID}}"
    body_template:
      header:
        headerAttributes: {}
      payload:
        - offerId: "{{ offer_id }}"
    params:
      - name: offer_id
        type: str
        required: true
      - name: node_id
        type: str
        required: false
        description: "Unused in the request body but retained so the analyzer can filter."
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "PROMISE_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "PROMISE_MISSING"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 2
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 20


  # ── Eligibility Consolidated FC API ───────────────────────────────

  - id: DIAG-CONSOLIDATED-FC-01
    type: http_api
    description: >
      Call the Eligibility Consolidated API for the offer + address;
      raw response is fed to analyze_consolidated_fc which walks
      payload.consolidatedResponse[].offerConsolidated.nodeData.FC
      and filters paths by the requested node_id.  The upstream API
      is address-keyed (not node-keyed) and returns nodeData for
      every node attached to the offer; node filtering happens
      client-side in the analyzer.
    method: POST
    url_template: "{{LIMO_ONLINE_CONSOLIDATED_FC_BASE_URL}}/offer/consolidated"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
      "FUEL_SUBSCRIPTION_ID": "{{LIMO_ONLINE_CONSOLIDATED_FC_FUEL_SUBSCRIPTION_ID}}"
      "WM_CONSUMER.ID": "{{LIMO_ONLINE_CONSOLIDATED_FC_CONSUMER_ID}}"
      "WM_QOS.CORRELATION_ID": "{{LIMO_ONLINE_CONSOLIDATED_FC_QOS_CORRELATION_ID}}"
      "WM_SVC.ENV": "{{LIMO_ONLINE_CONSOLIDATED_FC_SVC_ENV}}"
      "WM_SVC.NAME": "{{LIMO_ONLINE_CONSOLIDATED_FC_SVC_NAME}}"
    body_template:
      payload:
        address:
          stateCode: "{{ state_code }}"
          zipCode: "{{ zip_code }}"
          countryCode: "{{ country_code }}"
        sellers:
          - partnerId: "{{ partner_id }}"
            partnerType: "{{ partner_type }}"
            nodes: []
            offers:
              - offerId: "{{ offer_id }}"
    params:
      - name: offer_id
        type: str
        required: true
      - name: node_id
        type: str
        required: true
        description: "Used by analyze_consolidated_fc to filter nodeData.FC paths client-side."
      - name: partner_id
        type: str
        required: true
        description: "ODIN sid"
      - name: partner_type
        type: str
        required: true
        description: "ODIN styp"
      - name: state_code
        type: str
        required: false
        default: "{{LIMO_ONLINE_CONSOLIDATED_FC_DEFAULT_STATE_CODE}}"
      - name: zip_code
        type: str
        required: false
        default: "{{LIMO_ONLINE_CONSOLIDATED_FC_DEFAULT_ZIP_CODE}}"
      - name: country_code
        type: str
        required: false
        default: "{{LIMO_ONLINE_CONSOLIDATED_FC_DEFAULT_COUNTRY_CODE}}"
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "CONSOLIDATED_FC_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "CONSOLIDATED_FC_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── Shipnodes — partnerId / status / shipnodeItemId / legacyDistributorId ──

  - id: DIAG-SHIPNODES-01
    type: http_api
    description: >
      Query the offer-keyed logistics record from the Shipnodes
      service.  Raw response (payload.logisticsOffer.*) is consumed by
      analyze_shipnodes which filters offerShipNodes[] to the
      requested node id and surfaces partnership / status fields.
    method: GET
    url_template: "{{LIMO_ONLINE_SHIPNODES_BASE_URL}}/fuel/v1/offers/{{ offer_id }}"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
      "WM_CONSUMER.ID": "{{LIMO_ONLINE_SHIPNODES_CONSUMER_ID}}"
    params:
      - name: offer_id
        type: str
        required: true
        description: "ODIN Offer ID (32-char uppercase hex)"
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "SHIPNODES_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "SHIPNODE_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── IQS SI — item-number lookup for COST RT ───────────────────────

  - id: DIAG-IQS-SI-01
    type: http_api
    description: >
      Resolve the IQS itemNumber for a given ODIN product id (WPID).
      Used as the input to the Shipnodes call in the COST RT sub-SOP.
    method: GET
    url_template: "{{LIMO_ONLINE_IQS_SI_BASE_URL}}/catalog/v1"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
      "WM_CONSUMER.ID": "{{LIMO_ONLINE_IQS_SI_CONSUMER_ID}}"
      "WM_QOS.CORRELATION_ID": "{{LIMO_ONLINE_IQS_SI_QOS_CORRELATION_ID}}"
      "WM_SVC.ENV": "{{LIMO_ONLINE_IQS_SI_SVC_ENV}}"
      "WM_SVC.NAME": "{{LIMO_ONLINE_IQS_SI_SVC_NAME}}"
      "WM_SVC.VERSION": "{{LIMO_ONLINE_IQS_SI_SVC_VERSION}}"
    query_params:
      id: "{{ product_id }}"
      filterGoldenData: "false"
      type: "WPID"
      rt: "SI"
    params:
      - name: product_id
        type: str
        required: true
        description: "ODIN product id (WPID)"
    response:
      processor: field_presence
      presence_fields:
        - "payload[0].itemNumber"
      extract_fields:
        iqs_item_number: "payload[0].itemNumber"
      outcome_rules:
        - when: "has_fields"
          outcome: "IQS_ITEM_PRESENT"
        - when: ""
          outcome: "IQS_ITEM_MISSING"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "IQS_ITEM_MISSING"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
      include_raw: false
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── DEW Seller — ACS / ASE status ─────────────────────────────────

  - id: DIAG-DEW-SELLER-01
    type: http_api
    description: >
      Fetch seller-level ACS / ASE status from the DEW Seller endpoint.
      Used by the ACS sub-SOP to confirm a seller is enrolled in
      Automated Shipping Enabled.  Raw response is consumed by
      analyze_dew_seller which surfaces programsDTO.AUTOMATED_SHIPPING_ENABLED.status
      and the root ``ase`` boolean.
      Internal endpoint; no WM_* auth headers required.
    method: GET
    url_template: "{{LIMO_ONLINE_DEW_SELLER_BASE_URL}}/seller/read/id/{{ seller_id }}-SLR-ELG"
    headers:
      Accept: "application/json"
    params:
      - name: seller_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "DEW_SELLER_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "DEW_SELLER_MISSING"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── DCC — distributor center check (ACS) ──────────────────────────

  - id: DIAG-DCC-01
    type: http_api
    description: >
      Check the DCC (Distributor Center Check) endpoint for the
      legacy distributor id.  Returns the distributorCore record;
      analyze_dcc derives acs_enabled = (active && status == "ENABLED").
    method: GET
    url_template: "{{LIMO_ONLINE_DCC_BASE_URL}}/dc-square-app/services/distributors/{{ legacy_distributor_id }}"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
      "WM_CONSUMER.ID": "{{LIMO_ONLINE_DCC_CONSUMER_ID}}"
      "WM_SVC.ENV": "{{LIMO_ONLINE_DCC_SVC_ENV}}"
      "WM_SVC.NAME": "{{LIMO_ONLINE_DCC_SVC_NAME}}"
      "WM_SVC.VERSION": "{{LIMO_ONLINE_DCC_SVC_VERSION}}"
      "WM_BU.ID": "{{LIMO_ONLINE_DCC_BU_ID}}"
      "WM_MART.ID": "{{LIMO_ONLINE_DCC_MART_ID}}"
    params:
      - name: legacy_distributor_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "DCC_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "DCC_MISSING"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── ACS inputs bundle (python_function) ───────────────────────────
  # Single server-side call that fetches DEW Seller + Shipnodes + DCC
  # + Consolidated FC, runs each analyzer, and surfaces every slot the
  # ACS verdict gate needs (ase_status, ase_seller, acs_enabled,
  # legacy_distributor_id, plus pass-through ase_odin).  Replaces the
  # six-tool LLM chain in the ACS sub-SOP so gpt-4.1-mini cannot
  # truncate the cascade.

  - id: DIAG-ACS-INPUTS-BUNDLE-01
    type: python_function
    description: >
      Fetch every ACS input upstream (DEW Seller, Shipnodes, DCC,
      Consolidated FC) and surface the four slots the ACS verdict
      needs in one call.  Inputs: seller_id (ODIN sid), node_id,
      offer_id, partner_id, partner_type, plus optional state_code /
      zip_code / country_code for Consolidated, plus the ase_odin
      flag from ODIN (passed through verbatim).  Emits
      ACS_INPUTS_BUNDLED with ase_odin, ase_status, ase_seller,
      acs_enabled, legacy_distributor_id, and a per-source `sources`
      record for debugging.  Never raises — a failed upstream
      surfaces in sources[name].error and leaves the corresponding
      slot null.
    import: "packs.limo_online_validation.acs_bundle:acs_inputs_bundled"
    params:
      - name: seller_id
        type: str
        required: true
        description: "ODIN seller id (sid) — passed to DEW Seller"
      - name: node_id
        type: str
        required: true
        description: "Node id the offer is being validated against"
      - name: offer_id
        type: str
        required: true
        description: "ODIN offer id (oid)"
      - name: partner_id
        type: str
        required: false
        description: "Partner id for the Consolidated FC body"
      - name: partner_type
        type: str
        required: false
        description: "Partner type for the Consolidated FC body"
      - name: state_code
        type: str
        required: false
        description: "Shipping address state code (default from config)"
      - name: zip_code
        type: str
        required: false
        description: "Shipping address zip code (default from config)"
      - name: country_code
        type: str
        required: false
        description: "Shipping address country code (default from config)"
      - name: ase_odin
        type: str
        required: false
        description: "ODIN oa.oss.ase pass-through for the verdict"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 180


  # ── Intent classifier (python_function) ───────────────────────────

  - id: DIAG-CLASSIFY-INTENT
    type: python_function
    description: >
      Decide whether the HITL gate must fire.  Returns
      INTENT_RESOLVED + intent (MP/FC/WFS) when state.intent is set
      from the Slack callback, otherwise INTENT_REQUIRED.
    import: "packs.limo_online_validation.intent_dispatch:classify_intent"
    params:
      - name: intent
        type: str
        required: false
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Sub-intent dispatcher (python_function) ───────────────────────

  - id: DIAG-CLASSIFY-SUB-INTENT
    type: python_function
    description: >
      Keyword scan of the work-item text.  Returns one of: cost_rt,
      pre_order, replenishable, shipsize, ship_class, sortable,
      gifting, substitution, acs, ftc, or main (fallback).
    import: "packs.limo_online_validation.intent_dispatch:classify_sub_intent"
    params:
      - name: work_item_text
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Offer ID format validator (python_function) ───────────────────
  # Pre-flight check that the inbound offer_id matches the ODIN
  # 32-char uppercase hex contract.  Emits OFFER_ID_VALID /
  # OFFER_ID_INVALID so the prompt can short-circuit cleanly.

  - id: DIAG-OFFER-ID-VALIDATE-01
    type: python_function
    description: >
      Validate that the inbound offer_id matches the ODIN
      32-character uppercase hexadecimal format.
    import: "packs.limo_online_validation.case1_gate:validate_offer_id"
    params:
      - name: offer_id
        type: str
        required: true
        description: "Offer ID extracted by TriageAgent"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Intent detector (python_function) ─────────────────────────────
  # Three-stage resolver.  Honours state.intent, then scans the inbound
  # text for WFS/FC/MP, then falls through to a sub-SOP keyword scan
  # (cost rt / pre-order / replenishable / acs / substitution /
  # restriction / seller enforcement / shipsize / sortable / gifting /
  # ftc).  Sub-SOPs do not require a main intent — when a sub-SOP
  # keyword matches the resolver emits SUB_INTENT_RESOLVED with
  # sub_intent set and intent=None, and the chat pipeline routes
  # straight to the sub-SOP flow.  Returns INTENT_REQUIRED with a
  # ready-to-render menu only when nothing matches.

  - id: DIAG-INTENT-EXTRACT-01
    type: python_function
    description: >
      Resolve the main intent (FC / WFS / MP) from state.intent, then
      from a whole-word scan of work_item_text, then fall through to a
      sub-SOP keyword scan.  Emits INTENT_RESOLVED (main intent),
      SUB_INTENT_RESOLVED with sub_intent set (sub-SOP only, no main
      intent required), or INTENT_REQUIRED with a ready-to-render menu
      message.
    import: "packs.limo_online_validation.case1_gate:detect_intent"
    params:
      - name: intent
        type: str
        required: false
        description: "Resolved state.intent slot (if any)"
      - name: work_item_text
        type: str
        required: false
        description: "Inbound user text for keyword fallback"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Sub-SOP deterministic tool plan (python_function) ─────────────
  # Consulted by the chat prompt immediately after DIAG-INTENT-EXTRACT-01
  # returns SUB_INTENT_RESOLVED.  Given the resolved sub_intent code,
  # returns the ordered tool_sequence the LLM must call, the forbidden
  # tool ids, and the output block name.  Removes AURUM/DEW/Promise/
  # Consolidated-gated tools from the menu the LLM is told it may use.

  - id: DIAG-SUB-SOP-ROUTER-01
    type: python_function
    description: >
      Deterministic standalone-sub-SOP tool plan.  Inputs: sub_intent
      (the code emitted by DIAG-INTENT-EXTRACT-01 on the
      SUB_INTENT_RESOLVED branch).  Emits SUB_SOP_PLAN_RESOLVED with
      tool_sequence (ordered ids the LLM must call), forbidden_tools
      (must never be called in standalone mode), output_block (sub-SOP
      block heading), and a verbatim instruction string.  Returns
      SUB_SOP_PLAN_UNKNOWN with empty tool_sequence for unknown codes.
    import: "packs.limo_online_validation.sub_sop_router:plan_sub_sop"
    params:
      - name: sub_intent
        type: str
        required: true
        description: "Resolved sub-SOP code (cost_rt, pre_order, …)"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 2


  # ── Case 1 intent-aware gate (python_function) ────────────────────
  # Universal oa.ofrCrt check plus the intent-specific gate (FC →
  # oa.otyp ∈ {ONLINE_ONLY, ONLINE_AND_STORE}; WFS → wfsElig == true;
  # MP → wfsElig is informational, never blocking).  Emits CASE1_PROCEED
  # (optionally carrying notice_code / notice_message for the MP +
  # wfsElig=true advisory) or CASE1_BLOCKED with a stable block_code
  # and an intent-aware stop_message the prompt and closure template
  # render verbatim.

  - id: DIAG-CASE1-GATE-01
    type: python_function
    description: >
      Deterministic Case 1 pre-flight gate.  Inputs: intent (FC/WFS/MP),
      ofr_crt (oa.ofrCrt), wfs_elig (oa.wfsElig), offer_type (oa.otyp).
      Emits CASE1_PROCEED (optionally with notice_code =
      MP_WFS_ELIGIBLE_NOTICE when MP intent meets wfsElig=true), or
      CASE1_BLOCKED with block_code in {OFFER_NOT_CREATED,
      OTYPE_INVALID, WFS_NOT_ELIGIBLE, INTENT_REQUIRED} and an
      intent-aware stop_message.  MP intent never blocks at Case 1
      on wfsElig — it proceeds to Cases 2–5 and surfaces the notice.
    import: "packs.limo_online_validation.case1_gate:case1_gate"
    params:
      - name: intent
        type: str
        required: true
        description: "Resolved main intent (FC / WFS / MP)"
      - name: ofr_crt
        type: str
        required: false
        description: "ODIN oa.ofrCrt value"
      - name: wfs_elig
        type: str
        required: false
        description: "ODIN oa.wfsElig value"
      - name: offer_type
        type: str
        required: false
        description: "ODIN oa.otyp value"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── AURUM FC analyzer (python_function) ───────────────────────────

  - id: DIAG-ANALYZE-AURUM-FC
    type: python_function
    description: >
      Project AURUM offerNodeAttr.nodes[<node>] for FC mode (with
      fallback to legacy offerDistributorAttr.nodes shape).  Surfaces
      finalEligibilities.path inclusions + exclusions, programEligibility,
      and the offer listing status (ols).  Emits AURUM_NODE_MISSING,
      AURUM_NODE_INACTIVE, AURUM_NO_PATHS, or AURUM_PATHS_PRESENT.
    import: "packs.limo_online_validation.analyzers:analyze_aurum_fc"
    params:
      - name: aurum_response
        type: dict
        required: true
      - name: node_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── DEW FC analyzer (python_function) ─────────────────────────────

  - id: DIAG-ANALYZE-DEW-FC
    type: python_function
    description: >
      Filter ftxn.nodeData to the matching node id and flatten
      outboundPaths into [{path, methods, types}] rows.  Emits
      DEW_PATHS_PRESENT or DEW_NO_PATHS.
    import: "packs.limo_online_validation.analyzers:analyze_dew_fc"
    params:
      - name: dew_response
        type: dict
        required: true
      - name: node_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Promise analyzer (python_function, non-blocking) ──────────────

  - id: DIAG-ANALYZE-PROMISE
    type: python_function
    description: >
      Filter Wakanda Promise nodeData by the requested node_id and
      project one row per outboundPaths[] entry (node_type, node_id,
      path, types_csv, fulfillment_promise).  Emits PROMISE_PRESENT or
      PROMISE_MISSING (non-blocking — never STOPs the cascade).
    import: "packs.limo_online_validation.analyzers:analyze_promise"
    params:
      - name: promise_response
        type: dict
        required: true
      - name: node_id
        type: string
        required: false
        default: ""
        description: "Restricts promise_paths[] to entries whose id == node_id; pass '' to keep all."
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Consolidated FC analyzer (python_function) ────────────────────

  - id: DIAG-ANALYZE-CONSOLIDATED-FC
    type: python_function
    description: >
      Walk payload.consolidatedResponse[].offerConsolidated.nodeData.FC
      for the given node id, applying the eligible/nodes/nodeExceptions
      semantics from the SOP.  Surfaces eligible vs not-eligible Types,
      fulfillmentSpeed, shipsize, sortable, gifting, substitution, ftc.
    import: "packs.limo_online_validation.analyzers:analyze_consolidated_fc"
    params:
      - name: consolidated_response
        type: dict
        required: true
      - name: node_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Shipnodes analyzer (python_function) ──────────────────────────

  - id: DIAG-ANALYZE-SHIPNODES
    type: python_function
    description: >
      Filter payload.logisticsOffer.offerShipNodes[] to the requested
      node id and surface partnership / status / item / distributor
      fields.  Emits SHIPNODE_PRESENT or SHIPNODE_NOT_FOUND.
    import: "packs.limo_online_validation.analyzers:analyze_shipnodes"
    params:
      - name: shipnodes_response
        type: dict
        required: true
      - name: node_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── DEW Seller analyzer (python_function) ─────────────────────────

  - id: DIAG-ANALYZE-DEW-SELLER
    type: python_function
    description: >
      Surface ASE program status from the DEW Seller payload.
      Reads programsDTO.AUTOMATED_SHIPPING_ENABLED.status and the
      root ``ase`` boolean.  Emits DEW_SELLER_PRESENT (with
      ase_status / ase_seller) or DEW_SELLER_MISSING.
    import: "packs.limo_online_validation.analyzers:analyze_dew_seller"
    params:
      - name: dew_seller_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── DCC analyzer (python_function) ────────────────────────────────

  - id: DIAG-ANALYZE-DCC
    type: python_function
    description: >
      Derive ACS-enabled from the DCC distributor record.
      acs_enabled is true when payload.distributorCore.active is true
      AND payload.distributorCore.status == "ENABLED".  Also surfaces
      distributorType + distributorSupportedServices for diagnostics.
      Emits DCC_PRESENT or DCC_MISSING.
    import: "packs.limo_online_validation.analyzers:analyze_dcc"
    params:
      - name: dcc_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Substitution analyzer (python_function) ───────────────────────

  - id: DIAG-ANALYZE-SUBSTITUTION
    type: python_function
    description: >
      Flatten substitutionRestrictions[] into a CSV.  Defaults to
      "No restriction found" when the array is empty.
    import: "packs.limo_online_validation.analyzers:analyze_substitution"
    params:
      - name: consolidated_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Shipsize derivation (python_function) ─────────────────────────

  - id: DIAG-DERIVE-SHIPSIZE
    type: python_function
    description: >
      Compute girth = (2*height) + (2*width) + length and look up the
      derived shipsize bracket (TINY/SMALL/MEDIUM/LARGE/XLARGE/FREIGHT)
      per the SOP shipsize table.
    import: "packs.limo_online_validation.shipsize:derive_shipsize"
    params:
      - name: unit_height
        type: float
        required: false
      - name: unit_length
        type: float
        required: false
      - name: unit_width
        type: float
        required: false
      - name: unit_weight
        type: float
        required: false
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Offer-fully-created gate (python_function) ────────────────────
  # Shared Case 1 gate for the Seller Enforcement and DEW Restriction
  # sub-SOPs.  Reads ODIN ``oa.ofrCrt`` and emits OFFER_FULLY_CREATED
  # vs OFFER_NOT_CREATED so the prompt can short-circuit before
  # calling the external endpoints.

  - id: DIAG-ODIN-OFR-CRT-01
    type: python_function
    description: >
      Gate on ODIN oa.ofrCrt.  Emits OFFER_FULLY_CREATED when the
      flag normalises to true, OFFER_NOT_CREATED when false, or
      OFFER_CRT_UNKNOWN when the input is missing/unparseable.
    import: "packs.limo_online_validation.seller_enforcement:check_offer_fully_created"
    params:
      - name: ofr_crt
        type: str
        required: false
        description: "Raw oa.ofrCrt value from DIAG-ODIN-01"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Seller Enforcement — fetch (http_api) ─────────────────────────
  # Reads inbound.seller_enforcement from the Derivator core readDb
  # endpoint by seller_id (sid).  Body schema mirrors the production
  # curl exactly: id.{id,type}=SE + cluster/keyspace/table from
  # secrets.toml.

  - id: DIAG-SELLER-ENFORCEMENT-FETCH-01
    type: http_api
    description: >
      Fetch the Derivator seller_enforcement row for a given seller
      id (sid).  Returns payload.restrictions (a list of restriction
      tokens like ["SELLER_PATH", "WALMART_PATH"]) plus payload.cId.
    method: POST
    url_template: "{{LIMO_ONLINE_SELLER_ENFORCEMENT_BASE_URL}}/core/readDb"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
      "wm_consumer.id": "{{LIMO_ONLINE_SELLER_ENFORCEMENT_CONSUMER_ID}}"
      "wm_qos.correlation_id": "{{LIMO_ONLINE_SELLER_ENFORCEMENT_QOS_CORRELATION_ID}}"
      "wm_svc.env": "{{LIMO_ONLINE_SELLER_ENFORCEMENT_SVC_ENV}}"
      "wm_svc.name": "{{LIMO_ONLINE_SELLER_ENFORCEMENT_SVC_NAME}}"
      "wm_svc.version": "{{LIMO_ONLINE_SELLER_ENFORCEMENT_SVC_VERSION}}"
    body_template:
      clusterName: "{{LIMO_ONLINE_SELLER_ENFORCEMENT_CLUSTER_NAME}}"
      keyspace: "{{LIMO_ONLINE_SELLER_ENFORCEMENT_KEYSPACE}}"
      table: "{{LIMO_ONLINE_SELLER_ENFORCEMENT_TABLE}}"
      id:
        id: "{{ seller_id }}"
        type: "{{LIMO_ONLINE_SELLER_ENFORCEMENT_ID_TYPE}}"
    params:
      - name: seller_id
        type: str
        required: true
        description: "ODIN sid"
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "SELLER_ENFORCEMENT_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "SELLER_ENFORCEMENT_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── Seller Enforcement — classify (python_function) ───────────────

  - id: DIAG-SELLER-ENFORCEMENT-CLASSIFY-01
    type: python_function
    description: >
      Deterministic gate over the seller_enforcement payload.
      Inputs:  restrictions list (from DIAG-SELLER-ENFORCEMENT-FETCH-01),
               wfs_eligible + seller_type (from DIAG-ODIN-01).
      Emits ENFORCEMENT_NOT_APPLICABLE (internal seller),
            ENFORCEMENT_CLEAR (relevant path not enforced), or
            ENFORCEMENT_BLOCKED (relevant path is enforced).
    import: "packs.limo_online_validation.seller_enforcement:classify_seller_enforcement"
    params:
      - name: restrictions
        type: list
        required: false
        description: "payload.restrictions from the fetch response"
      - name: wfs_eligible
        type: str
        required: false
      - name: seller_type
        type: str
        required: false
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── DEW Restriction — fetch (http_api) ────────────────────────────
  # No auth headers required for this endpoint — the dew-sync-ops
  # service is internal and accepts an unauthenticated GET.

  - id: DIAG-DEW-RESTRICTION-FETCH-01
    type: http_api
    description: >
      Fetch the DEW sync-ops offer record by offer id.  Returns the
      forxn[] array used by the DEW Restriction sub-SOP.
    method: GET
    url_template: "{{LIMO_ONLINE_DEW_RESTRICTION_BASE_URL}}/offer/read/id/{{ offer_id }}"
    headers:
      Accept: "application/json"
    params:
      - name: offer_id
        type: str
        required: true
        description: "ODIN Offer ID (32-char uppercase hex)"
    response:
      processor: passthrough
      include_raw: true
      outcome_rules:
        - when: ""
          outcome: "DEW_RESTRICTION_RESPONSE_RECEIVED"
      error_outcomes:
        "400": "BAD_REQUEST"
        "401": "AUTH_ERROR"
        "403": "AUTH_ERROR"
        "404": "DEW_RESTRICTION_NOT_FOUND"
        "429": "RATE_LIMITED"
        "500": "UPSTREAM_ERROR"
        "503": "UPSTREAM_UNAVAILABLE"
    retry:
      max_attempts: 3
      backoff_seconds: 1.0
      backoff_multiplier: 2.0
      retryable_status_codes: [429, 502, 503, 504]
    risk: low
    timeout_seconds: 30


  # ── DEW Restriction — group (python_function) ─────────────────────

  - id: DIAG-DEW-RESTRICTION-GROUP-01
    type: python_function
    description: >
      Group the DEW forxn[] entries by individual restriction path.
      Each forxn entry's path + state are lists; we explode by path
      and union the state codes per distinct path, yielding rows of
      {path, states[]} sorted by path.  Emits DEW_RESTRICTIONS_PRESENT
      when any rows are produced, DEW_NO_RESTRICTIONS otherwise.
    import: "packs.limo_online_validation.dew_restriction:group_dew_restrictions"
    params:
      - name: forxn
        type: list
        required: false
        description: "forxn array from DIAG-DEW-RESTRICTION-FETCH-01"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Case 2 gate + gated HTTP wrappers (retrieval pipeline) ────────
  # Deterministic Python wrappers for AURUM / DEW / Promise / Consolidated.
  # The AURUM wrapper fetches + analyzes in one step so the LLM cannot
  # render the AURUM block from the raw HTTP response when the per-node
  # payload lives in offerDistributorAttr.nodes.  The DEW / Promise /
  # Consolidated wrappers re-derive the Case 2 (AURUM) gate from the
  # raw AURUM response and refuse to make the upstream HTTP call when
  # the gate fails — the chat pipeline therefore cannot reach DEW /
  # Promise / Consolidated for an INACTIVE node, regardless of LLM
  # behaviour.

  - id: DIAG-AURUM-FC-ANALYZED-01
    type: python_function
    description: >
      Fetch AURUM FC for offer_id + node_id and project the per-node
      payload in one call.  Returns analyzer fields (outcome,
      aurum_node_id, aurum_node_type, aurum_node_status,
      aurum_dcc_status, aurum_ols, aurum_inclusions, aurum_exclusions)
      plus the raw response under `raw`.  Handles both the
      offerNodeAttr.nodes (DSV) and offerDistributorAttr.nodes
      (Marketplace / Distributor) shapes — the analyzer falls back to
      the distributor block when offerNodeAttr.nodes is empty.
    import: "packs.limo_online_validation.case2_gate:aurum_fc_analyzed"
    params:
      - name: offer_id
        type: str
        required: true
      - name: node_id
        type: str
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 35


  - id: DIAG-DEW-FC-GATED-01
    type: python_function
    description: >
      Gated DEW FC fetch.  Takes the raw AURUM response captured by
      DIAG-AURUM-FC-01 plus offer_id + node_id, re-derives the Case 2
      gate (aurum_node_status == ACTIVE && aurum_dcc_status == true),
      and either (a) returns CASE2_BLOCKED with no upstream call, or
      (b) calls DEW FC and returns analyzed dew_paths[].
    import: "packs.limo_online_validation.case2_gate:dew_fc_gated"
    params:
      - name: offer_id
        type: str
        required: true
      - name: node_id
        type: str
        required: true
      - name: aurum_response
        type: dict
        required: true
        description: "Raw response from DIAG-AURUM-FC-01"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 35


  - id: DIAG-PROMISE-GATED-01
    type: python_function
    description: >
      Gated Wakanda Promise fetch.  Takes the raw AURUM response plus
      offer_id + node_id, re-derives the Case 2 gate, and either
      returns CASE2_BLOCKED with no upstream call, or calls the
      Promise API and returns analyzed promise_paths[].
    import: "packs.limo_online_validation.case2_gate:promise_gated"
    params:
      - name: offer_id
        type: str
        required: true
      - name: node_id
        type: str
        required: true
      - name: aurum_response
        type: dict
        required: true
        description: "Raw response from DIAG-AURUM-FC-01"
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 25


  - id: DIAG-CONSOLIDATED-FC-GATED-01
    type: python_function
    description: >
      Gated Eligibility Consolidated fetch.  Takes the raw AURUM
      response plus offer_id + node_id + partner_id + partner_type,
      re-derives the Case 2 gate, and either returns CASE2_BLOCKED
      with no upstream call, or calls the Consolidated API and
      returns analyzed consolidated_paths[].
    import: "packs.limo_online_validation.case2_gate:consolidated_fc_gated"
    params:
      - name: offer_id
        type: str
        required: true
      - name: node_id
        type: str
        required: true
      - name: partner_id
        type: str
        required: true
        description: "ODIN sid"
      - name: partner_type
        type: str
        required: true
        description: "ODIN styp"
      - name: aurum_response
        type: dict
        required: true
        description: "Raw response from DIAG-AURUM-FC-01"
      - name: state_code
        type: str
        required: false
      - name: zip_code
        type: str
        required: false
      - name: country_code
        type: str
        required: false
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 35


  # ── Sub-SOP analyzers (Consolidated extras) ───────────────────────

  - id: DIAG-ANALYZE-PREORDER-CONSOLIDATED
    type: python_function
    description: >
      Surface ``preOrder`` + ``streetDate`` from the first
      offerConsolidated block.  Emits PREORDER_CONSOLIDATED_PRESENT
      with preorder_flag + preorder_consolidated_street_date, or
      PREORDER_CONSOLIDATED_MISSING.
    import: "packs.limo_online_validation.analyzers:analyze_preorder_consolidated"
    params:
      - name: consolidated_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-ANALYZE-PREORDER-SHIPNODES
    type: python_function
    description: >
      Surface ``preOrderInfo.{streetDate,preOrder}`` from
      payload.logisticsOffer.  Emits PREORDER_SHIPNODES_PRESENT or
      PREORDER_SHIPNODES_MISSING.
    import: "packs.limo_online_validation.analyzers:analyze_preorder_shipnodes"
    params:
      - name: shipnodes_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-ANALYZE-REPLENISHABLE-SHIPNODES
    type: python_function
    description: >
      Surface ``replenishmentInfo.replenishmentFlag`` from
      payload.logisticsOffer.  Emits REPLENISHABLE_SHIPNODES_PRESENT
      with the bool or REPLENISHABLE_SHIPNODES_MISSING.
    import: "packs.limo_online_validation.analyzers:analyze_replenishable_shipnodes"
    params:
      - name: shipnodes_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-ANALYZE-SHIPSIZE-CONSOLIDATED
    type: python_function
    description: >
      Surface raw dimensions (height/length/width/weight) and the
      Consolidated shipSizeCode from offerConsolidated.  Emits
      SHIPSIZE_CONSOLIDATED_PRESENT or SHIPSIZE_CONSOLIDATED_MISSING.
    import: "packs.limo_online_validation.analyzers:analyze_shipsize_consolidated"
    params:
      - name: consolidated_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-ANALYZE-SORTABLE-CONSOLIDATED
    type: python_function
    description: >
      Surface ``sortable`` from offerShipmentSpecification (with
      fallback to top-level sortable / sortableFlag).  Emits
      SORTABLE_CONSOLIDATED_PRESENT or SORTABLE_CONSOLIDATED_MISSING.
    import: "packs.limo_online_validation.analyzers:analyze_sortable_consolidated"
    params:
      - name: consolidated_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-ANALYZE-GIFTING
    type: python_function
    description: >
      Project ``giftingEligibility`` (giftWrap/giftMessage/giftReceipt/
      overbox) onto state slots.  ``gifting_eligibility`` is true when
      any sub-flag is true.  Emits GIFTING_PRESENT or GIFTING_MISSING.
    import: "packs.limo_online_validation.analyzers:analyze_gifting"
    params:
      - name: consolidated_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-ANALYZE-ACS-CONSOLIDATED
    type: python_function
    description: >
      Surface ``isACSEnabled`` from offerConsolidated (fallback to
      ``acsEnabled``).  Emits ACS_CONSOLIDATED_PRESENT or
      ACS_CONSOLIDATED_MISSING.
    import: "packs.limo_online_validation.analyzers:analyze_acs_consolidated"
    params:
      - name: consolidated_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-ANALYZE-FTC-CONSOLIDATED
    type: python_function
    description: >
      Surface ``fulfillmentTypeClassification`` as a CSV from
      offerConsolidated.  Emits FTC_CONSOLIDATED_PRESENT or
      FTC_CONSOLIDATED_MISSING.
    import: "packs.limo_online_validation.analyzers:analyze_ftc_consolidated"
    params:
      - name: consolidated_response
        type: dict
        required: true
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Sub-SOP verdict gates ─────────────────────────────────────────

  - id: DIAG-COST-RT-GATE-01
    type: python_function
    description: >
      COST RT verdict gate.  Inputs: iqs_item_number,
      shipnode_item_id, iqs_partnership_type_code, shipnode_status.
      Emits COST_RT_NO_SI, COST_RT_STORES_ONLY, COST_RT_INACTIVE, or
      COST_RT_PROCEED with a stop_message the closure renders verbatim.
    import: "packs.limo_online_validation.sub_sop_gates:cost_rt_gate"
    params:
      - name: iqs_item_number
        type: str
        required: false
      - name: shipnode_item_id
        type: str
        required: false
      - name: iqs_partnership_type_code
        type: str
        required: false
      - name: shipnode_status
        type: str
        required: false
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-PREORDER-VERDICT-01
    type: python_function
    description: >
      Pre-Order verdict gate.  Compares the inbound streetDate
      (Shipnodes preferred, Consolidated fallback) to current UTC.
      Emits PREORDER_SELLER_EXTERNAL (EXTERNAL seller exit),
      PREORDER_NO_STREET_DATE, PREORDER_PAST_STREET_DATE, or
      PREORDER_FUTURE_STREET_DATE.
    import: "packs.limo_online_validation.sub_sop_gates:preorder_verdict"
    params:
      - name: preorder_street_date
        type: str
        required: false
      - name: preorder_consolidated_street_date
        type: str
        required: false
      - name: seller_type
        type: str
        required: false
      - name: now_iso
        type: str
        required: false
        description: "Override 'now' for tests; defaults to current UTC."
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-REPLENISHABLE-VERDICT-01
    type: python_function
    description: >
      Replenishable verdict gate.  EXTERNAL sellers exit with
      REPLEN_SELLER_EXTERNAL; otherwise compares ODIN ``rplnFlg``
      against Shipnodes ``replenishmentFlag`` and emits REPLEN_TRUE,
      REPLEN_FALSE, REPLEN_MISMATCH, or REPLEN_FLAG_MISSING.
    import: "packs.limo_online_validation.sub_sop_gates:replenishable_verdict"
    params:
      - name: seller_type
        type: str
        required: false
      - name: replen_flag_odin
        type: str
        required: false
      - name: replenishment_flag
        type: str
        required: false
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-ACS-VERDICT-01
    type: python_function
    description: >
      ACS enrollment verdict.  Inputs: ase_odin (oa.oss.ase),
      ase_status + ase_seller (DEW Seller), acs_enabled (Consolidated
      isACSEnabled).  Emits ACS_ENROLLED, ACS_NOT_ENROLLED, or
      ACS_INPUTS_MISSING with a stop_message the closure renders.
    import: "packs.limo_online_validation.sub_sop_gates:acs_verdict"
    params:
      - name: ase_odin
        type: str
        required: false
      - name: ase_status
        type: str
        required: false
      - name: ase_seller
        type: str
        required: false
      - name: acs_enabled
        type: str
        required: false
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  - id: DIAG-FTC-MATRIX-01
    type: python_function
    description: >
      7-row FTC truth table.  Walks PHARMACY_PETS, WALMART_PLASTIC_GIFT_CARD,
      NON_WALMART_PLASTIC_GIFT_CARD, FREIGHT, PHOTOS, TIRE, DIGITAL —
      first match wins.  Inputs: ftc_csv (ODIN oa.ftc CSV-rendered),
      ftc_consolidated (Consolidated fallback).  Emits FTC_<token> or
      FTC_STANDARD with the matched runbook id.
    import: "packs.limo_online_validation.sub_sop_gates:ftc_matrix"
    params:
      - name: ftc_csv
        type: str
        required: false
      - name: ftc_consolidated
        type: str
        required: false
    response:
      processor: passthrough
      include_raw: false
    risk: low
    timeout_seconds: 5


  # ── Decision engine — first-match rule table ──────────────────────

  - id: DIAG-DECISION-MATRIX
    type: decision_matrix
    description: >
      Map ODIN / AURUM FC / DEW FC / Promise / Consolidated /
      sub-SOP observations to an online eligibility verdict.
      First-match wins.
    params:
      - name: observations
        type: str
        required: true
        description: "JSON-encoded diagnostic observations dict"
    decision_rules:
      # ── HITL intent gate ──
      - id: "ONLINE-INTENT-REQUIRED"
        conditions:
          DIAG-INTENT-EXTRACT-01: "INTENT_REQUIRED"
        runbook: "RBK-ONLINE-INTENT-REQUIRED"
        description: "Main MP/FC/WFS intent missing — fire HITL Slack gate."
      - id: "ONLINE-INTENT-REQUIRED-LEGACY"
        conditions:
          DIAG-CLASSIFY-INTENT: "INTENT_REQUIRED"
        runbook: "RBK-ONLINE-INTENT-REQUIRED"
        description: "Main MP/FC/WFS intent missing — fire HITL Slack gate."

      # ── Pre-validation gates ──
      - id: "ONLINE-ODIN-NOT-FOUND"
        conditions:
          DIAG-ODIN-01: "ODIN_NOT_FOUND"
        runbook: "RBK-ONLINE-ODIN-NOT-FOUND"
        description: "Offer not found in ODIN."

      # ── Case 1 deterministic gate (intent-aware) ──
      # First-match precedence: the gate's block_code drives the
      # runbook directly; the legacy state.* rows below remain as a
      # fallback when the gate has not yet run (e.g. legacy callers).
      - id: "ONLINE-CASE1-OFFER-NOT-CREATED"
        conditions:
          DIAG-CASE1-GATE-01: "CASE1_BLOCKED"
          state.case1_block_code: "OFFER_NOT_CREATED"
        runbook: "RBK-ONLINE-OFFER-NOT-CREATED"
        description: "Case 1 gate: oa.ofrCrt is not true."
      - id: "ONLINE-CASE1-OTYPE-INVALID"
        conditions:
          DIAG-CASE1-GATE-01: "CASE1_BLOCKED"
          state.case1_block_code: "OTYPE_INVALID"
        runbook: "RBK-ONLINE-OTYPE-INVALID"
        description: "FC intent but oa.otyp is not ONLINE_ONLY or ONLINE_AND_STORE."
      - id: "ONLINE-CASE1-WFS-NOT-ELIGIBLE"
        conditions:
          DIAG-CASE1-GATE-01: "CASE1_BLOCKED"
          state.case1_block_code: "WFS_NOT_ELIGIBLE"
        runbook: "RBK-ONLINE-WFS-NOT-ELIGIBLE"
        description: "WFS intent but oa.wfsElig is not true."

      # ── Legacy soft gates (LLM-set state flags) ──
      - id: "ONLINE-OFFER-NOT-CREATED"
        conditions:
          DIAG-ODIN-01: "ODIN_OFFER_FOUND"
          state.offer_created: "false"
        runbook: "RBK-ONLINE-OFFER-NOT-CREATED"
        description: "ODIN offer not fully created (oa.ofrCrt != true)."
      - id: "ONLINE-OTYPE-INVALID"
        conditions:
          state.otype_invalid: "true"
        runbook: "RBK-ONLINE-OTYPE-INVALID"
        description: "Offer type is invalid for online eligibility."

      # ── Main intent: WFS ──
      - id: "ONLINE-WFS-NOT-ELIGIBLE"
        conditions:
          state.intent: "WFS"
          state.wfs_not_eligible: "true"
        runbook: "RBK-ONLINE-WFS-NOT-ELIGIBLE"
        description: "Caller chose WFS but oa.wfsElig is not true."

      # ── Main intent: FC (AURUM gate) ──
      - id: "ONLINE-AURUM-NODE-MISSING"
        conditions:
          state.intent: "FC"
          DIAG-ANALYZE-AURUM-FC: "AURUM_NODE_MISSING"
        runbook: "RBK-ONLINE-AURUM-NODE-MISSING"
        description: "FC intent but node missing from AURUM offerDistributorAttr.nodes."
      - id: "ONLINE-AURUM-NODE-INACTIVE"
        conditions:
          state.intent: "FC"
          DIAG-ANALYZE-AURUM-FC: "AURUM_NODE_INACTIVE"
        runbook: "RBK-ONLINE-AURUM-NODE-INACTIVE"
        description: "FC intent but node sts != ACTIVE or dccSts != true."

      # ── Main intent: MP (AURUM gate — same path as FC) ──
      - id: "ONLINE-MP-AURUM-NODE-MISSING"
        conditions:
          state.intent: "MP"
          DIAG-ANALYZE-AURUM-FC: "AURUM_NODE_MISSING"
        runbook: "RBK-ONLINE-AURUM-NODE-MISSING"
        description: "MP intent but node missing from AURUM offerDistributorAttr.nodes."
      - id: "ONLINE-MP-AURUM-NODE-INACTIVE"
        conditions:
          state.intent: "MP"
          DIAG-ANALYZE-AURUM-FC: "AURUM_NODE_INACTIVE"
        runbook: "RBK-ONLINE-AURUM-NODE-INACTIVE"
        description: "MP intent but node sts != ACTIVE or dccSts != true."

      # ── Sub-SOP: COST RT ──
      # Gate-driven (preferred) rows fire first.  The state.* legacy
      # rows remain as fallbacks for callers that haven't run the gate.
      - id: "ONLINE-COST-RT-GATE-NO-SI"
        conditions:
          state.sub_intent: "cost_rt"
          DIAG-COST-RT-GATE-01: "COST_RT_NO_SI"
        runbook: "RBK-ONLINE-COST-RT-NO-SI"
        description: "COST RT gate: IQS itemNumber missing."
      - id: "ONLINE-COST-RT-GATE-STORES-ONLY"
        conditions:
          state.sub_intent: "cost_rt"
          DIAG-COST-RT-GATE-01: "COST_RT_STORES_ONLY"
        runbook: "RBK-ONLINE-COST-RT-STORES-ONLY"
        description: "COST RT gate: Shipnode partnership type is STORE-only."
      - id: "ONLINE-COST-RT-GATE-INACTIVE"
        conditions:
          state.sub_intent: "cost_rt"
          DIAG-COST-RT-GATE-01: "COST_RT_INACTIVE"
        runbook: "RBK-ONLINE-COST-RT-INACTIVE"
        description: "COST RT gate: Shipnode is not ACTIVE."
      - id: "ONLINE-COST-RT-GATE-PROCEED"
        conditions:
          state.sub_intent: "cost_rt"
          DIAG-COST-RT-GATE-01: "COST_RT_PROCEED"
        runbook: "RBK-ONLINE-COST-RT-PROCEED"
        description: "COST RT gate clear — IQS resolved, shipnode ACTIVE, partner type permits COST RT."
      - id: "ONLINE-COST-RT-NO-SI"
        conditions:
          state.sub_intent: "cost_rt"
          DIAG-IQS-SI-01: "IQS_ITEM_MISSING"
        runbook: "RBK-ONLINE-COST-RT-NO-SI"
        description: "COST RT requested but IQS itemNumber missing (legacy fallback)."
      - id: "ONLINE-COST-RT-STORES-ONLY"
        conditions:
          state.sub_intent: "cost_rt"
          state.cost_rt_stores_only: "true"
        runbook: "RBK-ONLINE-COST-RT-STORES-ONLY"
        description: "COST RT — partnershipTypeCode is STORE-only (legacy fallback)."

      # ── Sub-SOP: Pre-Order ──
      - id: "ONLINE-PREORDER-GATE-SELLER-EXTERNAL"
        conditions:
          state.sub_intent: "pre_order"
          DIAG-PREORDER-VERDICT-01: "PREORDER_SELLER_EXTERNAL"
        runbook: "RBK-ONLINE-PREORDER-SELLER-EXTERNAL"
        description: "Pre-Order gate: EXTERNAL seller."
      - id: "ONLINE-PREORDER-GATE-PAST-DATE"
        conditions:
          state.sub_intent: "pre_order"
          DIAG-PREORDER-VERDICT-01: "PREORDER_PAST_STREET_DATE"
        runbook: "RBK-ONLINE-PREORDER-PAST-DATE"
        description: "Pre-Order streetDate is in the past — offer should no longer be pre-order."
      - id: "ONLINE-PREORDER-GATE-FUTURE-DATE"
        conditions:
          state.sub_intent: "pre_order"
          DIAG-PREORDER-VERDICT-01: "PREORDER_FUTURE_STREET_DATE"
        runbook: "RBK-ONLINE-PREORDER-FUTURE-DATE"
        description: "Pre-Order streetDate is in the future — offer is legitimately in pre-order."
      - id: "ONLINE-PREORDER-GATE-NO-STREET-DATE"
        conditions:
          state.sub_intent: "pre_order"
          DIAG-PREORDER-VERDICT-01: "PREORDER_NO_STREET_DATE"
        runbook: "RBK-ONLINE-PREORDER-NO-STREET-DATE"
        description: "Pre-Order requested but no streetDate present in Shipnodes / Consolidated."
      - id: "ONLINE-PREORDER-SELLER-EXTERNAL"
        conditions:
          state.sub_intent: "pre_order"
          state.seller_type: "EXTERNAL"
        runbook: "RBK-ONLINE-PREORDER-SELLER-EXTERNAL"
        description: "Pre-Order is not supported for EXTERNAL sellers (legacy fallback)."

      # ── Sub-SOP: Replenishable ──
      - id: "ONLINE-REPLEN-GATE-SELLER-EXTERNAL"
        conditions:
          state.sub_intent: "replenishable"
          DIAG-REPLENISHABLE-VERDICT-01: "REPLEN_SELLER_EXTERNAL"
        runbook: "RBK-ONLINE-REPLEN-SELLER-EXTERNAL"
        description: "Replenishable gate: EXTERNAL seller."
      - id: "ONLINE-REPLEN-GATE-MISMATCH"
        conditions:
          state.sub_intent: "replenishable"
          DIAG-REPLENISHABLE-VERDICT-01: "REPLEN_MISMATCH"
        runbook: "RBK-ONLINE-REPLEN-MISMATCH"
        description: "ODIN rplnFlg and Shipnodes replenishmentFlag disagree."
      - id: "ONLINE-REPLEN-GATE-TRUE"
        conditions:
          state.sub_intent: "replenishable"
          DIAG-REPLENISHABLE-VERDICT-01: "REPLEN_TRUE"
        runbook: "RBK-ONLINE-REPLEN-TRUE"
        description: "Replenishable: aligned true verdict."
      - id: "ONLINE-REPLEN-GATE-FALSE"
        conditions:
          state.sub_intent: "replenishable"
          DIAG-REPLENISHABLE-VERDICT-01: "REPLEN_FALSE"
        runbook: "RBK-ONLINE-REPLEN-FALSE"
        description: "Replenishable: aligned false verdict."
      - id: "ONLINE-REPLEN-GATE-MISSING"
        conditions:
          state.sub_intent: "replenishable"
          DIAG-REPLENISHABLE-VERDICT-01: "REPLEN_FLAG_MISSING"
        runbook: "RBK-ONLINE-REPLEN-MISSING"
        description: "Replenishable: neither ODIN nor Shipnodes populated the flag."
      - id: "ONLINE-REPLEN-SELLER-EXTERNAL"
        conditions:
          state.sub_intent: "replenishable"
          state.seller_type: "EXTERNAL"
        runbook: "RBK-ONLINE-REPLEN-SELLER-EXTERNAL"
        description: "Replenishable is not supported for EXTERNAL sellers (legacy fallback)."

      # ── Sub-SOP: ACS ──
      - id: "ONLINE-ACS-GATE-NOT-ENROLLED"
        conditions:
          state.sub_intent: "acs"
          DIAG-ACS-VERDICT-01: "ACS_NOT_ENROLLED"
        runbook: "RBK-ONLINE-ACS-SELLER-NOT-ENROLLED"
        description: "ACS gate: seller is not enrolled in ASE / ACS."
      - id: "ONLINE-ACS-GATE-ENROLLED"
        conditions:
          state.sub_intent: "acs"
          DIAG-ACS-VERDICT-01: "ACS_ENROLLED"
        runbook: "RBK-ONLINE-ACS-ENROLLED"
        description: "ACS gate: seller is enrolled in ASE / ACS."
      - id: "ONLINE-ACS-GATE-INPUTS-MISSING"
        conditions:
          state.sub_intent: "acs"
          DIAG-ACS-VERDICT-01: "ACS_INPUTS_MISSING"
        runbook: "RBK-ONLINE-ACS-INPUTS-MISSING"
        description: "ACS gate: none of the three enrollment signals populated."
      - id: "ONLINE-ACS-NOT-ENROLLED"
        conditions:
          state.sub_intent: "acs"
          state.acs_not_enrolled: "true"
        runbook: "RBK-ONLINE-ACS-SELLER-NOT-ENROLLED"
        description: "Seller is not enrolled in ACS / ASE (legacy fallback)."

      # ── Sub-SOP: FTC ──
      - id: "ONLINE-FTC-PHARMACY-PETS"
        conditions:
          state.sub_intent: "ftc"
          DIAG-FTC-MATRIX-01: "FTC_PHARMACY_PETS"
        runbook: "RBK-ONLINE-FTC-PHARMACY-PETS"
        description: "FTC matrix: Pharmacy / Pets channel."
      - id: "ONLINE-FTC-WMT-GIFT-CARD"
        conditions:
          state.sub_intent: "ftc"
          DIAG-FTC-MATRIX-01: "FTC_WALMART_PLASTIC_GIFT_CARD"
        runbook: "RBK-ONLINE-FTC-WMT-GIFT-CARD"
        description: "FTC matrix: Walmart Plastic Gift Card."
      - id: "ONLINE-FTC-NON-WMT-GIFT-CARD"
        conditions:
          state.sub_intent: "ftc"
          DIAG-FTC-MATRIX-01: "FTC_NON_WALMART_PLASTIC_GIFT_CARD"
        runbook: "RBK-ONLINE-FTC-NON-WMT-GIFT-CARD"
        description: "FTC matrix: Non-Walmart Plastic Gift Card."
      - id: "ONLINE-FTC-FREIGHT"
        conditions:
          state.sub_intent: "ftc"
          DIAG-FTC-MATRIX-01: "FTC_FREIGHT"
        runbook: "RBK-ONLINE-FTC-FREIGHT"
        description: "FTC matrix: Freight."
      - id: "ONLINE-FTC-PHOTOS"
        conditions:
          state.sub_intent: "ftc"
          DIAG-FTC-MATRIX-01: "FTC_PHOTOS"
        runbook: "RBK-ONLINE-FTC-PHOTOS"
        description: "FTC matrix: Photos."
      - id: "ONLINE-FTC-TIRE"
        conditions:
          state.sub_intent: "ftc"
          DIAG-FTC-MATRIX-01: "FTC_TIRE"
        runbook: "RBK-ONLINE-FTC-TIRE"
        description: "FTC matrix: Tire."
      - id: "ONLINE-FTC-DIGITAL"
        conditions:
          state.sub_intent: "ftc"
          DIAG-FTC-MATRIX-01: "FTC_DIGITAL"
        runbook: "RBK-ONLINE-FTC-DIGITAL"
        description: "FTC matrix: Digital."
      - id: "ONLINE-FTC-STANDARD"
        conditions:
          state.sub_intent: "ftc"
          DIAG-FTC-MATRIX-01: "FTC_STANDARD"
        runbook: "RBK-ONLINE-FTC-STANDARD"
        description: "FTC matrix: standard — main flow governs the verdict."

      # ── Sub-SOP: Seller Enforcement ──
      - id: "ONLINE-ENFORCEMENT-OFFER-NOT-CREATED"
        conditions:
          state.sub_intent: "enforcement"
          DIAG-ODIN-OFR-CRT-01: "OFFER_NOT_CREATED"
        runbook: "RBK-ONLINE-ENFORCEMENT-OFFER-NOT-CREATED"
        description: "Enforcement sub-SOP — Case 1 gate: oa.ofrCrt is not true."
      - id: "ONLINE-ENFORCEMENT-BLOCKED"
        conditions:
          state.sub_intent: "enforcement"
          DIAG-SELLER-ENFORCEMENT-CLASSIFY-01: "ENFORCEMENT_BLOCKED"
        runbook: "RBK-ONLINE-ENFORCEMENT-BLOCKED"
        description: "Relevant path (SELLER_PATH/WALMART_PATH) is in the seller's enforced restrictions."
      - id: "ONLINE-ENFORCEMENT-NOT-APPLICABLE"
        conditions:
          state.sub_intent: "enforcement"
          DIAG-SELLER-ENFORCEMENT-CLASSIFY-01: "ENFORCEMENT_NOT_APPLICABLE"
        runbook: "RBK-ONLINE-ENFORCEMENT-NOT-APPLICABLE"
        description: "Internal seller — enforcement check skipped."
      - id: "ONLINE-ENFORCEMENT-CLEAR"
        conditions:
          state.sub_intent: "enforcement"
          DIAG-SELLER-ENFORCEMENT-CLASSIFY-01: "ENFORCEMENT_CLEAR"
        runbook: "RBK-ONLINE-ENFORCEMENT-CLEAR"
        description: "Relevant path is not in the seller's enforced restrictions."

      # ── Sub-SOP: DEW Restriction ──
      - id: "ONLINE-RESTRICTION-OFFER-NOT-CREATED"
        conditions:
          state.sub_intent: "restriction"
          DIAG-ODIN-OFR-CRT-01: "OFFER_NOT_CREATED"
        runbook: "RBK-ONLINE-RESTRICTION-OFFER-NOT-CREATED"
        description: "Restriction sub-SOP — Case 1 gate: oa.ofrCrt is not true."
      - id: "ONLINE-RESTRICTION-PRESENT"
        conditions:
          state.sub_intent: "restriction"
          DIAG-DEW-RESTRICTION-GROUP-01: "DEW_RESTRICTIONS_PRESENT"
        runbook: "RBK-ONLINE-RESTRICTION-PRESENT"
        description: "DEW returned one or more restriction paths for this offer."
      - id: "ONLINE-RESTRICTION-NONE"
        conditions:
          state.sub_intent: "restriction"
          DIAG-DEW-RESTRICTION-GROUP-01: "DEW_NO_RESTRICTIONS"
        runbook: "RBK-ONLINE-RESTRICTION-NONE"
        description: "DEW returned no restriction paths for this offer."

      # ── Eligibility outcomes — main path ──
      - id: "ONLINE-FC-ELIGIBLE"
        conditions:
          state.intent: "FC"
          DIAG-ANALYZE-AURUM-FC: "AURUM_PATHS_PRESENT"
          DIAG-ANALYZE-CONSOLIDATED-FC: "CONSOLIDATED_FC_PATHS_PRESENT"
        runbook: "RBK-ONLINE-FC-ELIGIBLE"
        description: "FC eligibility paths present in AURUM and Consolidated."
      - id: "ONLINE-FC-PARTIAL"
        conditions:
          state.intent: "FC"
          DIAG-ANALYZE-AURUM-FC: "AURUM_PATHS_PRESENT"
          DIAG-ANALYZE-CONSOLIDATED-FC: "CONSOLIDATED_FC_NO_PATHS"
        runbook: "RBK-ONLINE-FC-PARTIAL"
        description: "AURUM has paths but Consolidated FC does not."
      - id: "ONLINE-FC-NOT-ELIGIBLE"
        conditions:
          state.intent: "FC"
          DIAG-ANALYZE-AURUM-FC: "AURUM_NO_PATHS"
        runbook: "RBK-ONLINE-FC-NOT-ELIGIBLE"
        description: "AURUM returned no FC paths."
      - id: "ONLINE-WFS-ELIGIBLE"
        conditions:
          state.intent: "WFS"
          state.wfs_eligible_true: "true"
        runbook: "RBK-ONLINE-WFS-ELIGIBLE"
        description: "WFS intent and oa.wfsElig is true."

      # ── Main intent: MP — eligibility driven by AURUM + Consolidated
      #    (same as FC; wfsElig is informational only at Case 1).
      - id: "ONLINE-MP-ELIGIBLE"
        conditions:
          state.intent: "MP"
          DIAG-ANALYZE-AURUM-FC: "AURUM_PATHS_PRESENT"
          DIAG-ANALYZE-CONSOLIDATED-FC: "CONSOLIDATED_FC_PATHS_PRESENT"
        runbook: "RBK-ONLINE-MP-ELIGIBLE"
        description: "MP eligibility paths present in AURUM and Consolidated."
      - id: "ONLINE-MP-PARTIAL"
        conditions:
          state.intent: "MP"
          DIAG-ANALYZE-AURUM-FC: "AURUM_PATHS_PRESENT"
          DIAG-ANALYZE-CONSOLIDATED-FC: "CONSOLIDATED_FC_NO_PATHS"
        runbook: "RBK-ONLINE-MP-PARTIAL"
        description: "MP intent — AURUM has paths but Consolidated does not."
      - id: "ONLINE-MP-NOT-ELIGIBLE"
        conditions:
          state.intent: "MP"
          DIAG-ANALYZE-AURUM-FC: "AURUM_NO_PATHS"
        runbook: "RBK-ONLINE-MP-NOT-ELIGIBLE"
        description: "MP intent — AURUM returned no FC paths."

    decision_fallback:
      runbook: "RBK-ONLINE-ESCALATE"
      description: "No rule matched — escalate for manual review."
    decision_error_codes:
      - "BAD_REQUEST"
      - "AUTH_ERROR"
      - "UPSTREAM_ERROR"
      - "UPSTREAM_UNAVAILABLE"
      - "RATE_LIMITED"
    risk: low
