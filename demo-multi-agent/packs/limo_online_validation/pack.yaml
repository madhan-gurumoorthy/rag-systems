# LIMO Online Eligibility Validation — SOP Pack
#
# Validates online eligibility for an (offer, node) pair across three
# main intents — MP, FC, WFS — and ten sub-SOPs (COST RT, Pre-Order,
# Replenishable, Shipsize, Ship Class, Sortable, Gifting, Substitution,
# ACS, FTC).  The MAIN intent is gathered via a Slack HITL menu when
# the inbound request does not pre-populate state.intent; sub-SOP
# routing is keyword-driven from the work-item text.
#
# Model credentials are configured in agent_factory/infrastructure/secrets.toml
# under [default.azure_chat] — NOT in this file.

id: limo_online_validation
name: LIMO Online Eligibility Validation
version: 0.1.0
description: >
  Validates online eligibility for an offer + node pair.  Walks
  ODIN → (HITL intent gate) → sub-intent dispatch → AURUM FC → DEW FC
  → Wakanda Promise → Eligibility Consolidated FC, with deterministic
  sub-SOPs for COST RT, Pre-Order, Replenishable, Shipsize, Ship
  Class, Sortable, Gifting, Substitution, ACS, and FTC.
owner_team: LIMO Ops
tenant_id: walmart-limo-ops
default: false
decision_engine: yaml_rules

# Model config — LLM is used by TriageAgent (offer/node extraction)
# and DiagnosticAgent (tool orchestration).
model:
  provider: azure_openai
  model: gpt-4.1-mini
  deployment: gpt-4.1-mini
  api_version: "2024-10-21"
  endpoint: https://wmtllmgateway.stage.walmart.com/wmtllmgateway
  max_tokens: 4096
  temperature: 0.1
  extra_params: {}

# Pre-triage gate — disabled.  Entry point is "validate offer X node Y",
# not a SNOW-routed ticket.  TriageAgent extracts the IDs from the
# inbound text instead.
pre_triage:
  enabled: false

rules_engine: {}

rag:
  domain: limo_online_validation
  rag_query_prefix: ""
  prompt_template: ""

# ── Display labels ────────────────────────────────────────────────
display:
  tool_names:
    diag_odin_01: "ODIN Offer Lookup"
    diag_aurum_fc_01: "AURUM FC Eligibility"
    diag_dew_fc_01: "DEW FC API"
    diag_promise_01: "Wakanda Promise"
    diag_consolidated_fc_01: "Eligibility Consolidated FC"
    diag_shipnodes_01: "Shipnodes Lookup"
    diag_iqs_si_01: "IQS SI Lookup"
    diag_dew_seller_01: "DEW Seller / ACS"
    diag_dcc_01: "DCC Distributor Check"
    diag_classify_intent: "Intent Classifier"
    diag_classify_sub_intent: "Sub-Intent Dispatcher"
    diag_offer_id_validate_01: "Offer ID Validator"
    diag_intent_extract_01: "Intent Detector"
    diag_case1_gate_01: "Case 1 Gate"
    diag_odin_ofr_crt_01: "ODIN Offer-Created Gate"
    diag_seller_enforcement_fetch_01: "Seller Enforcement Lookup"
    diag_seller_enforcement_classify_01: "Seller Enforcement Classifier"
    diag_dew_restriction_fetch_01: "DEW Restriction Lookup"
    diag_dew_restriction_group_01: "DEW Restriction Grouper"
    diag_analyze_aurum_fc: "AURUM FC Analyzer"
    diag_analyze_dew_fc: "DEW FC Analyzer"
    diag_analyze_promise: "Promise Analyzer"
    diag_analyze_consolidated_fc: "Consolidated FC Analyzer"
    diag_analyze_substitution: "Substitution Analyzer"
    diag_derive_shipsize: "Shipsize Derivation"
    diag_decision_matrix: "Decision Matrix"
  outcome_labels:
    ODIN_OFFER_FOUND: "ODIN offer found"
    ODIN_NOT_FOUND: "ODIN offer not found"
    INTENT_REQUIRED: "Main intent required (MP/FC/WFS)"
    INTENT_RESOLVED: "Main intent resolved"
    SUB_INTENT_MAIN: "Main eligibility flow"
    SUB_INTENT_COST_RT: "COST RT sub-SOP"
    SUB_INTENT_PRE_ORDER: "Pre-Order sub-SOP"
    SUB_INTENT_REPLENISHABLE: "Replenishable sub-SOP"
    SUB_INTENT_SHIPSIZE: "Shipsize sub-SOP"
    SUB_INTENT_SHIP_CLASS: "Ship Class sub-SOP"
    SUB_INTENT_SORTABLE: "Sortable sub-SOP"
    SUB_INTENT_GIFTING: "Gifting sub-SOP"
    SUB_INTENT_SUBSTITUTION: "Substitution sub-SOP"
    SUB_INTENT_ACS: "ACS sub-SOP"
    SUB_INTENT_FTC: "FTC sub-SOP"
    SUB_INTENT_ENFORCEMENT: "Seller Enforcement sub-SOP"
    SUB_INTENT_RESTRICTION: "DEW Restriction sub-SOP"
    OFFER_FULLY_CREATED: "Offer is fully created (oa.ofrCrt=true)"
    OFFER_NOT_CREATED: "Offer not fully created (oa.ofrCrt!=true)"
    OFFER_CRT_UNKNOWN: "Offer-created flag missing or unparseable"
    OFFER_ID_VALID: "Offer ID matches the 32-char hex contract"
    OFFER_ID_INVALID: "Offer ID does not match the 32-char hex contract"
    CASE1_PROCEED: "Case 1 gates pass — continue to AURUM"
    CASE1_BLOCKED: "Case 1 gate failed — see block_code for the cause"
    ENFORCEMENT_NOT_APPLICABLE: "Internal seller — enforcement skipped"
    ENFORCEMENT_CLEAR: "Relevant path not enforced"
    ENFORCEMENT_BLOCKED: "Relevant path is enforced"
