      - name: DecisionAgent
        role: Maps observations to an online eligibility runbook verdict
        prompt_file: decision.j2
        tools:
          - DIAG-DECISION-MATRIX

      - name: ActionAgent
        role: Read-only pack — actions are limited to the HITL intent pick
        prompt_file: action.j2
        tools: []

      - name: ClosureAgent
        role: Renders the closure template with the eligibility summary
        prompt_file: closure.j2
        tools: []

