    SHIPNODE_NOT_FOUND: "Shipnode record not found"
    IQS_ITEM_PRESENT: "IQS itemNumber resolved"
    IQS_ITEM_MISSING: "IQS itemNumber missing"
    DEW_SELLER_PRESENT: "DEW seller record present"
    DEW_SELLER_MISSING: "DEW seller record missing"
    DCC_PRESENT: "DCC record present"
    DCC_MISSING: "DCC record missing"
    SHIPSIZE_DERIVED: "Shipsize derived from dimensions"
    SHIPSIZE_INPUTS_MISSING: "Shipsize inputs missing"

# ── Resolution status mapping ─────────────────────────────────────
resolution_statuses:
  statuses:
    resolved: "resolved"
    escalated: "escalated"
    investigation_required: "investigation_required"
    blocked: "blocked"
    pending_intent: "pending_intent"
  closure_pattern: '^[\s\-\*>#]*\**\s*status:\s*\**\s*(.+?)[\s\*]*$'
  default_status: "investigation_required"

safety_net_overrides: []
safety_net_dimension_checks: []

# ── Triage extraction (deterministic) ─────────────────────────────
# Two inputs need to be pulled out of the natural-language request:
#   - offer_id: 32-char uppercase hex (the ODIN Offer ID)
#   - node_id : short decimal node number (1–8 digits)
# external_ref_pattern matches the offer id so it lands on
# state.external_ref; node_id is pulled from the named aliases below.
triage_extraction:
  external_ref_pattern: "([A-F0-9]{32})"
  fields:
    - name: offer_id
      aliases: ["Offer", "Offer ID", "OfferId", "offerId", "OID", "offer"]
      required: true
    - name: node_id
      aliases: ["Node", "Node ID", "NodeId", "nodeId", "Distributor", "FC", "fc"]
      required: true
  symptom_rules:
    - symptom: online_eligibility
      keywords: ["online", "eligibility", "fc", "wfs", "mp", "marketplace", "limo"]
  default_symptom: online_eligibility
  description_marker: "--- Full Description ---"

# ── Evidence field extraction ─────────────────────────────────────
evidence_extraction:
  defaults: {}
  rules:
    # ── ODIN fields ──
    - field: offer_id
      tool_match: odin_01
      preview_keys: ["offer_id"]
    - field: seller_id
      tool_match: odin_01
      preview_keys: ["seller_id"]
    - field: seller_type
      tool_match: odin_01
      preview_keys: ["seller_type"]
    - field: offer_created
      tool_match: odin_01
      preview_keys: ["offer_created"]
    - field: offer_type
      tool_match: odin_01
      preview_keys: ["offer_type"]
    - field: product_id
      tool_match: odin_01
      preview_keys: ["product_id"]
    - field: wfs_eligible
      tool_match: odin_01
      preview_keys: ["wfs_eligible"]
    - field: ftc
      tool_match: odin_01
      preview_keys: ["ftc"]
    - field: item_class_id
      tool_match: odin_01
      preview_keys: ["item_class_id"]
    - field: goods_and_svc_type
      tool_match: odin_01
      preview_keys: ["goods_and_svc_type"]
    - field: ship_size_code_odin
      tool_match: odin_01
      preview_keys: ["ship_size_code_odin"]
    - field: ship_class_code
      tool_match: odin_01
      preview_keys: ["ship_class_code"]
    - field: sortable_flag_odin
      tool_match: odin_01
      preview_keys: ["sortable_flag_odin"]
    - field: ase_odin
      tool_match: odin_01
      preview_keys: ["ase_odin"]
    - field: product_type
      tool_match: odin_01
      preview_keys: ["product_type"]
    - field: acc_d_nbr
      tool_match: odin_01
      preview_keys: ["acc_d_nbr"]
    - field: approved_for_animals
      tool_match: odin_01
      preview_keys: ["approved_for_animals"]
    - field: replen_flag_odin
      tool_match: odin_01
      preview_keys: ["replen_flag_odin"]
    # ── Intent classifier ──
    - field: intent
      tool_match: classify_intent
      preview_keys: ["intent"]
    - field: sub_intent
      tool_match: classify_sub_intent
      preview_keys: ["sub_intent"]
    # ── AURUM FC analyzer ──
    - field: aurum_node_id
      tool_match: analyze_aurum_fc
      preview_keys: ["aurum_node_id"]
    - field: aurum_node_type
      tool_match: analyze_aurum_fc
      preview_keys: ["aurum_node_type"]
    - field: aurum_node_status
      tool_match: analyze_aurum_fc
      preview_keys: ["aurum_node_status"]
    - field: aurum_dcc_status
      tool_match: analyze_aurum_fc
      preview_keys: ["aurum_dcc_status"]
    - field: aurum_inclusions
      tool_match: analyze_aurum_fc
      preview_keys: ["inclusions"]
    - field: aurum_exclusions
      tool_match: analyze_aurum_fc
      preview_keys: ["exclusions"]
    # ── DEW / Promise / Consolidated ──
    - field: dew_paths
      tool_match: analyze_dew_fc
      preview_keys: ["paths"]
    - field: promise_present
      tool_match: analyze_promise
      preview_keys: ["promise_present"]
    - field: promise_paths
      tool_match: analyze_promise
      preview_keys: ["paths"]
    - field: consolidated_paths
      tool_match: analyze_consolidated_fc
      preview_keys: ["paths"]
    - field: fulfillment_speed
      tool_match: analyze_consolidated_fc
      preview_keys: ["fulfillment_speed"]
    # ── Sub-SOP evidence ──
    - field: iqs_item_number
      tool_match: iqs_si_01
      preview_keys: ["iqs_item_number"]
    - field: iqs_partnership_type_code
      tool_match: shipnodes_01
      preview_keys: ["iqs_partnership_type_code"]
    - field: shipnode_status
      tool_match: shipnodes_01
      preview_keys: ["shipnode_status"]
    - field: shipnode_item_id
      tool_match: shipnodes_01
      preview_keys: ["shipnode_item_id"]
    - field: legacy_distributor_id
      tool_match: shipnodes_01
      preview_keys: ["legacy_distributor_id"]
    - field: ase_status
      tool_match: dew_seller_01
      preview_keys: ["ase_status"]
    - field: ase_seller
      tool_match: dew_seller_01
      preview_keys: ["ase_seller"]
    - field: acs_enabled
      tool_match: dcc_01
      preview_keys: ["acs_enabled"]
    - field: substitution_restrictions
      tool_match: analyze_substitution
      preview_keys: ["restrictions"]
    - field: substitution_restrictions_csv
      tool_match: analyze_substitution
      preview_keys: ["restrictions_csv"]
    - field: shipsize_derived
      tool_match: derive_shipsize
      preview_keys: ["shipsize_derived"]
    - field: girth
      tool_match: derive_shipsize
      preview_keys: ["girth"]
    - field: shipsize_logic_note
      tool_match: derive_shipsize
      preview_keys: ["shipsize_logic_note"]
    # ── Seller Enforcement ──
    - field: offer_fully_created
      tool_match: odin_ofr_crt_01
      preview_keys: ["ofr_crt_norm"]
    - field: enforcement_scope
      tool_match: seller_enforcement_classify_01
      preview_keys: ["scope"]
    - field: enforcement_blocked
      tool_match: seller_enforcement_classify_01
      preview_keys: ["blocked"]
    - field: enforced_paths
      tool_match: seller_enforcement_classify_01
      preview_keys: ["enforced"]
    # ── DEW Restriction ──
    - field: restriction_groups
      tool_match: dew_restriction_group_01
      preview_keys: ["groups"]
    # ── Sub-SOP analyzers + gates ──
    - field: preorder_flag
      tool_match: analyze_preorder_consolidated
      preview_keys: ["preorder_flag"]
    - field: preorder_consolidated_street_date
      tool_match: analyze_preorder_consolidated
      preview_keys: ["preorder_consolidated_street_date"]
    - field: preorder_street_date
      tool_match: analyze_preorder_shipnodes
      preview_keys: ["preorder_street_date"]
    - field: replenishment_flag
      tool_match: analyze_replenishable_shipnodes
      preview_keys: ["replenishment_flag"]
    - field: unit_height
      tool_match: analyze_shipsize_consolidated
      preview_keys: ["unit_height"]
    - field: unit_length
      tool_match: analyze_shipsize_consolidated
      preview_keys: ["unit_length"]
    - field: unit_width
      tool_match: analyze_shipsize_consolidated
      preview_keys: ["unit_width"]
    - field: unit_weight
      tool_match: analyze_shipsize_consolidated
      preview_keys: ["unit_weight"]
    - field: shipsize_consolidated
      tool_match: analyze_shipsize_consolidated
      preview_keys: ["shipsize_consolidated"]
    - field: sortable_consolidated
      tool_match: analyze_sortable_consolidated
      preview_keys: ["sortable_consolidated"]
    - field: gifting_eligibility
      tool_match: analyze_gifting
      preview_keys: ["gifting_eligibility"]
    - field: allow_gift_message
      tool_match: analyze_gifting
      preview_keys: ["allow_gift_message"]
    - field: allow_gift_receipt
      tool_match: analyze_gifting
      preview_keys: ["allow_gift_receipt"]
    - field: allow_gift_wrap
      tool_match: analyze_gifting
      preview_keys: ["allow_gift_wrap"]
    - field: gift_overbox_eligible
      tool_match: analyze_gifting
      preview_keys: ["gift_overbox_eligible"]
    - field: ftc_consolidated
      tool_match: analyze_ftc_consolidated
      preview_keys: ["ftc_consolidated"]
    - field: preorder_verdict
      tool_match: preorder_verdict
      preview_keys: ["preorder_verdict"]
    # ── Case 1 deterministic gate ──
    - field: case1_block_code
      tool_match: case1_gate_01
      preview_keys: ["block_code"]
    - field: case1_block_reason
      tool_match: case1_gate_01
      preview_keys: ["stop_message"]
    - field: case1_notice_code
      tool_match: case1_gate_01
      preview_keys: ["notice_code"]
    - field: case1_notice_message
      tool_match: case1_gate_01
      preview_keys: ["notice_message"]

# ── Closure templates + verdict inference ─────────────────────────
# Two templates only — closure.j2 renders the universal main + sub-SOP
# blocks (driven by state.intent + state.sub_intent), closure_blocked.j2
# renders an early-stop summary when ODIN / intent gate / sub-SOP
# preconditions fail.
closure_templates:
  verdict_field: verdict
  template_map:
    ELIGIBLE: closure.j2
    PARTIAL: closure.j2
    NOT_ELIGIBLE: closure.j2
    BLOCKED: closure_blocked.j2
    PENDING_INTENT: closure_blocked.j2
  default_template: closure.j2
  fallback_verdict: BLOCKED
  verdict_inference:
    - verdict: ELIGIBLE
      runbook_keywords:
        - "RBK-ONLINE-FC-ELIGIBLE"
        - "RBK-ONLINE-WFS-ELIGIBLE"
        - "RBK-ONLINE-MP-ELIGIBLE"
        - "RBK-ONLINE-ENFORCEMENT-CLEAR"
        - "RBK-ONLINE-ENFORCEMENT-NOT-APPLICABLE"
        - "RBK-ONLINE-RESTRICTION-NONE"
        - "RBK-ONLINE-COST-RT-PROCEED"
        - "RBK-ONLINE-PREORDER-FUTURE-DATE"
        - "RBK-ONLINE-REPLEN-TRUE"
        - "RBK-ONLINE-ACS-ENROLLED"
        - "RBK-ONLINE-FTC-PHARMACY-PETS"
        - "RBK-ONLINE-FTC-WMT-GIFT-CARD"
        - "RBK-ONLINE-FTC-NON-WMT-GIFT-CARD"
        - "RBK-ONLINE-FTC-FREIGHT"
        - "RBK-ONLINE-FTC-PHOTOS"
        - "RBK-ONLINE-FTC-TIRE"
        - "RBK-ONLINE-FTC-DIGITAL"
        - "RBK-ONLINE-FTC-STANDARD"
    - verdict: PARTIAL
      runbook_keywords:
        - "RBK-ONLINE-FC-PARTIAL"
        - "RBK-ONLINE-MP-PARTIAL"
    - verdict: NOT_ELIGIBLE
      runbook_keywords:
        - "RBK-ONLINE-FC-NOT-ELIGIBLE"
        - "RBK-ONLINE-WFS-NOT-ELIGIBLE"
        - "RBK-ONLINE-MP-NOT-ELIGIBLE"
        - "RBK-ONLINE-AURUM-NODE-MISSING"
        - "RBK-ONLINE-AURUM-NODE-INACTIVE"
        - "RBK-ONLINE-ENFORCEMENT-BLOCKED"
        - "RBK-ONLINE-RESTRICTION-PRESENT"
        - "RBK-ONLINE-COST-RT-INACTIVE"
        - "RBK-ONLINE-PREORDER-PAST-DATE"
        - "RBK-ONLINE-REPLEN-FALSE"
        - "RBK-ONLINE-REPLEN-MISMATCH"
    - verdict: PENDING_INTENT
      runbook_keywords: ["RBK-ONLINE-INTENT-REQUIRED"]
    - verdict: BLOCKED
      runbook_keywords:
        - "RBK-ONLINE-ODIN-NOT-FOUND"
        - "RBK-ONLINE-OFFER-NOT-CREATED"
        - "RBK-ONLINE-OTYPE-INVALID"
        - "RBK-ONLINE-COST-RT-NO-SI"
        - "RBK-ONLINE-COST-RT-STORES-ONLY"
        - "RBK-ONLINE-PREORDER-SELLER-EXTERNAL"
        - "RBK-ONLINE-PREORDER-NO-STREET-DATE"
        - "RBK-ONLINE-REPLEN-SELLER-EXTERNAL"
        - "RBK-ONLINE-REPLEN-MISSING"
        - "RBK-ONLINE-ACS-SELLER-NOT-ENROLLED"
        - "RBK-ONLINE-ACS-INPUTS-MISSING"
        - "RBK-ONLINE-ENFORCEMENT-OFFER-NOT-CREATED"
        - "RBK-ONLINE-RESTRICTION-OFFER-NOT-CREATED"
        - "RBK-ONLINE-ESCALATE"
  post_verdict_actions: []

# ── Approved actions ──────────────────────────────────────────────
# The HITL gate exposes three "approved actions" — one per main
# intent.  Each is a no-op tool whose effect is captured purely
# through the resume_value of the Slack callback (the framework
# encodes the selected action's payload into resume_value, which the
# pipeline picks up as state.intent on resume).
approved_actions:
  - id: pick_mp
    tool: ACT-NOOP-01
    enabled: true
    requires_external_id: false
    params:
      intent: "MP"
    state_params: []
    closure_fields: []
    slack_success: "✅ Continuing with **MP** intent"
    slack_failure: "❌ Failed to record MP selection: {error}"

  - id: pick_fc
    tool: ACT-NOOP-01
    enabled: true
    requires_external_id: false
    params:
      intent: "FC"
    state_params: []
    closure_fields: []
    slack_success: "✅ Continuing with **FC** intent"
    slack_failure: "❌ Failed to record FC selection: {error}"

  - id: pick_wfs
    tool: ACT-NOOP-01
    enabled: true
    requires_external_id: false
    params:
      intent: "WFS"
    state_params: []
    closure_fields: []
    slack_success: "✅ Continuing with **WFS** intent"
    slack_failure: "❌ Failed to record WFS selection: {error}"

# ── Approval workflow ─────────────────────────────────────────────
# HITL gate: when classify_intent emits INTENT_REQUIRED, the runtime
# posts a Slack menu with three buttons (MP / FC / WFS).  The
# resume_value carries the selected intent back into state.intent,
# the graph re-enters classify_intent and proceeds to INTENT_RESOLVED.
approval_workflow:
  enabled: true
  provider: slack
  provider_display_name: "Slack"
  findings_extractors:
    - field: offer_id
      tool: __state__
      path: "offer_id"
    - field: node_id
      tool: __state__
      path: "node_id"
    - field: seller_id
      tool: diag_odin_01
      path: "seller_id"
    - field: seller_type
      tool: diag_odin_01
      path: "seller_type"
    - field: wfs_eligible
      tool: diag_odin_01
      path: "wfs_eligible"
    - field: product_id
      tool: diag_odin_01
      path: "product_id"
  verdict_field: verdict
  verdict_actions:
    PENDING_INTENT:
      actions:
        - pick_fc
        - pick_wfs
        - pick_mp
      previews:
        status: "Awaiting human input — select MP, FC, or WFS"
        prompt: >
          Which fulfillment intent should we validate for this
          (offer, node)?  FC = Walmart 1P fulfillment, WFS = Walmart
          Fulfillment Services, MP = Marketplace seller-fulfilled.
    DEFAULT:
      actions: []
      previews:
        status: "Validation complete — see closure summary"
  fallback_verdict: BLOCKED

# ── Slack notification config ─────────────────────────────────────
slack:
  client_name: "limo-online-eligibility-agent"
  client_version: "0.1.0"
  thread_title_template: "🛒 {ref_link} — LIMO Online Eligibility"
  thread_title_fallback: "🛒 *{external_ref}* — LIMO Online Eligibility"
  notify_context_fields:
    - label: "Offer"
      raw_keys: ["offer_id"]
    - label: "Node"
      raw_keys: ["node_id"]
    - label: "Seller"
      raw_keys: ["seller_id"]
    - label: "Intent"
      raw_keys: ["intent"]
    - label: "Sub-SOP"
      raw_keys: ["sub_intent"]

# ── Runtime entry points ──────────────────────────────────────────
runtime:
  state_schema: "packs.limo_online_validation.state:OnlineEligibilityState"
  state_factory: "packs.limo_online_validation.state:empty_online_eligibility_state"

# ── Pipelines ─────────────────────────────────────────────────────
pipelines:
  incident:
    type: selector
    max_turns: 250
    termination_agent: ClosureAgent
    selector_prompt: >
      You are the orchestrator for the LIMO Online Eligibility
      pipeline.  Select the NEXT agent strictly based on pipeline
      stage.  Each agent speaks ONCE per resume cycle.

      PIPELINE ORDER (strictly sequential — never go backward):
        1. TriageAgent     → extracts offer_id + node_id from the
                              user request, classifies sub-intent
                              from the work-item text.
        2. DiagnosticAgent → calls ODIN, classifies main intent
                              (HITL Slack gate when missing), then
                              walks AURUM FC + DEW FC + Promise +
                              Consolidated, plus the matching sub-SOP
                              tools.
        3. DecisionAgent   → mapped deterministically by the runtime.
        4. ActionAgent     → no-op for the closing pass; the HITL
                              gate fires from DecisionAgent when the
                              verdict is PENDING_INTENT.
        5. ClosureAgent    → renders the closure template and terminates.

      RULES:
        - NEVER select an agent that has already produced output in
          the current cycle.
        - On HITL resume (intent supplied via Slack), restart from
          DiagnosticAgent so the post-intent path runs.
        - After ClosureAgent speaks, the pipeline MUST end.
    agents:
      - name: TriageAgent
        role: Extracts offer_id, node_id, and the sub-intent from the inbound request
        prompt_file: triage.j2
